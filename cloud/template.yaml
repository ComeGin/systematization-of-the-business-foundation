AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >-
  ComeGin の本番環境（ap-northeast-1）。親スタック。子スタックを AWS::Serverless::Application で呼ぶ。
  子スタック同士は、この親が !GetAtt <Child>.Outputs.<Name> をパラメータに渡す形だけでつなぐ
  （Fn::ImportValue と Export は使わない）。設計は docs/RequirementDefinition/TA/06-aws-runtime.md。
  us-east-1 の ACM と CloudFront 用 WAF は別スタック（global/template.yaml。先にデプロイする）。

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: { default: 全体 }
        Parameters: [EnvName, DomainName, HostedZoneId]
      - Label: { default: ホスト名（ALB の振り分け。TA-06 の 5.1） }
        Parameters: [ChatHost, MktHost, AuthHost, ConsentHost]
      - Label: { default: Astro の配信（CloudFront。global/template.yaml の出力を写す） }
        Parameters: [SiteHost, CloudFrontCertificateArn, CloudFrontWebAclArn]
      - Label: { default: コンテナの待ち受けポート }
        Parameters: [MauticWebPort, ChatwootWebPort, AdminAuthPort, ConsentApiPort]
      - Label: { default: 管理者の認証（ALB の authenticate-oidc） }
        Parameters: [AlbOidcClientId]
      - Label: { default: データストア（暫定値） }
        Parameters: [MysqlInstanceClass, PostgresInstanceClass, ValkeyNodeType]
      - Label: { default: オンプレとの WireGuard（ADR-21。wireguard.yaml） }
        Parameters: [OnpremWireguardCidr, WireguardServerAddress, OnpremPeerAddress, WireguardPort, WireguardIngressCidr, OnpremWebhookPort, OnpremWireguardPublicKey, WireguardInstanceType, WireguardAmiSsmId, WireguardFixedAmiId]
      - Label: { default: WAF（暫定値） }
        Parameters: [WafRateLimitConsent, WafRateLimitForm, WafRateLimitApi, WafRateLimitVisitor, WafRateLimitAuth, WafCommonRuleSetAction]
      - Label: { default: サービスのイメージのタグ（製品ごと。latest は使えない） }
        Parameters: [MauticImageTag, ChatwootImageTag, AdminAuthImageTag, ConsentApiImageTag]
      - Label: { default: サービスの台数・CPU・メモリ（暫定値。台数は 0 が初期値） }
        Parameters: [MauticWebDesiredCount, MauticWebCpu, MauticWebMemory, MauticCronDesiredCount, MauticCronCpu, MauticCronMemory, ChatwootWebDesiredCount, ChatwootWebCpu, ChatwootWebMemory, ChatwootWorkerDesiredCount, ChatwootWorkerCpu, ChatwootWorkerMemory, AdminAuthDesiredCount, AdminAuthCpu, AdminAuthMemory, ConsentApiDesiredCount, ConsentApiCpu, ConsentApiMemory]
      - Label: { default: サービスの設定 }
        Parameters: [VpcCidr, RdsCaSha256, MauticMountConfigVolume, ChatwootMailerSenderEmail, GoogleClientId, AdminBootstrapEmails, ConsentPolicyVersion]
      - Label: { default: 通知と監視 }
        Parameters: [HeartbeatAlarmActionsEnabled]
      - Label: { default: E-15 の写し }
        Parameters: [RunLogAdminPrincipalArns]

Parameters:
  EnvName:
    Type: String
    Default: prod
    Description: 環境名。リソース名に入る。
  DomainName:
    Type: String
    Default: comegin.com
  HostedZoneId:
    Type: String
    Default: Z0000211V2SV6GQWKMCL
    Description: DomainName の Route 53 ホストゾーン（作成済み）。ACM の DNS 検証、エイリアス、SES の DKIM に使う。

  ChatHost:
    Type: String
    Default: chat.comegin.com
    Description: chatwoot-web（確定）
  MktHost:
    Type: String
    Default: mkt.comegin.com
    Description: mautic-web（確定）
  # stats.（以前のアクセス解析）は ADR-25 で外した。アクセス解析は GA4（SaaS）で、クラウドに置くものが無い。
  AuthHost:
    Type: String
    Default: auth.comegin.com
    Description: admin-auth（確定）
  ConsentHost:
    Type: String
    Default: consent.comegin.com
    Description: consent-api。案。同意の Cookie を公開サイトの JavaScript が読めるよう、同一サイトのサブドメインにする。

  SiteHost:
    Type: String
    Default: comegin.com
    Description: Astro の公開ホスト名。global/template.yaml の SiteHost と同じにする。TODO(未決定) apex か www か（TA-02 の 9 節）。
  CloudFrontCertificateArn:
    Type: String
    Description: 必須（既定なし）。global/template.yaml（us-east-1）の出力 CertificateArn。
  CloudFrontWebAclArn:
    Type: String
    Description: 必須（既定なし）。global/template.yaml（us-east-1）の出力 WebAclArn。

  # コンテナの待ち受けポート。network.yaml の SG、edge.yaml のターゲットグループ、各サービスのタスク定義で同じ値を使う。
  MauticWebPort:
    Type: Number
    Default: 80
  ChatwootWebPort:
    Type: Number
    Default: 3000
  AdminAuthPort:
    Type: Number
    Default: 3103
  ConsentApiPort:
    Type: Number
    Default: 3104

  AlbOidcClientId:
    Type: String
    Default: alb
    Description: ALB の authenticate-oidc のクライアント ID。admin-auth の ALB_CLIENT_ID と同じ値になる。

  # 暫定値（TA-06 の 9 節の見積もり前）。
  MysqlInstanceClass:
    Type: String
    Default: db.t4g.micro
  PostgresInstanceClass:
    Type: String
    Default: db.t4g.small
  ValkeyNodeType:
    Type: String
    Default: cache.t4g.micro

  # WAF（5 分あたり・送信元 IP あたりのリクエスト数。暫定。実測して決める）
  WafRateLimitConsent:
    Type: Number
    Default: 30
  WafRateLimitForm:
    Type: Number
    Default: 100
  WafRateLimitApi:
    Type: Number
    Default: 1000
  WafRateLimitVisitor:
    Type: Number
    Default: 2000
  WafRateLimitAuth:
    Type: Number
    Default: 300
  WafCommonRuleSetAction:
    Type: String
    Default: Count
    AllowedValues: [Count, Block]
    Description: 管理画面の誤検知が無いことを WAF のログで確かめてから Block にする。

  HeartbeatAlarmActionsEnabled:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: ハートビートのアラームの通知を有効にするか。監視アプリが信号を送り始めるまでは通知が出る。
  RunLogAdminPrincipalArns:
    Type: CommaDelimitedList
    Description: >-
      必須（既定なし）。E-15 の写しのバケットの削除系・設定変更系の拒否を免除する主体の ARN。
      デプロイに使う主体（IAM ユーザー comegin-iam、または CloudFormation のサービスロール）の ARN を入れる。
      入れないと、スタック自身の更新も拒否される。

  # ---- サービス（T1-3）
  # ECR のタグは「<上流のタグ>-<ビルドの連番>」（RDS の CA を足した派生イメージ。cloud/images/<製品>/Dockerfile。README の 4.7）。
  # イメージのタグはサービスごとではなく製品ごと（mautic-web と mautic-cron、chatwoot-web と chatwoot-worker は同じタグ。ずれを防ぐ）。
  # latest は使えない。REPLACE-WITH-FIXED-TAG のままでは起動しない（DesiredCount は 0 が初期値）。
  MauticImageTag:
    Type: String
    AllowedPattern: '^(?!latest$).+$'
    ConstraintDescription: latest は使えない。バージョンのタグで固定する。
    Default: 7.2.0-1
  ChatwootImageTag:
    Type: String
    AllowedPattern: '^(?!latest$).+$'
    ConstraintDescription: latest は使えない。バージョンのタグで固定する。
    Default: v4.18.0-1
  AdminAuthImageTag:
    Type: String
    AllowedPattern: '^(?!latest$).+$'
    ConstraintDescription: latest は使えない。バージョンのタグで固定する。
    Default: REPLACE-WITH-FIXED-TAG
  ConsentApiImageTag:
    Type: String
    AllowedPattern: '^(?!latest$).+$'
    ConstraintDescription: latest は使えない。バージョンのタグで固定する。
    Default: REPLACE-WITH-FIXED-TAG
  MauticWebDesiredCount:
    Type: Number
    Default: 0
    AllowedValues: [0, 1]
  MauticWebCpu:
    Type: String
    Default: '1024'
    AllowedValues: ['256', '512', '1024', '2048', '4096']
  MauticWebMemory:
    Type: String
    Default: '2048'
  MauticCronDesiredCount:
    Type: Number
    Default: 0
    AllowedValues: [0, 1]
  MauticCronCpu:
    Type: String
    Default: '512'
    AllowedValues: ['256', '512', '1024', '2048', '4096']
  MauticCronMemory:
    Type: String
    Default: '1024'
  ChatwootWebDesiredCount:
    Type: Number
    Default: 0
    MinValue: 0
  ChatwootWebCpu:
    Type: String
    Default: '1024'
    AllowedValues: ['256', '512', '1024', '2048', '4096']
  ChatwootWebMemory:
    Type: String
    Default: '2048'
  ChatwootWorkerDesiredCount:
    Type: Number
    Default: 0
    MinValue: 0
  ChatwootWorkerCpu:
    Type: String
    Default: '512'
    AllowedValues: ['256', '512', '1024', '2048', '4096']
  ChatwootWorkerMemory:
    Type: String
    Default: '1024'
  AdminAuthDesiredCount:
    Type: Number
    Default: 0
    MinValue: 0
  AdminAuthCpu:
    Type: String
    Default: '256'
    AllowedValues: ['256', '512', '1024', '2048', '4096']
  AdminAuthMemory:
    Type: String
    Default: '512'
  ConsentApiDesiredCount:
    Type: Number
    Default: 0
    MinValue: 0
  ConsentApiCpu:
    Type: String
    Default: '256'
    AllowedValues: ['256', '512', '1024', '2048', '4096']
  ConsentApiMemory:
    Type: String
    Default: '512'
  # ---- オンプレとの WireGuard（ADR-21。TA-06 の 5.6・wireguard.yaml）
  OnpremWireguardCidr:
    Type: String
    Default: 10.99.0.0/24
    Description: WireGuard のアドレス帯（VPC の外。VpcCidr と重ならない）。private サブネットの経路表の宛先と、EC2 の nftables に使う。EC2 の wg0 は WireguardServerAddress/24。
  WireguardServerAddress:
    Type: String
    Default: 10.99.0.1
    Description: EC2 側の WireGuard のアドレス（OnpremWireguardCidr の中。/24 で割り当てる）。
  OnpremPeerAddress:
    Type: String
    Default: 10.99.0.2
    Description: オンプレ側の WireGuard のアドレス。Webhook の宛先と、EC2 のピアの AllowedIPs（/32）になる。
  WireguardPort:
    Type: Number
    Default: 51820
    Description: WireGuard の待ち受け UDP ポート。
  WireguardIngressCidr:
    Type: String
    Default: 0.0.0.0/0
    Description: WireGuard の UDP を受ける送信元の CIDR。オンプレの送信元 IP が固定でないため既定は 0.0.0.0/0（守りは WireGuard の鍵の認証）。固定の IP が使えるなら絞る。
  OnpremWebhookPort:
    Type: Number
    Default: 5680
    Description: オンプレのリバースプロキシ（n8n の /webhook/* だけを通す）のポート。OnpremPeerAddress にだけ開く。
  OnpremWireguardPublicKey:
    Type: String
    Default: ''
    AllowedPattern: '^$|^[A-Za-z0-9+/]{43}=$'
    ConstraintDescription: WireGuard の公開鍵（base64 の 44 文字）。空なら未設定。
    Description: オンプレの WireGuard の公開鍵（秘密鍵ではない）。空のあいだ、EC2 はピアを持たない。EC2 の公開鍵を取り出してオンプレに設定してから入れる（README の 4.2）。
  WireguardInstanceType:
    Type: String
    Default: t4g.nano
    AllowedPattern: '^t4g\..+$'
    ConstraintDescription: arm64（Graviton）のインスタンスタイプにする（AMI が arm64）。
  WireguardAmiSsmId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-arm64
    Description: >-
      AMI の SSM パラメータの名前（Amazon Linux 2023・arm64。AMI の ID ではない）。WireguardFixedAmiId が空のときだけ使う。
      「最新」を指すので、新しい AMI が出たあとの更新でインスタンスが置き換わり、秘密鍵が失われて公開鍵が変わる（オンプレの更新が要る）。
      初回のデプロイのあとは WireguardFixedAmiId で固定する（README の 4.2）。
  WireguardFixedAmiId:
    Type: String
    Default: ''
    AllowedPattern: '^$|^ami-[0-9a-f]{8,17}$'
    ConstraintDescription: AMI の ID（ami-...）か、空。
    Description: WireGuard の EC2 の AMI の ID。空でなければ WireguardAmiSsmId より優先する。初回のデプロイのあと、動いている EC2 の AMI の ID を入れて固定する。
  RdsCaSha256:
    Type: String
    Default: fe45bbebf92ad3e27a583bbb2ddd1553c521ed4d49af5514dc0a40372ea5395c
    Description: >-
      RDS の CA 束（global-bundle.pem）の SHA-256。ops-tasks の DB 作成タスクが起動時に束を取得して照合する。
      cloud/images/*/Dockerfile の RDS_CA_SHA256 と同じ値にする（README の 4.7）。
  VpcCidr:
    Type: String
    Default: 10.20.0.0/16
    Description: VPC の CIDR。デフォルト VPC（172.31.0.0/16）と重ならない範囲にする。サブネットの既定の CIDR もこの中にある。
  MauticMountConfigVolume:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: Mautic の config ディレクトリを EFS で覆うか（local.php を再起動で消さない）。公式イメージの config は空（.gitkeep だけ）なので、覆っても既定のファイルは隠れない。
  ChatwootMailerSenderEmail:
    Type: String
    Default: Chatwoot <no-reply@comegin.com>
    Description: Chatwoot の送信元。SES で検証済みのドメインのアドレスにする。
  GoogleClientId:
    Type: String
    Default: ''
    Description: admin-auth の Google の OAuth クライアント ID（Workspace の「内部」）。人間が Google Cloud で発行して入れる。
  AdminBootstrapEmails:
    Type: String
    Default: ''
    Description: admin-auth の管理者の許可リストの初期値（カンマ区切り）。
  ConsentPolicyVersion:
    Type: String
    Default: '2026-10-01'
    Description: 現行のプライバシーポリシー・Cookie 文面の版（consent-api が記録と Cookie に入れる）。

Resources:
  NetworkStack:
    Type: AWS::Serverless::Application
    Properties:
      Location: stacks/network.yaml
      Parameters:
        EnvName: !Ref EnvName
        VpcCidr: !Ref VpcCidr
        MauticWebPort: !Ref MauticWebPort
        ChatwootWebPort: !Ref ChatwootWebPort
        AdminAuthPort: !Ref AdminAuthPort
        ConsentApiPort: !Ref ConsentApiPort
        WireguardPort: !Ref WireguardPort
        WireguardIngressCidr: !Ref WireguardIngressCidr
        OnpremWebhookPort: !Ref OnpremWebhookPort

  EcrStack:
    Type: AWS::Serverless::Application
    Properties:
      Location: stacks/ecr.yaml
      Parameters:
        EnvName: !Ref EnvName

  ObservabilityStack:
    Type: AWS::Serverless::Application
    Properties:
      Location: stacks/observability.yaml
      Parameters:
        EnvName: !Ref EnvName
        HeartbeatAlarmActionsEnabled: !Ref HeartbeatAlarmActionsEnabled

  RunLogArchiveStack:
    Type: AWS::Serverless::Application
    Properties:
      Location: stacks/runlog-archive.yaml
      Parameters:
        EnvName: !Ref EnvName
        RunLogAdminPrincipalArns: !Join [',', !Ref RunLogAdminPrincipalArns]

  SecretsStack:
    Type: AWS::Serverless::Application
    Properties:
      Location: stacks/secrets.yaml
      Parameters:
        EnvName: !Ref EnvName

  DataStack:
    Type: AWS::Serverless::Application
    Properties:
      Location: stacks/data.yaml
      Parameters:
        EnvName: !Ref EnvName
        PrivateSubnetIds: !GetAtt NetworkStack.Outputs.PrivateSubnetIds
        MysqlSecurityGroupId: !GetAtt NetworkStack.Outputs.MysqlSecurityGroupId
        PostgresSecurityGroupId: !GetAtt NetworkStack.Outputs.PostgresSecurityGroupId
        ValkeySecurityGroupId: !GetAtt NetworkStack.Outputs.ValkeySecurityGroupId
        EfsSecurityGroupId: !GetAtt NetworkStack.Outputs.EfsSecurityGroupId
        SecretNamePrefix: !GetAtt SecretsStack.Outputs.SecretNamePrefix
        MysqlInstanceClass: !Ref MysqlInstanceClass
        PostgresInstanceClass: !Ref PostgresInstanceClass
        ValkeyNodeType: !Ref ValkeyNodeType

  ClusterStack:
    Type: AWS::Serverless::Application
    Properties:
      Location: stacks/cluster.yaml
      Parameters:
        EnvName: !Ref EnvName

  EdgeStack:
    Type: AWS::Serverless::Application
    Properties:
      Location: stacks/edge.yaml
      Parameters:
        EnvName: !Ref EnvName
        VpcId: !GetAtt NetworkStack.Outputs.VpcId
        PublicSubnetIds: !GetAtt NetworkStack.Outputs.PublicSubnetIds
        AlbSecurityGroupId: !GetAtt NetworkStack.Outputs.AlbSecurityGroupId
        HostedZoneId: !Ref HostedZoneId
        SecretNamePrefix: !GetAtt SecretsStack.Outputs.SecretNamePrefix
        ChatHost: !Ref ChatHost
        MktHost: !Ref MktHost
        AuthHost: !Ref AuthHost
        ConsentHost: !Ref ConsentHost
        MauticWebPort: !Ref MauticWebPort
        ChatwootWebPort: !Ref ChatwootWebPort
        AdminAuthPort: !Ref AdminAuthPort
        ConsentApiPort: !Ref ConsentApiPort
        AlbOidcClientId: !Ref AlbOidcClientId
        WafRateLimitConsent: !Ref WafRateLimitConsent
        WafRateLimitForm: !Ref WafRateLimitForm
        WafRateLimitApi: !Ref WafRateLimitApi
        WafRateLimitVisitor: !Ref WafRateLimitVisitor
        WafRateLimitAuth: !Ref WafRateLimitAuth
        WafCommonRuleSetAction: !Ref WafCommonRuleSetAction

  CdnStack:
    Type: AWS::Serverless::Application
    Properties:
      Location: stacks/cdn.yaml
      Parameters:
        EnvName: !Ref EnvName
        SiteHost: !Ref SiteHost
        HostedZoneId: !Ref HostedZoneId
        AstroBucketName: !GetAtt DataStack.Outputs.AstroBucketName
        AstroBucketArn: !GetAtt DataStack.Outputs.AstroBucketArn
        AstroBucketRegionalDomainName: !GetAtt DataStack.Outputs.AstroBucketRegionalDomainName
        CloudFrontCertificateArn: !Ref CloudFrontCertificateArn
        CloudFrontWebAclArn: !Ref CloudFrontWebAclArn

  SesStack:
    Type: AWS::Serverless::Application
    Properties:
      Location: stacks/ses.yaml
      Parameters:
        EnvName: !Ref EnvName
        DomainName: !Ref DomainName
        HostedZoneId: !Ref HostedZoneId

  OpsTasksStack:
    Type: AWS::Serverless::Application
    Properties:
      Location: stacks/ops-tasks.yaml
      Parameters:
        EnvName: !Ref EnvName
        SecretNamePrefix: !GetAtt SecretsStack.Outputs.SecretNamePrefix
        TasksLogGroupName: !GetAtt ClusterStack.Outputs.TasksLogGroupName
        PostgresEndpoint: !GetAtt DataStack.Outputs.PostgresEndpoint
        PostgresMasterSecretArn: !GetAtt DataStack.Outputs.PostgresMasterSecretArn
        MysqlEndpoint: !GetAtt DataStack.Outputs.MysqlEndpoint
        MysqlMasterSecretArn: !GetAtt DataStack.Outputs.MysqlMasterSecretArn
        RdsCaSha256: !Ref RdsCaSha256

  IamStack:
    Type: AWS::Serverless::Application
    Properties:
      Location: stacks/iam.yaml
      Parameters:
        EnvName: !Ref EnvName
        RunLogBucketArn: !GetAtt RunLogArchiveStack.Outputs.RunLogBucketArn
        RunLogKeyPrefix: !GetAtt RunLogArchiveStack.Outputs.RunLogKeyPrefix
        HeartbeatNamespace: !GetAtt ObservabilityStack.Outputs.HeartbeatNamespace
        N8nHeartbeatNamespace: !GetAtt ObservabilityStack.Outputs.N8nHeartbeatNamespace
        AstroBucketArn: !GetAtt DataStack.Outputs.AstroBucketArn
        DistributionArn: !GetAtt CdnStack.Outputs.DistributionArn
        StrapiMediaBucketArn: !GetAtt DataStack.Outputs.StrapiMediaBucketArn
        OpsAlertTopicArn: !GetAtt ObservabilityStack.Outputs.OpsAlertTopicArn
        LeadAlertTopicArn: !GetAtt ObservabilityStack.Outputs.LeadAlertTopicArn

  # ---- オンプレとの WireGuard（ADR-21）。EC2 1 台。SG は network.yaml、経路は private サブネットの経路表。
  WireguardStack:
    Type: AWS::Serverless::Application
    Properties:
      Location: stacks/wireguard.yaml
      Parameters:
        EnvName: !Ref EnvName
        PublicSubnetIds: !GetAtt NetworkStack.Outputs.PublicSubnetIds
        PrivateRouteTableId: !GetAtt NetworkStack.Outputs.PrivateRouteTableId
        SecurityGroupId: !GetAtt NetworkStack.Outputs.WireguardSecurityGroupId
        VpcCidr: !Ref VpcCidr
        OnpremWireguardCidr: !Ref OnpremWireguardCidr
        WireguardServerAddress: !Ref WireguardServerAddress
        OnpremPeerAddress: !Ref OnpremPeerAddress
        WireguardPort: !Ref WireguardPort
        OnpremWebhookPort: !Ref OnpremWebhookPort
        OnpremWireguardPublicKey: !Ref OnpremWireguardPublicKey
        InstanceType: !Ref WireguardInstanceType
        AmiSsmId: !Ref WireguardAmiSsmId
        FixedAmiId: !Ref WireguardFixedAmiId

  # ---- サービス（T1-3）。DesiredCount は 0 が初期値。README の順に上げる。
  MauticWebService:
    Type: AWS::Serverless::Application
    Properties:
      Location: stacks/services/mautic-web.yaml
      Parameters:
        EnvName: !Ref EnvName
        ClusterArn: !GetAtt ClusterStack.Outputs.ClusterArn
        PrivateSubnetIds: !GetAtt NetworkStack.Outputs.PrivateSubnetIds
        SecurityGroupId: !GetAtt NetworkStack.Outputs.MauticWebSecurityGroupId
        LogGroupName: !GetAtt ClusterStack.Outputs.MauticWebLogGroupName
        SecretNamePrefix: !GetAtt SecretsStack.Outputs.SecretNamePrefix
        ImageRepositoryUri: !GetAtt EcrStack.Outputs.MauticRepositoryUri
        ImageTag: !Ref MauticImageTag
        DesiredCount: !Ref MauticWebDesiredCount
        Cpu: !Ref MauticWebCpu
        Memory: !Ref MauticWebMemory
        ContainerPort: !Ref MauticWebPort
        TargetGroupArn: !GetAtt EdgeStack.Outputs.MauticWebTargetGroupArn
        MysqlEndpoint: !GetAtt DataStack.Outputs.MysqlEndpoint
        MktHost: !Ref MktHost
        TrustedProxyCidr: !Ref VpcCidr
        EfsFileSystemId: !GetAtt DataStack.Outputs.EfsFileSystemId
        MediaImagesAccessPointId: !GetAtt DataStack.Outputs.MauticMediaImagesAccessPointId
        MediaFilesAccessPointId: !GetAtt DataStack.Outputs.MauticMediaFilesAccessPointId
        ConfigAccessPointId: !GetAtt DataStack.Outputs.MauticConfigAccessPointId
        MountConfigVolume: !Ref MauticMountConfigVolume

  MauticCronService:
    Type: AWS::Serverless::Application
    Properties:
      Location: stacks/services/mautic-cron.yaml
      Parameters:
        EnvName: !Ref EnvName
        ClusterArn: !GetAtt ClusterStack.Outputs.ClusterArn
        PrivateSubnetIds: !GetAtt NetworkStack.Outputs.PrivateSubnetIds
        SecurityGroupId: !GetAtt NetworkStack.Outputs.MauticCronSecurityGroupId
        LogGroupName: !GetAtt ClusterStack.Outputs.MauticCronLogGroupName
        SecretNamePrefix: !GetAtt SecretsStack.Outputs.SecretNamePrefix
        ImageRepositoryUri: !GetAtt EcrStack.Outputs.MauticRepositoryUri
        ImageTag: !Ref MauticImageTag
        DesiredCount: !Ref MauticCronDesiredCount
        Cpu: !Ref MauticCronCpu
        Memory: !Ref MauticCronMemory
        MysqlEndpoint: !GetAtt DataStack.Outputs.MysqlEndpoint
        MktHost: !Ref MktHost
        TrustedProxyCidr: !Ref VpcCidr
        EfsFileSystemId: !GetAtt DataStack.Outputs.EfsFileSystemId
        MediaImagesAccessPointId: !GetAtt DataStack.Outputs.MauticMediaImagesAccessPointId
        MediaFilesAccessPointId: !GetAtt DataStack.Outputs.MauticMediaFilesAccessPointId
        ConfigAccessPointId: !GetAtt DataStack.Outputs.MauticConfigAccessPointId
        MountConfigVolume: !Ref MauticMountConfigVolume

  ChatwootWebService:
    Type: AWS::Serverless::Application
    Properties:
      Location: stacks/services/chatwoot-web.yaml
      Parameters:
        EnvName: !Ref EnvName
        ClusterArn: !GetAtt ClusterStack.Outputs.ClusterArn
        PrivateSubnetIds: !GetAtt NetworkStack.Outputs.PrivateSubnetIds
        SecurityGroupId: !GetAtt NetworkStack.Outputs.ChatwootWebSecurityGroupId
        LogGroupName: !GetAtt ClusterStack.Outputs.ChatwootWebLogGroupName
        SecretNamePrefix: !GetAtt SecretsStack.Outputs.SecretNamePrefix
        ImageRepositoryUri: !GetAtt EcrStack.Outputs.ChatwootRepositoryUri
        ImageTag: !Ref ChatwootImageTag
        DesiredCount: !Ref ChatwootWebDesiredCount
        Cpu: !Ref ChatwootWebCpu
        Memory: !Ref ChatwootWebMemory
        ContainerPort: !Ref ChatwootWebPort
        TargetGroupArn: !GetAtt EdgeStack.Outputs.ChatwootWebTargetGroupArn
        PostgresEndpoint: !GetAtt DataStack.Outputs.PostgresEndpoint
        ValkeyEndpoint: !GetAtt DataStack.Outputs.ValkeyEndpoint
        ChatHost: !Ref ChatHost
        DomainName: !Ref DomainName
        AttachmentBucketName: !GetAtt DataStack.Outputs.ChatwootBucketName
        AttachmentBucketArn: !GetAtt DataStack.Outputs.ChatwootBucketArn
        MailerSenderEmail: !Ref ChatwootMailerSenderEmail

  ChatwootWorkerService:
    Type: AWS::Serverless::Application
    Properties:
      Location: stacks/services/chatwoot-worker.yaml
      Parameters:
        EnvName: !Ref EnvName
        ClusterArn: !GetAtt ClusterStack.Outputs.ClusterArn
        PrivateSubnetIds: !GetAtt NetworkStack.Outputs.PrivateSubnetIds
        SecurityGroupId: !GetAtt NetworkStack.Outputs.ChatwootWorkerSecurityGroupId
        LogGroupName: !GetAtt ClusterStack.Outputs.ChatwootWorkerLogGroupName
        SecretNamePrefix: !GetAtt SecretsStack.Outputs.SecretNamePrefix
        ImageRepositoryUri: !GetAtt EcrStack.Outputs.ChatwootRepositoryUri
        ImageTag: !Ref ChatwootImageTag
        DesiredCount: !Ref ChatwootWorkerDesiredCount
        Cpu: !Ref ChatwootWorkerCpu
        Memory: !Ref ChatwootWorkerMemory
        PostgresEndpoint: !GetAtt DataStack.Outputs.PostgresEndpoint
        ValkeyEndpoint: !GetAtt DataStack.Outputs.ValkeyEndpoint
        ChatHost: !Ref ChatHost
        DomainName: !Ref DomainName
        AttachmentBucketName: !GetAtt DataStack.Outputs.ChatwootBucketName
        AttachmentBucketArn: !GetAtt DataStack.Outputs.ChatwootBucketArn
        MailerSenderEmail: !Ref ChatwootMailerSenderEmail

  AdminAuthService:
    Type: AWS::Serverless::Application
    Properties:
      Location: stacks/services/admin-auth.yaml
      Parameters:
        EnvName: !Ref EnvName
        ClusterArn: !GetAtt ClusterStack.Outputs.ClusterArn
        PrivateSubnetIds: !GetAtt NetworkStack.Outputs.PrivateSubnetIds
        SecurityGroupId: !GetAtt NetworkStack.Outputs.AdminAuthSecurityGroupId
        LogGroupName: !GetAtt ClusterStack.Outputs.AdminAuthLogGroupName
        SecretNamePrefix: !GetAtt SecretsStack.Outputs.SecretNamePrefix
        ImageRepositoryUri: !GetAtt EcrStack.Outputs.AdminAuthRepositoryUri
        ImageTag: !Ref AdminAuthImageTag
        DesiredCount: !Ref AdminAuthDesiredCount
        Cpu: !Ref AdminAuthCpu
        Memory: !Ref AdminAuthMemory
        ContainerPort: !Ref AdminAuthPort
        TargetGroupArn: !GetAtt EdgeStack.Outputs.AdminAuthTargetGroupArn
        PostgresEndpoint: !GetAtt DataStack.Outputs.PostgresEndpoint
        AuthHost: !Ref AuthHost
        DomainName: !Ref DomainName
        GoogleClientId: !Ref GoogleClientId
        AdminBootstrapEmails: !Ref AdminBootstrapEmails
        AlbClientId: !Ref AlbOidcClientId
        AlbProtectedHosts: !GetAtt EdgeStack.Outputs.AlbProtectedHosts

  ConsentApiService:
    Type: AWS::Serverless::Application
    Properties:
      Location: stacks/services/consent-api.yaml
      Parameters:
        EnvName: !Ref EnvName
        ClusterArn: !GetAtt ClusterStack.Outputs.ClusterArn
        PrivateSubnetIds: !GetAtt NetworkStack.Outputs.PrivateSubnetIds
        SecurityGroupId: !GetAtt NetworkStack.Outputs.ConsentApiSecurityGroupId
        LogGroupName: !GetAtt ClusterStack.Outputs.ConsentApiLogGroupName
        SecretNamePrefix: !GetAtt SecretsStack.Outputs.SecretNamePrefix
        ImageRepositoryUri: !GetAtt EcrStack.Outputs.ConsentApiRepositoryUri
        ImageTag: !Ref ConsentApiImageTag
        DesiredCount: !Ref ConsentApiDesiredCount
        Cpu: !Ref ConsentApiCpu
        Memory: !Ref ConsentApiMemory
        ContainerPort: !Ref ConsentApiPort
        TargetGroupArn: !GetAtt EdgeStack.Outputs.ConsentApiTargetGroupArn
        ValkeyEndpoint: !GetAtt DataStack.Outputs.ValkeyEndpoint
        SiteUrl: !Sub 'https://${SiteHost}'
        CookieDomain: !Sub '.${DomainName}'
        ConsentPolicyVersion: !Ref ConsentPolicyVersion

  # ---- アラーム（T1-4）。すべて ops トピックへ直接発行する。
  AlarmsStack:
    Type: AWS::Serverless::Application
    Properties:
      Location: stacks/alarms.yaml
      Parameters:
        EnvName: !Ref EnvName
        OpsAlertTopicArn: !GetAtt ObservabilityStack.Outputs.OpsAlertTopicArn
        ClusterName: !GetAtt ClusterStack.Outputs.ClusterName
        AlbFullName: !GetAtt EdgeStack.Outputs.AlbFullName
        MauticWebTargetGroupFullName: !GetAtt EdgeStack.Outputs.MauticWebTargetGroupFullName
        ChatwootWebTargetGroupFullName: !GetAtt EdgeStack.Outputs.ChatwootWebTargetGroupFullName
        AdminAuthTargetGroupFullName: !GetAtt EdgeStack.Outputs.AdminAuthTargetGroupFullName
        ConsentApiTargetGroupFullName: !GetAtt EdgeStack.Outputs.ConsentApiTargetGroupFullName
        MysqlInstanceIdentifier: !GetAtt DataStack.Outputs.MysqlInstanceIdentifier
        PostgresInstanceIdentifier: !GetAtt DataStack.Outputs.PostgresInstanceIdentifier
        ValkeyReplicationGroupId: !GetAtt DataStack.Outputs.ValkeyReplicationGroupId
        WireguardInstanceId: !GetAtt WireguardStack.Outputs.InstanceId

Outputs:
  # 監視アプリの設定（W/frontend/next-js の .env）に人が写す値。
  RunLogBucketName:
    Description: 監視アプリの RUNLOG_BUCKET
    Value: !GetAtt RunLogArchiveStack.Outputs.RunLogBucketName
  HeartbeatNamespace:
    Description: 監視アプリの HEARTBEAT_NAMESPACE
    Value: !GetAtt ObservabilityStack.Outputs.HeartbeatNamespace
  N8nHeartbeatNamespace:
    Description: オンプレの n8n の ops_settings.heartbeatNamespace（ハートビートの名前空間。ずれると IAM の条件で拒否される）
    Value: !GetAtt ObservabilityStack.Outputs.N8nHeartbeatNamespace
  N8nScheduleHeartbeatAlarmName:
    Description: n8n のスケジュール実行のハートビートのアラーム。開発機を止めるときは HeartbeatAlarmName と一緒にアクションを無効にする。
    Value: !GetAtt ObservabilityStack.Outputs.N8nScheduleHeartbeatAlarmName
  LeadAlertTopicArn:
    Value: !GetAtt ObservabilityStack.Outputs.LeadAlertTopicArn
  OpsAlertTopicArn:
    Value: !GetAtt ObservabilityStack.Outputs.OpsAlertTopicArn
  AlbDnsName:
    Value: !GetAtt EdgeStack.Outputs.AlbDnsName
  ControlPlanePolicyArn:
    Description: 監視アプリ用の管理ポリシー。写し用の IAM ユーザー（またはロール）に付ける（README）。
    Value: !GetAtt IamStack.Outputs.ControlPlanePolicyArn
  DeployPolicyArn:
    Description: 配信用の管理ポリシー。配信を実行する人間の主体に付ける（README）。
    Value: !GetAtt IamStack.Outputs.DeployPolicyArn

  # 運用者が README の手順で使う値（RunTask の指定など）。
  ClusterName:
    Value: !GetAtt ClusterStack.Outputs.ClusterName
  PrivateSubnetIds:
    Value: !GetAtt NetworkStack.Outputs.PrivateSubnetIds
  OpsTasksSecurityGroupId:
    Value: !GetAtt NetworkStack.Outputs.OpsTasksSecurityGroupId
  PostgresInitTaskDefinitionArn:
    Value: !GetAtt OpsTasksStack.Outputs.PostgresInitTaskDefinitionArn
  MysqlInitTaskDefinitionArn:
    Value: !GetAtt OpsTasksStack.Outputs.MysqlInitTaskDefinitionArn
  AstroBucketName:
    Description: 配信の s3 sync の宛先
    Value: !GetAtt DataStack.Outputs.AstroBucketName
  DistributionId:
    Description: 配信後のキャッシュ無効化の対象。global/template.yaml の DistributionArn にも使う。
    Value: !GetAtt CdnStack.Outputs.DistributionId
  DistributionArn:
    Value: !GetAtt CdnStack.Outputs.DistributionArn
  AlbProtectedHosts:
    Description: admin-auth の ALB_PROTECTED_HOSTS
    Value: !GetAtt EdgeStack.Outputs.AlbProtectedHosts
  ChatwootWebSecurityGroupId:
    Description: chatwoot の db:chatwoot_prepare を RunTask で実行するときのセキュリティグループ（DB と Valkey に届く）
    Value: !GetAtt NetworkStack.Outputs.ChatwootWebSecurityGroupId
  AdminAuthSecurityGroupId:
    Description: admin-auth の migrate と ALB クライアントの登録を RunTask で実行するときのセキュリティグループ
    Value: !GetAtt NetworkStack.Outputs.AdminAuthSecurityGroupId
  MauticWebSecurityGroupId:
    Description: Mautic のコマンドを RunTask で実行するときのセキュリティグループ（MySQL と EFS に届く）
    Value: !GetAtt NetworkStack.Outputs.MauticWebSecurityGroupId

  # オンプレとの WireGuard（README の 4.2）。
  WireguardPublicIp:
    Description: オンプレの WireGuard の Endpoint（<この値>:<WireguardPort>）に入れる Elastic IP
    Value: !GetAtt WireguardStack.Outputs.PublicIp
  WireguardServerPublicKeyParameterName:
    Description: EC2 の WireGuard の公開鍵を書く SSM パラメータの名前（オンプレの Peer の PublicKey の取り出し先）
    Value: !GetAtt WireguardStack.Outputs.ServerPublicKeyParameterName
  OnpremPublicKeyParameterName:
    Description: オンプレの WireGuard の公開鍵を入れる SSM パラメータの名前（EC2 が数分ごとに読む）
    Value: !GetAtt WireguardStack.Outputs.OnpremPublicKeyParameterName
  WireguardInstanceId:
    Description: SSM Session Manager で入る EC2 のインスタンス ID
    Value: !GetAtt WireguardStack.Outputs.InstanceId

  # オンプレの資格情報（IAM ユーザー。アクセスキーは作らない。README の 4.5）。
  OnpremStrapiMediaUserName:
    Description: オンプレの Strapi のメディア用 IAM ユーザー。アクセスキーは人が発行して、オンプレの秘匿ファイルにだけ置く。
    Value: !GetAtt IamStack.Outputs.OnpremStrapiMediaUserName
  OnpremN8nSnsUserName:
    Description: オンプレの n8n の SNS 発行用 IAM ユーザー。アクセスキーは人が発行して、オンプレの秘匿ファイルにだけ置く。
    Value: !GetAtt IamStack.Outputs.OnpremN8nSnsUserName
