# 開発環境の Umami で MCP（/mcp）を有効にする上書き。上流の docker-compose.yml は変えない。
# 使い方（setup/setup.mjs の umami モジュールが実行する）:
#   docker compose -f docker-compose.yml -f dev/setup/compose.mcp.yml up -d
# 上流の設定で MCP は既定で無効（MCP_ENABLED=1 が無いと /mcp は 404）。手で `docker compose up -d` だけを実行すると、この設定が外れた状態で作り直される。
services:
  umami:
    environment:
      MCP_ENABLED: "1"
