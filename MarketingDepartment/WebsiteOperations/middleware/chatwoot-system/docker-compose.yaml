# Chatwoot（Web サイトの問い合わせ窓口）
# 値は同じディレクトリの .env から読む（初回は dev/init-env.sh でパスワード・キーを生成する）
# rails のエントリポイントはマイグレーションを実行しない。初回とイメージ更新後は起動前に次を実行する:
#   docker compose run --rm rails bundle exec rails db:chatwoot_prepare
# ブラウザからは http://localhost:${CHATWOOT_PORT:-3100} で開く（3000 は Umami が使用）

# rails / sidekiq で共有する設定（x- で始まるキーはサービスとして起動しない）
x-chatwoot-base: &base
  image: chatwoot/chatwoot:latest
  env_file: .env ## Change this file for customized env variables
  volumes:
    - storage_data:/app/storage

services:
  rails:
    <<: *base
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      # 外部ネットワークに公開しないようループバックのみにバインド
      - '127.0.0.1:${CHATWOOT_PORT:-3100}:3000'
    environment:
      - NODE_ENV=production
      - RAILS_ENV=production
      - INSTALLATION_ENV=docker
    entrypoint: docker/entrypoints/rails.sh
    command: ['bundle', 'exec', 'rails', 's', '-p', '3000', '-b', '0.0.0.0']
    restart: always

  sidekiq:
    <<: *base
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - RAILS_ENV=production
      - INSTALLATION_ENV=docker
    command: ['bundle', 'exec', 'sidekiq', '-C', 'config/sidekiq.yml']
    restart: always

  postgres:
    image: pgvector/pgvector:pg16
    restart: always
    ports:
      - '127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      # Chatwoot 側（.env の POSTGRES_DATABASE / POSTGRES_USERNAME / POSTGRES_PASSWORD）と同じ値を使う
      # パスワードはボリューム初期化時にだけ反映される。後から変える場合はボリュームの作り直しが必要
      - POSTGRES_DB=${POSTGRES_DATABASE:-chatwoot}
      - POSTGRES_USER=${POSTGRES_USERNAME:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?.env に POSTGRES_PASSWORD を設定してください（dev/init-env.sh で生成できます）}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:alpine
    restart: always
    # $$ でコンテナ内の環境変数を参照する（compose 展開時にパスワードをコマンドへ埋め込まない）
    command: ['sh', '-c', 'exec redis-server --requirepass "$$REDIS_PASSWORD"']
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:?.env に REDIS_PASSWORD を設定してください（dev/init-env.sh で生成できます）}
    volumes:
      - redis_data:/data
    ports:
      - '127.0.0.1:${REDIS_HOST_PORT:-6379}:6379'
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli --no-auth-warning -a "$$REDIS_PASSWORD" ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 5

  # ローカル開発用のメール受信箱（.env の COMPOSE_PROFILES=dev のときだけ起動する）
  # Chatwoot からは SMTP_ADDRESS=mailhog / SMTP_PORT=1025 で送信し、http://localhost:${MAILHOG_UI_PORT:-8026} で閲覧する
  # Mautic の MailHog（1025 / 8025）と衝突しないよう、SMTP はホストに公開せず UI も別ポートにする
  # v1.0.1 が最終リリースで、イメージは amd64 のみ。受信メールはメモリ保持のためコンテナ再作成で消える
  mailhog:
    image: mailhog/mailhog:v1.0.1
    profiles: ['dev']
    restart: unless-stopped
    ports:
      - '127.0.0.1:${MAILHOG_UI_PORT:-8026}:8025'
    healthcheck:
      # イメージに healthcheck がないため、busybox の wget で Web API の応答を確認する
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8025/api/v2/messages?limit=1']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  storage_data:
  postgres_data:
  redis_data:
