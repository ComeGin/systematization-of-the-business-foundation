AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  calcom: オンライン面談の予約ページと埋め込みの配信、Google Calendar との連携（セルフホスト。ADR-19。ECS on Fargate）。TA-06 の 3.1。
  TODO（着手前に済ませる。確かめずに動かさない。TA-06 の 11 節）:
    - ライセンス: 使う機能（予約ページ・埋め込み・Google Calendar の連携）が自前で動かせる範囲に収まるか。DesiredCount は 0 のままにする。
    - 公式イメージ（calcom/cal.com）の有無とタグ。公式は Docker の構成を「コミュニティの努力」としており、サポートしない。
    - 起動時の DB の移行（Prisma）の実際の挙動。DATABASE_URL に加えて DATABASE_DIRECT_URL が要る。
    - メールの送信（予約の確認メール）: SES の SMTP を使うなら EMAIL_* の設定と Secret が要る。secrets.yaml にはまだ無い。
    - 訪問者向けのパスの切り分け（edge.yaml にはまだルールが無い。cal. は全体が OIDC の内側）。
  Cal.com の DB の URL は DB パスワードの Secret から組み立てた Secret（DATABASE_URL・DATABASE_DIRECT_URL）をこのスタックで作る。

Parameters:
  EnvName:
    Type: String
    Default: prod
  ClusterArn:
    Type: String
    Description: cluster.yaml の ClusterArn
  PrivateSubnetIds:
    Type: CommaDelimitedList
    Description: private サブネットの ID（network.yaml の PrivateSubnetIds）
  SecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: network.yaml の CalcomSecurityGroupId
  LogGroupName:
    Type: String
    Description: cluster.yaml の CalcomLogGroupName
  SecretNamePrefix:
    Type: String
    Description: secrets.yaml の SecretNamePrefix
  ImageRepositoryUri:
    Type: String
    Description: ecr.yaml の CalcomRepositoryUri
  ImageTag:
    Type: String
    AllowedPattern: '^(?!latest$).+$'
    ConstraintDescription: latest は使えない。バージョンのタグで固定する（TA-06 の 3.2）。
    Default: REPLACE-WITH-FIXED-TAG
    Description: Cal.com のイメージのタグ。ライセンスの確認が先に要る（TA-06 の 3.2・11 節）。
  DesiredCount:
    Type: Number
    Default: 0
    MinValue: 0
    Description: 初期値は 0（README の順に上げる）。
  Cpu:
    Type: String
    Default: '1024'
    AllowedValues: ['256', '512', '1024', '2048', '4096']
    Description: 暫定値（TA-06 の 9 節の見積もり前）
  Memory:
    Type: String
    Default: '2048'
    Description: 暫定値。Fargate の CPU との組み合わせに合う値にする。
  EnableExecuteCommand:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: ECS Exec（運用者が DB やコンテナに入るための手段。踏み台は置かない。TA-06 の 5.6）
  ContainerPort:
    Type: Number
    Default: 3000
    Description: コンテナの待ち受けポート。network.yaml と edge.yaml の値と同じにする（親が同じ値を渡す）。
  TargetGroupArn:
    Type: String
    Description: edge.yaml の CalcomTargetGroupArn
  HealthCheckGracePeriodSeconds:
    Type: Number
    Default: 180
    Description: 起動直後のヘルスチェックの猶予（秒）
  PostgresEndpoint:
    Type: String
    Description: data.yaml の PostgresEndpoint
  CalHost:
    Type: String
    Description: Cal.com の公開ホスト名（NEXT_PUBLIC_WEBAPP_URL と NEXTAUTH_URL になる）

Resources:
  # DB の URL を組み立てた Secret。パスワードは動的参照で読む。
  # TLS は umami.yaml と同じ（sslmode=verify-full&sslaccept=strict と、派生イメージ cloud/images/calcom/Dockerfile が信頼させる RDS の CA）。
  #   Rust のエンジンは sslmode だけでは証明書を検証せず、sslaccept=strict が要る（umami.yaml に検証の結果を書いた）。
  # TODO(未検証): Cal.com のイメージで同じ検証が通ること（Prisma 6 の Rust エンジンを想定。アダプターに移行していれば Node の pg が検証する）。
  DatabaseUrlSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub '${SecretNamePrefix}/calcom/DATABASE_URL'
      Description: Cal.com DATABASE_URL built from the DB password secret.
      SecretString: !Sub 'postgresql://calcom:{{resolve:secretsmanager:${SecretNamePrefix}/calcom/DB_PASSWORD:SecretString}}@${PostgresEndpoint}:5432/calcom?sslmode=verify-full&sslaccept=strict'

  # Prisma のマイグレーション用（コネクションプーラーを通さない直接の接続。プーラーは使わないので同じ値）。
  DatabaseDirectUrlSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub '${SecretNamePrefix}/calcom/DATABASE_DIRECT_URL'
      Description: Cal.com DATABASE_DIRECT_URL built from the DB password secret.
      SecretString: !Sub 'postgresql://calcom:{{resolve:secretsmanager:${SecretNamePrefix}/calcom/DB_PASSWORD:SecretString}}@${PostgresEndpoint}:5432/calcom?sslmode=verify-full&sslaccept=strict'

  # 実行ロール（ECS のエージェントが使う）。イメージの取得、ログの書き込み、このサービスの Secret の読み取りだけ。
  # RDS のマスターの資格情報は読めない（ops-tasks.yaml の実行ロールだけが読める）。
  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'comegin-${EnvName}-calcom-execution'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                'aws:SourceAccount': !Ref AWS::AccountId

  ExecutionPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub 'comegin-${EnvName}-calcom-execution'
      Roles:
        - !Ref ExecutionRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          # cfn-guard の Resource '*' の指摘は意図した例外（リソースレベルの権限に対応しないアクション）:
          #   ecr:GetAuthorizationToken、タスクロールの ssmmessages（ECS Exec）。
          - Sid: EcrAuthorization
            Effect: Allow
            Action: ecr:GetAuthorizationToken
            Resource: '*'
          - Sid: EcrPull
            Effect: Allow
            Action:
              - ecr:BatchCheckLayerAvailability
              - ecr:GetDownloadUrlForLayer
              - ecr:BatchGetImage
            Resource:
              - !Sub
                - 'arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/${RepositoryName}'
                - RepositoryName: !Select [1, !Split ['.amazonaws.com/', !Ref ImageRepositoryUri]]
          - Sid: WriteLogs
            Effect: Allow
            Action:
              - logs:CreateLogStream
              - logs:PutLogEvents
            Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:${LogGroupName}:*'
          - Sid: ReadOwnSecrets
            Effect: Allow
            Action: secretsmanager:GetSecretValue
            Resource:
              - !Sub 'arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${SecretNamePrefix}/calcom/*'

  # タスクロール（アプリのコードが使う）。アクセスキーは発行しない。
  # Secrets Manager の読み取りは付けない（エージェントとワークフローに渡さない。TA-04 の 1 節）。
  # ECS Exec の ssmmessages はリソースを絞れない（公式の要件）。
  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'comegin-${EnvName}-calcom-task'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                'aws:SourceAccount': !Ref AWS::AccountId

  TaskPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub 'comegin-${EnvName}-calcom-task'
      Roles:
        - !Ref TaskRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: EcsExec
            Effect: Allow
            Action:
              - ssmmessages:CreateControlChannel
              - ssmmessages:CreateDataChannel
              - ssmmessages:OpenControlChannel
              - ssmmessages:OpenDataChannel
            Resource: '*'

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub 'comegin-${EnvName}-calcom'
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: !Ref Cpu
      Memory: !Ref Memory
      RuntimePlatform: { CpuArchitecture: X86_64, OperatingSystemFamily: LINUX }
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: calcom
          Image: !Sub '${ImageRepositoryUri}:${ImageTag}'
          Essential: true
          PortMappings:
            - { Name: http, ContainerPort: !Ref ContainerPort, Protocol: tcp, AppProtocol: http }
          Environment:
            - { Name: NODE_ENV, Value: production }
            - { Name: NEXT_PUBLIC_WEBAPP_URL, Value: !Sub 'https://${CalHost}' }
            - { Name: NEXTAUTH_URL, Value: !Sub 'https://${CalHost}' }
            - { Name: CALCOM_TELEMETRY_DISABLED, Value: '1' }
          Secrets:
            - { Name: DATABASE_URL, ValueFrom: !Sub '${SecretNamePrefix}/calcom/DATABASE_URL' }
            - { Name: DATABASE_DIRECT_URL, ValueFrom: !Sub '${SecretNamePrefix}/calcom/DATABASE_DIRECT_URL' }
            - { Name: NEXTAUTH_SECRET, ValueFrom: !Sub '${SecretNamePrefix}/calcom/NEXTAUTH_SECRET' }
            - { Name: CALENDSO_ENCRYPTION_KEY, ValueFrom: !Sub '${SecretNamePrefix}/calcom/CALENDSO_ENCRYPTION_KEY' }
            - { Name: GOOGLE_API_CREDENTIALS, ValueFrom: !Sub '${SecretNamePrefix}/calcom/GOOGLE_API_CREDENTIALS' }
          LinuxParameters:
            InitProcessEnabled: true
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroupName
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: calcom

  Service:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: !Sub 'comegin-${EnvName}-calcom'
      Cluster: !Ref ClusterArn
      LaunchType: FARGATE
      DesiredCount: !Ref DesiredCount
      TaskDefinition: !Ref TaskDefinition
      EnableExecuteCommand: !Ref EnableExecuteCommand
      PropagateTags: SERVICE
      # デプロイのサーキットブレーカー: 新しいタスクが起動に失敗し続けたら、直前のリビジョンに戻す。
      DeploymentConfiguration:
        MaximumPercent: 200
        MinimumHealthyPercent: 100
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          SecurityGroups:
            - !Ref SecurityGroupId
          Subnets: !Ref PrivateSubnetIds
      HealthCheckGracePeriodSeconds: !Ref HealthCheckGracePeriodSeconds
      LoadBalancers:
        - ContainerName: calcom
          ContainerPort: !Ref ContainerPort
          TargetGroupArn: !Ref TargetGroupArn

Outputs:
  ServiceName:
    Value: !GetAtt Service.Name
  TaskRoleArn:
    Value: !GetAtt TaskRole.Arn
  TaskDefinitionArn:
    Value: !Ref TaskDefinition
