AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  mautic-cron: セグメント更新・キャンペーン実行・メールのキュー処理などの定期実行（ECS on Fargate）。TA-06 の 3.1。
  DOCKER_MAUTIC_ROLE=mautic_cron。ALB には繋がない（待ち受けない）。公式の entrypoint は、インストール済みになるまで待ってから cron を起動する。
  Mautic のメッセンジャーのワーカー（mautic_worker）は、既定が同期のため作らない。非同期のキューを使うことにしたら足す（TODO）。

Parameters:
  EnvName:
    Type: String
    Default: prod
  ClusterArn:
    Type: String
    Description: cluster.yaml の ClusterArn
  PrivateSubnetIds:
    Type: CommaDelimitedList
    Description: private サブネットの ID（network.yaml の PrivateSubnetIds）
  SecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: network.yaml の MauticCronSecurityGroupId
  LogGroupName:
    Type: String
    Description: cluster.yaml の MauticCronLogGroupName
  SecretNamePrefix:
    Type: String
    Description: secrets.yaml の SecretNamePrefix
  ImageRepositoryUri:
    Type: String
    Description: ecr.yaml の MauticRepositoryUri
  ImageTag:
    Type: String
    AllowedPattern: '^(?!latest$).+$'
    ConstraintDescription: latest は使えない。バージョンのタグで固定する（TA-06 の 3.2）。
    Default: 7.2.0-1
    Description: Mautic の ECR のタグ（mautic-web と同じ値にする）。
  DesiredCount:
    Type: Number
    Default: 0
    AllowedValues: [0, 1]
    Description: 1 に固定。2 つ動くとキャンペーンの実行やメールの送信が二重になる（TA-06 の 3.1）。オートスケールの対象にしない。
  Cpu:
    Type: String
    Default: '512'
    AllowedValues: ['256', '512', '1024', '2048', '4096']
    Description: 暫定値（TA-06 の 9 節の見積もり前）
  Memory:
    Type: String
    Default: '1024'
    Description: 暫定値。Fargate の CPU との組み合わせに合う値にする。
  EnableExecuteCommand:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: ECS Exec（運用者が DB やコンテナに入るための手段。踏み台は置かない。TA-06 の 5.6）
  MysqlEndpoint:
    Type: String
    Description: data.yaml の MysqlEndpoint
  MktHost:
    Type: String
    Description: Mautic の公開ホスト名（ALB の振り分け。site_url になる）
  TrustedProxyCidr:
    Type: String
    Default: 10.20.0.0/16
    Description: ALB が属する VPC の CIDR。ALB 越しの HTTPS をアプリに信頼させる（network.yaml の VpcCidr と同じ値）。
  EfsFileSystemId:
    Type: String
    Description: data.yaml の EfsFileSystemId
  MediaImagesAccessPointId:
    Type: String
    Description: data.yaml の MauticMediaImagesAccessPointId
  MediaFilesAccessPointId:
    Type: String
    Description: data.yaml の MauticMediaFilesAccessPointId
  ConfigAccessPointId:
    Type: String
    Description: data.yaml の MauticConfigAccessPointId
  MountConfigVolume:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: >-
      config ディレクトリを EFS で覆うか（管理画面で変えた設定とインストールの結果 config/local.php を、タスクの再起動で消さない。TA-06 の 4.4）。
      公式イメージ（7.2.0-apache）の config には .gitkeep しか無く、EFS で覆っても隠れる既定のファイルは無い。
      entrypoint が、local.php が無ければテンプレートから作る（startup/check_local_php_exists.sh）。
      アクセスポイントの所有者は uid 33 の www-data で、entrypoint のボリュームの所有者の検査と一致する。

Conditions:
  MountConfig: !Equals [!Ref MountConfigVolume, 'true']

Resources:
  # 実行ロール（ECS のエージェントが使う）。イメージの取得、ログの書き込み、このサービスの Secret の読み取りだけ。
  # RDS のマスターの資格情報は読めない（ops-tasks.yaml の実行ロールだけが読める）。
  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'comegin-${EnvName}-mautic-cron-execution'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                'aws:SourceAccount': !Ref AWS::AccountId

  ExecutionPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub 'comegin-${EnvName}-mautic-cron-execution'
      Roles:
        - !Ref ExecutionRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          # cfn-guard の Resource '*' の指摘は意図した例外（リソースレベルの権限に対応しないアクション）:
          #   ecr:GetAuthorizationToken、タスクロールの ssmmessages（ECS Exec）。
          - Sid: EcrAuthorization
            Effect: Allow
            Action: ecr:GetAuthorizationToken
            Resource: '*'
          - Sid: EcrPull
            Effect: Allow
            Action:
              - ecr:BatchCheckLayerAvailability
              - ecr:GetDownloadUrlForLayer
              - ecr:BatchGetImage
            Resource:
              - !Sub
                - 'arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/${RepositoryName}'
                - RepositoryName: !Select [1, !Split ['.amazonaws.com/', !Ref ImageRepositoryUri]]
          - Sid: WriteLogs
            Effect: Allow
            Action:
              - logs:CreateLogStream
              - logs:PutLogEvents
            Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:${LogGroupName}:*'
          - Sid: ReadOwnSecrets
            Effect: Allow
            Action: secretsmanager:GetSecretValue
            Resource:
              - !Sub 'arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${SecretNamePrefix}/mautic/*'

  # タスクロール（アプリのコードが使う）。アクセスキーは発行しない。
  # Secrets Manager の読み取りは付けない（エージェントとワークフローに渡さない。TA-04 の 1 節）。
  # ECS Exec の ssmmessages はリソースを絞れない（公式の要件）。
  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'comegin-${EnvName}-mautic-cron-task'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                'aws:SourceAccount': !Ref AWS::AccountId

  TaskPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub 'comegin-${EnvName}-mautic-cron-task'
      Roles:
        - !Ref TaskRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: EcsExec
            Effect: Allow
            Action:
              - ssmmessages:CreateControlChannel
              - ssmmessages:CreateDataChannel
              - ssmmessages:OpenControlChannel
              - ssmmessages:OpenDataChannel
            Resource: '*'

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub 'comegin-${EnvName}-mautic-cron'
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: !Ref Cpu
      Memory: !Ref Memory
      RuntimePlatform: { CpuArchitecture: X86_64, OperatingSystemFamily: LINUX }
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      Volumes:
        - Name: mautic-media-images
          EFSVolumeConfiguration:
            FilesystemId: !Ref EfsFileSystemId
            TransitEncryption: ENABLED
            AuthorizationConfig: { AccessPointId: !Ref MediaImagesAccessPointId, IAM: DISABLED }
        - Name: mautic-media-files
          EFSVolumeConfiguration:
            FilesystemId: !Ref EfsFileSystemId
            TransitEncryption: ENABLED
            AuthorizationConfig: { AccessPointId: !Ref MediaFilesAccessPointId, IAM: DISABLED }
        - !If
          - MountConfig
          - Name: mautic-config
            EFSVolumeConfiguration:
              FilesystemId: !Ref EfsFileSystemId
              TransitEncryption: ENABLED
              AuthorizationConfig: { AccessPointId: !Ref ConfigAccessPointId, IAM: DISABLED }
          - !Ref AWS::NoValue
      ContainerDefinitions:
        - Name: mautic
          Image: !Sub '${ImageRepositoryUri}:${ImageTag}'
          Essential: true
          Environment:
            - { Name: DOCKER_MAUTIC_ROLE, Value: mautic_cron }
            - { Name: MAUTIC_DB_HOST, Value: !Ref MysqlEndpoint }
            - { Name: MAUTIC_DB_PORT, Value: '3306' }
            - { Name: MAUTIC_DB_DATABASE, Value: mautic }
            - { Name: MAUTIC_DB_USER, Value: mautic }
            - { Name: PHP_INI_VALUE_DATE_TIMEZONE, Value: Asia/Tokyo }
            - { Name: MAUTIC_SITE_URL, Value: !Sub 'https://${MktHost}' }
            - { Name: MAUTIC_TRUSTED_PROXIES, Value: !Sub '["${TrustedProxyCidr}"]' }
          Secrets:
            - { Name: MAUTIC_DB_PASSWORD, ValueFrom: !Sub '${SecretNamePrefix}/mautic/DB_PASSWORD' }
            - { Name: MAUTIC_SECRET_KEY, ValueFrom: !Sub '${SecretNamePrefix}/mautic/SECRET_KEY' }
          MountPoints:
            - { SourceVolume: mautic-media-images, ContainerPath: /var/www/html/docroot/media/images, ReadOnly: false }
            - { SourceVolume: mautic-media-files, ContainerPath: /var/www/html/docroot/media/files, ReadOnly: false }
            - !If
              - MountConfig
              - { SourceVolume: mautic-config, ContainerPath: /var/www/html/config, ReadOnly: false }
              - !Ref AWS::NoValue
          LinuxParameters:
            InitProcessEnabled: true
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroupName
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: mautic-cron

  Service:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: !Sub 'comegin-${EnvName}-mautic-cron'
      Cluster: !Ref ClusterArn
      LaunchType: FARGATE
      DesiredCount: !Ref DesiredCount
      TaskDefinition: !Ref TaskDefinition
      EnableExecuteCommand: !Ref EnableExecuteCommand
      PropagateTags: SERVICE
      # デプロイのサーキットブレーカー: 新しいタスクが起動に失敗し続けたら、直前のリビジョンに戻す。
      DeploymentConfiguration:
        MaximumPercent: 100
        MinimumHealthyPercent: 0
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          SecurityGroups:
            - !Ref SecurityGroupId
          Subnets: !Ref PrivateSubnetIds
      # 固定の 1 タスク。デプロイ中も 2 つ同時に動かさない（二重実行の防止）。止めてから新しいタスクを起動するため、更新中は短く止まる。

Outputs:
  ServiceName:
    Value: !GetAtt Service.Name
  TaskRoleArn:
    Value: !GetAtt TaskRole.Arn
  TaskDefinitionArn:
    Value: !Ref TaskDefinition
