id: weekly-content-plan
description: "採用済みの E-01 から記事の構成案を作り、E-03（plan_state: drafted）として起案する。企画の採否は R2 が決める"
enabled: true
cron: "30 2 * * 3"
kind: agent
agent: content-planner
builtin: null
after: []
prompt: |
  採用済み（adoption_status が adopted）の E-01 のうち、企画がまだ無いものから、記事の構成案を E-03 として本番の Strapi に起案する。

  取得の範囲（変えない）:
  - 起案する数は 1 回の実行で 3 件まで
  - plan_state は drafted のまま。承認と差し戻しは R2 が行う
  - 取材が必要な一次情報を含む企画は assignee_role を R4 にする
  - 同じキーワードに企画が既にあるときは作らない
timeout_sec: 900
max_turns: 40
# 監視アプリに出す説明（2026-11-06。docs/superpowers/specs/2026-11-06-job-agent-info-design.md の 4 節）
overview: |
  Agent content-planner を起動し、採用済み（adoption_status: adopted）で企画がまだ無い E-01 から、記事の構成案を本番の Strapi に E-03（plan_state: drafted）として起案する。1 回の実行で 3 件まで。企画の採否は R2 が決める。
stage: create
io:
  reads:
    - "本番の Strapi の E-01（adopted）・E-03・E-04"
    - "E-12（docs/audits/。根拠に使うとき）"
  writes:
    - "本番の Strapi の E-03（plan_state: drafted）"
  does_not_write:
    - "企画の承認・差し戻し（R2 が行う）"
    - "記事（E-04）"
