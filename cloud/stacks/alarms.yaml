AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  CloudWatch アラーム。すべて ops トピック（comegin-ops-alert）へ直接発行する（n8n を経由しない。TA-05 の 4 節の項目 12〜14）。
  監視対象と通知経路を分けるため（ADR-08）、AWS 側の監視は CloudWatch と SNS だけで完結させる。
  通知は状態が変わったとき（OK から ALARM、ALARM から OK）だけ出す。通知に個人情報を載せない（アラーム名とメトリクスだけ）。
  サービスは DesiredCount が 0 の間、タスク数・ターゲットともに 0 でアラームは鳴らない。
  ハートビートのアラームは observability.yaml。

Parameters:
  EnvName:
    Type: String
    Default: prod
  OpsAlertTopicArn:
    Type: String
    Description: observability.yaml の OpsAlertTopicArn
  ClusterName:
    Type: String
    Description: cluster.yaml の ClusterName（Container Insights の ClusterName ディメンション）
  AlbFullName:
    Type: String
    Description: edge.yaml の AlbFullName（app/<名前>/<ID>）
  MauticWebTargetGroupFullName:
    Type: String
    Description: edge.yaml の MauticWebTargetGroupFullName（targetgroup/<名前>/<ID>）
  ChatwootWebTargetGroupFullName:
    Type: String
    Description: edge.yaml の ChatwootWebTargetGroupFullName（targetgroup/<名前>/<ID>）
  AdminAuthTargetGroupFullName:
    Type: String
    Description: services/admin-auth.yaml の TargetGroupFullName（targetgroup/<名前>/<ID>。ADR-26 で Lambda のターゲット）
  ConsentApiTargetGroupFullName:
    Type: String
    Description: services/consent-api.yaml の TargetGroupFullName（targetgroup/<名前>/<ID>。ADR-26 で Lambda のターゲット）
  MysqlClusterIdentifier:
    Type: String
    Description: data.yaml の MysqlClusterIdentifier（Aurora のクラスター）
  MysqlInstanceIdentifier:
    Type: String
    Description: data.yaml の MysqlInstanceIdentifier（Aurora の書き込みのインスタンス。CPU と接続数はインスタンス単位）
  PostgresClusterIdentifier:
    Type: String
    Description: data.yaml の PostgresClusterIdentifier（Aurora のクラスター）
  PostgresInstanceIdentifier:
    Type: String
    Description: data.yaml の PostgresInstanceIdentifier（Aurora の書き込みのインスタンス）
  WireguardInstanceId:
    Type: String
    Description: wireguard.yaml の InstanceId（オンプレとの WireGuard の EC2）
  FaqBotFunctionName:
    Type: String
    Description: services/faq-bot.yaml の FunctionName（ADR-26 の Lambda）
  ConsentApiFunctionName:
    Type: String
    Description: services/consent-api.yaml の FunctionName（ADR-26 の Lambda）
  AdminAuthFunctionName:
    Type: String
    Description: services/admin-auth.yaml の FunctionName（ADR-26 の Lambda の本体）
  ValkeyReplicationGroupId:
    Type: String
    Description: data.yaml の ValkeyReplicationGroupId（1 ノードなので、ノードの ID は <この値>-001）
  # しきい値（暫定値。実測して決める。TA-06 の 9 節の見積もり前）
  EcsEvaluationMinutes:
    Type: Number
    Default: 5
    MinValue: 1
    Description: タスク数が足りない状態が何分続いたら通知するか。デプロイ中の入れ替わり（mautic-cron は止めてから起動する）で鳴らないための猶予。
  Alb5xxRatioThresholdPercent:
    Type: Number
    Default: 5
    Description: ALB の 5xx の比率（%）。ターゲットの 5xx と ALB 自身の 5xx の合計。
  Alb5xxMinRequestsPer5Min:
    Type: Number
    Default: 20
    Description: 5 分あたりのリクエストがこれ以下のときは比率を見ない（少ない件数の 1 件で鳴らないため）。
  RdsCpuThresholdPercent:
    Type: Number
    Default: 80
  MysqlConnectionsThreshold:
    Type: Number
    Default: 60
    Description: Aurora MySQL（Serverless v2。最大 2 ACU）の接続数のしきい値。最大 ACU を変えたら見直す（max_connections は最大 ACU で決まる）。
  PostgresConnectionsThreshold:
    Type: Number
    Default: 120
    Description: Aurora PostgreSQL（db.t4g.medium）の接続数のしきい値。4 つのデータベース（chatwoot・admin_auth・strapi・n8n）が共有する。インスタンスクラスを変えたら見直す。
  ValkeyMemoryThresholdPercent:
    Type: Number
    Default: 80
  ValkeyEngineCpuThresholdPercent:
    Type: Number
    Default: 80
  SesBounceRateThreshold:
    Type: Number
    Default: 0.04
    Description: SES のバウンス率（0.04 = 4%）。SES は 5% で審査、10% で送信停止（TA-06 の 6 節）。手前で知る。
  SesComplaintRateThreshold:
    Type: Number
    Default: 0.0008
    Description: SES の苦情率（0.0008 = 0.08%）。SES は 0.1% で審査、0.5% で送信停止。手前で知る。

Resources:
  # ---------------------------------------------------------------- ECS: 実行中のタスク数が希望数を下回った（TA-05 の項目 12）
  # Container Insights（cluster.yaml）の RunningTaskCount と DesiredTaskCount の差。
  # Strapi と n8n はオンプレで動かす（ADR-21）。ここには対象が無い（オンプレの死活は、監視アプリのハートビートで見る）。
  MauticWebRunningTaskAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'comegin-${EnvName}-mautic-web-running-tasks'
      AlarmDescription: mautic-web の実行中のタスク数が希望数を下回っている。
      ComparisonOperator: GreaterThanThreshold
      Threshold: 0
      EvaluationPeriods: !Ref EcsEvaluationMinutes
      DatapointsToAlarm: !Ref EcsEvaluationMinutes
      TreatMissingData: notBreaching
      ActionsEnabled: true
      AlarmActions: [!Ref OpsAlertTopicArn]
      OKActions: [!Ref OpsAlertTopicArn]
      Metrics:
        - Id: desired
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: ECS/ContainerInsights
              MetricName: DesiredTaskCount
              Dimensions:
                - { Name: ClusterName, Value: !Ref ClusterName }
                - { Name: ServiceName, Value: !Sub 'comegin-${EnvName}-mautic-web' }
            Period: 60
            Stat: Average
        - Id: running
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: ECS/ContainerInsights
              MetricName: RunningTaskCount
              Dimensions:
                - { Name: ClusterName, Value: !Ref ClusterName }
                - { Name: ServiceName, Value: !Sub 'comegin-${EnvName}-mautic-web' }
            Period: 60
            Stat: Average
        - Id: shortfall
          Label: DesiredTaskCount minus RunningTaskCount
          Expression: desired - running
          ReturnData: true

  MauticCronRunningTaskAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'comegin-${EnvName}-mautic-cron-running-tasks'
      AlarmDescription: mautic-cron の実行中のタスク数が希望数を下回っている。
      ComparisonOperator: GreaterThanThreshold
      Threshold: 0
      EvaluationPeriods: !Ref EcsEvaluationMinutes
      DatapointsToAlarm: !Ref EcsEvaluationMinutes
      TreatMissingData: notBreaching
      ActionsEnabled: true
      AlarmActions: [!Ref OpsAlertTopicArn]
      OKActions: [!Ref OpsAlertTopicArn]
      Metrics:
        - Id: desired
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: ECS/ContainerInsights
              MetricName: DesiredTaskCount
              Dimensions:
                - { Name: ClusterName, Value: !Ref ClusterName }
                - { Name: ServiceName, Value: !Sub 'comegin-${EnvName}-mautic-cron' }
            Period: 60
            Stat: Average
        - Id: running
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: ECS/ContainerInsights
              MetricName: RunningTaskCount
              Dimensions:
                - { Name: ClusterName, Value: !Ref ClusterName }
                - { Name: ServiceName, Value: !Sub 'comegin-${EnvName}-mautic-cron' }
            Period: 60
            Stat: Average
        - Id: shortfall
          Label: DesiredTaskCount minus RunningTaskCount
          Expression: desired - running
          ReturnData: true

  ChatwootWebRunningTaskAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'comegin-${EnvName}-chatwoot-web-running-tasks'
      AlarmDescription: chatwoot-web の実行中のタスク数が希望数を下回っている。
      ComparisonOperator: GreaterThanThreshold
      Threshold: 0
      EvaluationPeriods: !Ref EcsEvaluationMinutes
      DatapointsToAlarm: !Ref EcsEvaluationMinutes
      TreatMissingData: notBreaching
      ActionsEnabled: true
      AlarmActions: [!Ref OpsAlertTopicArn]
      OKActions: [!Ref OpsAlertTopicArn]
      Metrics:
        - Id: desired
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: ECS/ContainerInsights
              MetricName: DesiredTaskCount
              Dimensions:
                - { Name: ClusterName, Value: !Ref ClusterName }
                - { Name: ServiceName, Value: !Sub 'comegin-${EnvName}-chatwoot-web' }
            Period: 60
            Stat: Average
        - Id: running
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: ECS/ContainerInsights
              MetricName: RunningTaskCount
              Dimensions:
                - { Name: ClusterName, Value: !Ref ClusterName }
                - { Name: ServiceName, Value: !Sub 'comegin-${EnvName}-chatwoot-web' }
            Period: 60
            Stat: Average
        - Id: shortfall
          Label: DesiredTaskCount minus RunningTaskCount
          Expression: desired - running
          ReturnData: true

  ChatwootWorkerRunningTaskAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'comegin-${EnvName}-chatwoot-worker-running-tasks'
      AlarmDescription: chatwoot-worker の実行中のタスク数が希望数を下回っている。
      ComparisonOperator: GreaterThanThreshold
      Threshold: 0
      EvaluationPeriods: !Ref EcsEvaluationMinutes
      DatapointsToAlarm: !Ref EcsEvaluationMinutes
      TreatMissingData: notBreaching
      ActionsEnabled: true
      AlarmActions: [!Ref OpsAlertTopicArn]
      OKActions: [!Ref OpsAlertTopicArn]
      Metrics:
        - Id: desired
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: ECS/ContainerInsights
              MetricName: DesiredTaskCount
              Dimensions:
                - { Name: ClusterName, Value: !Ref ClusterName }
                - { Name: ServiceName, Value: !Sub 'comegin-${EnvName}-chatwoot-worker' }
            Period: 60
            Stat: Average
        - Id: running
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: ECS/ContainerInsights
              MetricName: RunningTaskCount
              Dimensions:
                - { Name: ClusterName, Value: !Ref ClusterName }
                - { Name: ServiceName, Value: !Sub 'comegin-${EnvName}-chatwoot-worker' }
            Period: 60
            Stat: Average
        - Id: shortfall
          Label: DesiredTaskCount minus RunningTaskCount
          Expression: desired - running
          ReturnData: true

  # ---------------------------------------------------------------- Lambda: faq-bot の失敗（ADR-26。faq-bot の仕様 8 節）
  # 失敗した会話は Chatwoot が担当者に回している（訪問者は置き去りにならない）。この通知で、ボットが答えていないことに気づく
  FaqBotErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'comegin-${EnvName}-faq-bot-errors'
      AlarmDescription: faq-bot（Lambda）が失敗した。会話は Chatwoot が担当者に回している。
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - { Name: FunctionName, Value: !Ref FaqBotFunctionName }
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      ActionsEnabled: true
      AlarmActions: [!Ref OpsAlertTopicArn]
      OKActions: [!Ref OpsAlertTopicArn]

  # 関数 URL は AuthType NONE で、署名は関数の中で検査する。署名の無い要求を大量に送られると予約同時実行数が埋まり、
  # 正規の Webhook も 429 になる（Chatwoot は送り直さず担当者に回す）。Errors には数えられないので、Throttles で気づく
  FaqBotThrottlesAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'comegin-${EnvName}-faq-bot-throttles'
      AlarmDescription: faq-bot（Lambda）が同時実行数の上限に達し、呼び出しを拒否した（大量の要求か、アカウントの上限）。ボットが答えずに担当者に回っている。
      Namespace: AWS/Lambda
      MetricName: Throttles
      Dimensions:
        - { Name: FunctionName, Value: !Ref FaqBotFunctionName }
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      ActionsEnabled: true
      AlarmActions: [!Ref OpsAlertTopicArn]
      OKActions: [!Ref OpsAlertTopicArn]

  # ---------------------------------------------------------------- Lambda: consent-api（ADR-26。仕様 2.4）
  # Valkey の障害の 503 と想定外の 500 は「応答として返す」ため Errors に数えられない。ターゲットの 5xx で拾う。
  # 同意が成立しないと、新しい訪問者の PostHog・Chatwoot・GA4 が止まる（DD-02 の 8.4）ため、1 件で鳴らす
  ConsentApiErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'comegin-${EnvName}-consent-api-errors'
      AlarmDescription: consent-api（Lambda）が例外・タイムアウト・初期化の失敗で止まった。ALB は 502 を返している。
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - { Name: FunctionName, Value: !Ref ConsentApiFunctionName }
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      ActionsEnabled: true
      AlarmActions: [!Ref OpsAlertTopicArn]
      OKActions: [!Ref OpsAlertTopicArn]

  ConsentApiThrottlesAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'comegin-${EnvName}-consent-api-throttles'
      AlarmDescription: consent-api（Lambda）が予約同時実行数の上限に達し、呼び出しを拒否した。
      Namespace: AWS/Lambda
      MetricName: Throttles
      Dimensions:
        - { Name: FunctionName, Value: !Ref ConsentApiFunctionName }
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      ActionsEnabled: true
      AlarmActions: [!Ref OpsAlertTopicArn]
      OKActions: [!Ref OpsAlertTopicArn]

  ConsentApiTarget5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'comegin-${EnvName}-consent-api-target-5xx'
      AlarmDescription: consent-api が 5xx を返した（Valkey の障害の 503 か、想定外の 500）。同意が記録されず、Cookie も書かれていない。
      Namespace: AWS/ApplicationELB
      MetricName: HTTPCode_Target_5XX_Count
      Dimensions:
        - { Name: TargetGroup, Value: !Ref ConsentApiTargetGroupFullName }
        - { Name: LoadBalancer, Value: !Ref AlbFullName }
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      ActionsEnabled: true
      AlarmActions: [!Ref OpsAlertTopicArn]
      OKActions: [!Ref OpsAlertTopicArn]

  # ---------------------------------------------------------------- Lambda: admin-auth（ADR-26。仕様 2.5）
  # admin-auth は止まっても既存の ALB のセッション（12 時間）のあいだは誰も困らないため、このアラームでしか気づけない（TA-05 の項目 24）。
  # DB の障害などの 500 は「応答として返す」ため Errors に数えられない。ターゲットの 5xx で拾う
  AdminAuthErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'comegin-${EnvName}-admin-auth-errors'
      AlarmDescription: admin-auth（Lambda）が例外・タイムアウト・初期化の失敗で止まった。ALB は 502 を返し、新しいログインができない。
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - { Name: FunctionName, Value: !Ref AdminAuthFunctionName }
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      ActionsEnabled: true
      AlarmActions: [!Ref OpsAlertTopicArn]
      OKActions: [!Ref OpsAlertTopicArn]

  AdminAuthThrottlesAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'comegin-${EnvName}-admin-auth-throttles'
      AlarmDescription: admin-auth（Lambda）が予約同時実行数の上限に達し、呼び出しを拒否した。
      Namespace: AWS/Lambda
      MetricName: Throttles
      Dimensions:
        - { Name: FunctionName, Value: !Ref AdminAuthFunctionName }
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      ActionsEnabled: true
      AlarmActions: [!Ref OpsAlertTopicArn]
      OKActions: [!Ref OpsAlertTopicArn]

  AdminAuthTarget5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'comegin-${EnvName}-admin-auth-target-5xx'
      AlarmDescription: admin-auth が 5xx を返した（DB の障害など）。新しいログインができない。
      Namespace: AWS/ApplicationELB
      MetricName: HTTPCode_Target_5XX_Count
      Dimensions:
        - { Name: TargetGroup, Value: !Ref AdminAuthTargetGroupFullName }
        - { Name: LoadBalancer, Value: !Ref AlbFullName }
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      ActionsEnabled: true
      AlarmActions: [!Ref OpsAlertTopicArn]
      OKActions: [!Ref OpsAlertTopicArn]

  # ---------------------------------------------------------------- ALB: ターゲットが unhealthy（TA-05 の項目 12）
  MauticWebUnhealthyHostAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'comegin-${EnvName}-mautic-web-unhealthy-hosts'
      AlarmDescription: mautic-web のターゲットグループに unhealthy のターゲットがある。
      Namespace: AWS/ApplicationELB
      MetricName: UnHealthyHostCount
      Dimensions:
        - { Name: TargetGroup, Value: !Ref MauticWebTargetGroupFullName }
        - { Name: LoadBalancer, Value: !Ref AlbFullName }
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 3
      DatapointsToAlarm: 3
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      ActionsEnabled: true
      AlarmActions: [!Ref OpsAlertTopicArn]
      OKActions: [!Ref OpsAlertTopicArn]

  ChatwootWebUnhealthyHostAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'comegin-${EnvName}-chatwoot-web-unhealthy-hosts'
      AlarmDescription: chatwoot-web のターゲットグループに unhealthy のターゲットがある。
      Namespace: AWS/ApplicationELB
      MetricName: UnHealthyHostCount
      Dimensions:
        - { Name: TargetGroup, Value: !Ref ChatwootWebTargetGroupFullName }
        - { Name: LoadBalancer, Value: !Ref AlbFullName }
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 3
      DatapointsToAlarm: 3
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      ActionsEnabled: true
      AlarmActions: [!Ref OpsAlertTopicArn]
      OKActions: [!Ref OpsAlertTopicArn]

  # ALB の 5xx の比率（ターゲットの 5xx と ALB 自身の 5xx の合計 / リクエスト数）。リクエストが少ないときは比率を見ない。
  Alb5xxRatioAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'comegin-${EnvName}-alb-5xx-ratio'
      AlarmDescription: ALB の 5xx の比率がしきい値を超えている。
      ComparisonOperator: GreaterThanThreshold
      Threshold: !Ref Alb5xxRatioThresholdPercent
      EvaluationPeriods: 3
      DatapointsToAlarm: 3
      TreatMissingData: notBreaching
      ActionsEnabled: true
      AlarmActions: [!Ref OpsAlertTopicArn]
      OKActions: [!Ref OpsAlertTopicArn]
      Metrics:
        - Id: target5xx
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/ApplicationELB
              MetricName: HTTPCode_Target_5XX_Count
              Dimensions:
                - { Name: LoadBalancer, Value: !Ref AlbFullName }
            Period: 300
            Stat: Sum
        - Id: elb5xx
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/ApplicationELB
              MetricName: HTTPCode_ELB_5XX_Count
              Dimensions:
                - { Name: LoadBalancer, Value: !Ref AlbFullName }
            Period: 300
            Stat: Sum
        - Id: requests
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/ApplicationELB
              MetricName: RequestCount
              Dimensions:
                - { Name: LoadBalancer, Value: !Ref AlbFullName }
            Period: 300
            Stat: Sum
        - Id: ratio
          Label: 5xx ratio (percent)
          Expression: !Sub 'IF(FILL(requests, 0) > ${Alb5xxMinRequestsPer5Min}, 100 * (FILL(target5xx, 0) + FILL(elb5xx, 0)) / FILL(requests, 0), 0)'
          ReturnData: true

  # ---------------------------------------------------------------- Aurora（TA-05 の項目 13）
  # Aurora のストレージは自動で伸びる（空き容量のアラームは置かない。FreeStorageSpace のメトリクスも無い）。
  # オンプレの n8n の実行履歴は増え続けて費用（GB 月）に効くので、n8n の実行履歴の保持設定（EXECUTIONS_DATA_MAX_AGE）で抑える。
  # 障害・フェイルオーバー・メンテナンスは、下の EventSubscription（インスタンスとクラスター）で知る。
  MysqlCpuAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'comegin-${EnvName}-mysql-cpu'
      AlarmDescription: Mysql の CPU 使用率が高い状態が続いている。
      Namespace: AWS/RDS
      MetricName: CPUUtilization
      Dimensions:
        - { Name: DBInstanceIdentifier, Value: !Ref MysqlInstanceIdentifier }
      Statistic: Average
      Period: 300
      EvaluationPeriods: 3
      DatapointsToAlarm: 3
      Threshold: !Ref RdsCpuThresholdPercent
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      ActionsEnabled: true
      AlarmActions: [!Ref OpsAlertTopicArn]
      OKActions: [!Ref OpsAlertTopicArn]

  MysqlConnectionsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'comegin-${EnvName}-mysql-connections'
      AlarmDescription: Mysql の接続数がしきい値を超えている。
      Namespace: AWS/RDS
      MetricName: DatabaseConnections
      Dimensions:
        - { Name: DBInstanceIdentifier, Value: !Ref MysqlInstanceIdentifier }
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 3
      DatapointsToAlarm: 3
      Threshold: !Ref MysqlConnectionsThreshold
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      ActionsEnabled: true
      AlarmActions: [!Ref OpsAlertTopicArn]
      OKActions: [!Ref OpsAlertTopicArn]

  PostgresCpuAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'comegin-${EnvName}-postgres-cpu'
      AlarmDescription: Postgres の CPU 使用率が高い状態が続いている。
      Namespace: AWS/RDS
      MetricName: CPUUtilization
      Dimensions:
        - { Name: DBInstanceIdentifier, Value: !Ref PostgresInstanceIdentifier }
      Statistic: Average
      Period: 300
      EvaluationPeriods: 3
      DatapointsToAlarm: 3
      Threshold: !Ref RdsCpuThresholdPercent
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      ActionsEnabled: true
      AlarmActions: [!Ref OpsAlertTopicArn]
      OKActions: [!Ref OpsAlertTopicArn]

  PostgresConnectionsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'comegin-${EnvName}-postgres-connections'
      AlarmDescription: Postgres の接続数がしきい値を超えている。
      Namespace: AWS/RDS
      MetricName: DatabaseConnections
      Dimensions:
        - { Name: DBInstanceIdentifier, Value: !Ref PostgresInstanceIdentifier }
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 3
      DatapointsToAlarm: 3
      Threshold: !Ref PostgresConnectionsThreshold
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      ActionsEnabled: true
      AlarmActions: [!Ref OpsAlertTopicArn]
      OKActions: [!Ref OpsAlertTopicArn]

  # メトリクスでは分からない障害を、RDS のイベントで ops トピックへ直接送る。
  # 発行を許すのは observability.yaml の ops トピックのポリシー（AllowRdsEvents）。
  # カテゴリは 2026-10-26 に DescribeEventCategories（ap-northeast-1）で、インスタンスとクラスターのそれぞれで使えるものを確かめた。
  RdsEventSubscription:
    Type: AWS::RDS::EventSubscription
    Properties:
      SnsTopicArn: !Ref OpsAlertTopicArn
      SourceType: db-instance
      SourceIds:
        - !Ref MysqlInstanceIdentifier
        - !Ref PostgresInstanceIdentifier
      EventCategories:
        - availability
        - failure
        - failover
        - recovery
      Enabled: true

  RdsClusterEventSubscription:
    Type: AWS::RDS::EventSubscription
    Properties:
      SnsTopicArn: !Ref OpsAlertTopicArn
      SourceType: db-cluster
      SourceIds:
        - !Ref MysqlClusterIdentifier
        - !Ref PostgresClusterIdentifier
      EventCategories:
        - failover
        - failure
        - maintenance
        - notification
      Enabled: true

  # ---------------------------------------------------------------- ElastiCache（Valkey。TA-05 の項目 13）
  # メモリの上限に近づくと追い出し（eviction）が起き、Chatwoot のキューのジョブや同意の記録が失われうる（TTL が未決のため増え続ける側。TA-06 の 11 節）。
  ValkeyMemoryAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'comegin-${EnvName}-valkey-memory'
      AlarmDescription: Valkey のメモリ使用率がしきい値を超えている。
      Namespace: AWS/ElastiCache
      MetricName: DatabaseMemoryUsagePercentage
      Dimensions:
        - { Name: CacheClusterId, Value: !Sub '${ValkeyReplicationGroupId}-001' }
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 3
      DatapointsToAlarm: 3
      Threshold: !Ref ValkeyMemoryThresholdPercent
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      ActionsEnabled: true
      AlarmActions: [!Ref OpsAlertTopicArn]
      OKActions: [!Ref OpsAlertTopicArn]

  ValkeyEvictionsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'comegin-${EnvName}-valkey-evictions'
      AlarmDescription: Valkey で追い出し（eviction）が起きている。
      Namespace: AWS/ElastiCache
      MetricName: Evictions
      Dimensions:
        - { Name: CacheClusterId, Value: !Sub '${ValkeyReplicationGroupId}-001' }
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      ActionsEnabled: true
      AlarmActions: [!Ref OpsAlertTopicArn]
      OKActions: [!Ref OpsAlertTopicArn]

  ValkeyEngineCpuAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'comegin-${EnvName}-valkey-engine-cpu'
      AlarmDescription: Valkey のエンジンの CPU 使用率が高い状態が続いている（シングルスレッドのため、ノード全体の CPU より先に詰まる）。
      Namespace: AWS/ElastiCache
      MetricName: EngineCPUUtilization
      Dimensions:
        - { Name: CacheClusterId, Value: !Sub '${ValkeyReplicationGroupId}-001' }
      Statistic: Average
      Period: 300
      EvaluationPeriods: 3
      DatapointsToAlarm: 3
      Threshold: !Ref ValkeyEngineCpuThresholdPercent
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      ActionsEnabled: true
      AlarmActions: [!Ref OpsAlertTopicArn]
      OKActions: [!Ref OpsAlertTopicArn]

  # ---------------------------------------------------------------- SES のバウンス率と苦情率（アカウント単位。TA-05 の項目 14）
  # 基準に達すると顧客向けメールが送れなくなる（TA-06 の 6 節）。サンドボックスのままで送っていない間はデータが無く、鳴らない。
  SesBounceRateAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'comegin-${EnvName}-ses-bounce-rate'
      AlarmDescription: SES のバウンス率が送信停止の基準に近づいている。
      Namespace: AWS/SES
      MetricName: Reputation.BounceRate
      Statistic: Maximum
      Period: 3600
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: !Ref SesBounceRateThreshold
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      ActionsEnabled: true
      AlarmActions: [!Ref OpsAlertTopicArn]
      OKActions: [!Ref OpsAlertTopicArn]

  SesComplaintRateAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'comegin-${EnvName}-ses-complaint-rate'
      AlarmDescription: SES の苦情率が送信停止の基準に近づいている。
      Namespace: AWS/SES
      MetricName: Reputation.ComplaintRate
      Statistic: Maximum
      Period: 3600
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: !Ref SesComplaintRateThreshold
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      ActionsEnabled: true
      AlarmActions: [!Ref OpsAlertTopicArn]
      OKActions: [!Ref OpsAlertTopicArn]

  # ---------------------------------------------------------------- WireGuard の EC2（ADR-21。wireguard.yaml）
  # 止まると、オンプレの Strapi・n8n が RDS に届かず、Mautic・Chatwoot の Webhook がオンプレに届かない。
  # 訪問者に届くサービスは止まらない。通知は ops トピックへ。
  WireguardStatusCheckAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'comegin-${EnvName}-wireguard-status-check'
      AlarmDescription: WireGuard の EC2 のステータスチェック（インスタンスまたはシステム）が失敗している。オンプレとの経路が止まっている可能性がある。
      Namespace: AWS/EC2
      MetricName: StatusCheckFailed
      Dimensions:
        - { Name: InstanceId, Value: !Ref WireguardInstanceId }
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 3
      DatapointsToAlarm: 3
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      # 停止やデータの欠落も異常として扱う（常時動かす 1 台のため）。
      TreatMissingData: breaching
      ActionsEnabled: true
      AlarmActions: [!Ref OpsAlertTopicArn]
      OKActions: [!Ref OpsAlertTopicArn]

  # システム側（ホストの障害）のときは、同じインスタンス ID・ENI・Elastic IP・EBS（秘密鍵）のまま自動復旧する。
  # 復旧後は wg-quick が起動し、ピアは SSM のパラメータから数分で戻る。通知も出す。
  WireguardSystemRecoverAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'comegin-${EnvName}-wireguard-system-recover'
      AlarmDescription: WireGuard の EC2 のシステムステータスチェックが失敗したため、自動復旧を実行した。
      Namespace: AWS/EC2
      MetricName: StatusCheckFailed_System
      Dimensions:
        - { Name: InstanceId, Value: !Ref WireguardInstanceId }
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      ActionsEnabled: true
      AlarmActions:
        - !Sub 'arn:${AWS::Partition}:automate:${AWS::Region}:ec2:recover'
        - !Ref OpsAlertTopicArn
      OKActions: [!Ref OpsAlertTopicArn]
