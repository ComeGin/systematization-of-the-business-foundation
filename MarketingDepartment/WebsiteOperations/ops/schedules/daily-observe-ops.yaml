id: daily-observe-ops
description: "本番の PostHog の Error Tracking（直近 24 時間の例外）を E-12（source: ops）に変換する（日次の観測 4 本のうちの 1 本）"
enabled: false
cron: "0 6 * * *"
kind: agent
agent: ops-watcher
builtin: null
after: []
prompt: |
  本番用の PostHog プロジェクト（posthog-prod）の Error Tracking を読み、E-12（source: ops）に変換する。

  取得の範囲（変えない）:
  - 期間: 直近 24 時間
  - 対象: 課題（issue）の件数、課題ごとの発生件数と影響を受けたユーザー数
  - 使うのは query-error-tracking-issues-list と query-error-tracking-issue だけ。課題の状態の変更・抑制・割り当て・アラートの作成などは行わない
  - スタックトレース・例外のメッセージ・ユーザーの識別子を成果物に書かない
timeout_sec: 900
max_turns: 40
