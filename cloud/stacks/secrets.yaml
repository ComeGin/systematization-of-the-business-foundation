AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Secrets Manager のシークレット。TA-06 の 7 節、TA-04 の 1 節。
  名前は comegin/<EnvName>/<サービス>/<変数名>。1 つのシークレットに値を 1 つだけ入れる（平文）。
  サービス側は ECS の secrets の valueFrom に、名前から組み立てた部分 ARN（arn:…:secret:<名前>。末尾の 6 文字なし）を書いて注入する
  （ECS の Secrets Manager は ARN だけを受け付ける。名前で指定できるのは SSM のパラメータだけ）。CloudFormation の動的参照（edge・data）は名前で読む。
  値は 2 通り: 自動生成（英数字のみ。DB の URL に入れても壊れないようにするため）か、値なしのプレースホルダ。
  プレースホルダは人間が README の手順で値を入れる。値なしのままタスクを起動すると ECS が起動に失敗するので、入れ忘れに気づける。

Parameters:
  EnvName:
    Type: String
    Default: prod

# cfn-guard の SECRETSMANAGER_USING_CMK / ローテーションの指摘は意図した例外:
#   - 暗号化は aws/secretsmanager（AWS 管理キー）のまま。CMK を使うとタスク実行ロールに KMS の権限も要り、費用も増える。
#   - 自動ローテーションは使わない。鍵・ソルトは変えると既存データを復号できなくなる（TA-06 の 7 節）。DB パスワードは URL 組み立てがあり手順で変える。
# 削除は Retain。Secrets Manager の値を消したり作り直したりしない（TA-06 の 7 節）。
# Strapi と n8n はオンプレで動かす（ADR-21）。アプリの鍵類（APP_KEYS・ENCRYPTION_KEY・N8N_ENCRYPTION_KEY など）はここに置かず、
# オンプレの秘匿ファイルにだけ置く。ここに残すのは、RDS の strapi・n8n データベースのユーザーのパスワードだけ（下の DB_PASSWORD の 2 個）。
# 運用者がこの 2 つの値を取り出して、オンプレの秘匿ファイルに写す（README の 4.8）。ECS のタスク定義は参照しない。
# Cal.com は SaaS（cal.com の無料プラン）にした（ADR-24）。セルフホスト用の Secret（DB_PASSWORD・NEXTAUTH_SECRET・CALENDSO_ENCRYPTION_KEY・GOOGLE_API_CREDENTIALS）は持たない。
Resources:
  # ---------------------------------------------------------------- 共有
  ValkeyAuthToken:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub 'comegin/${EnvName}/shared/VALKEY_AUTH_TOKEN'
      Description: ElastiCache (Valkey) AUTH token. Used by Chatwoot and consent-api.
      GenerateSecretString: { PasswordLength: 64, ExcludePunctuation: true }

  # ---------------------------------------------------------------- DB のアプリ用ユーザーのパスワード
  # RDS のマスターパスワードは RDS 自身が管理する（ManageMasterUserPassword）ので、ここには置かない。
  # アプリ用のユーザーは ops-tasks.yaml の 1 回だけのタスクが、この値で作る。
  MauticDbPassword:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub 'comegin/${EnvName}/mautic/DB_PASSWORD'
      Description: MySQL password of the mautic application user.
      GenerateSecretString: { PasswordLength: 32, ExcludePunctuation: true }

  ChatwootDbPassword:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub 'comegin/${EnvName}/chatwoot/DB_PASSWORD'
      Description: PostgreSQL password of the chatwoot application user.
      GenerateSecretString: { PasswordLength: 32, ExcludePunctuation: true }

  StrapiDbPassword:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub 'comegin/${EnvName}/strapi/DB_PASSWORD'
      Description: PostgreSQL password of the strapi application user (used on-premises; copied by an operator).
      GenerateSecretString: { PasswordLength: 32, ExcludePunctuation: true }

  N8nDbPassword:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub 'comegin/${EnvName}/n8n/DB_PASSWORD'
      Description: PostgreSQL password of the n8n application user (used on-premises; copied by an operator).
      GenerateSecretString: { PasswordLength: 32, ExcludePunctuation: true }

  AdminAuthDbPassword:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub 'comegin/${EnvName}/admin-auth/DB_PASSWORD'
      Description: PostgreSQL password of the admin_auth application user.
      GenerateSecretString: { PasswordLength: 32, ExcludePunctuation: true }

  # ---------------------------------------------------------------- SES の SMTP 認証情報（プレースホルダ）
  # SES の SMTP 認証情報は IAM のアクセスキーから導出するため、CloudFormation では作れない。
  # Mautic 用と Chatwoot 用で別々に発行する（TA-06 の 6 節）。ユーザー名はアクセスキー ID。
  MauticSmtpUsername:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub 'comegin/${EnvName}/mautic/SMTP_USERNAME'
      Description: Placeholder. SES SMTP username (access key ID) for Mautic.

  MauticSmtpPassword:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub 'comegin/${EnvName}/mautic/SMTP_PASSWORD'
      Description: Placeholder. SES SMTP password for Mautic.

  ChatwootSmtpUsername:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub 'comegin/${EnvName}/chatwoot/SMTP_USERNAME'
      Description: Placeholder. SES SMTP username (access key ID) for Chatwoot.

  ChatwootSmtpPassword:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub 'comegin/${EnvName}/chatwoot/SMTP_PASSWORD'
      Description: Placeholder. SES SMTP password for Chatwoot.

  # ---------------------------------------------------------------- faq-bot（プレースホルダ。ADR-26）
  # 本番の Chatwoot でエージェントボット「FAQ ボット」を作ったときの access_token と secret（cloud/README.md の faq-bot の節）。
  # faq-bot の Lambda がコールドスタートで読む。ECS のタスク定義は参照しない
  FaqBotChatwootBotToken:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub 'comegin/${EnvName}/faq-bot/CHATWOOT_BOT_TOKEN'
      Description: Placeholder. Access token of the Chatwoot agent bot (FAQ bot).

  FaqBotChatwootBotSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub 'comegin/${EnvName}/faq-bot/CHATWOOT_BOT_SECRET'
      Description: Placeholder. Webhook signing secret of the Chatwoot agent bot (FAQ bot).

  # ---------------------------------------------------------------- 暗号化の鍵（変えると既存データを復号できなくなる）
  ChatwootSecretKeyBase:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub 'comegin/${EnvName}/chatwoot/SECRET_KEY_BASE'
      Description: Chatwoot SECRET_KEY_BASE (alphanumeric).
      GenerateSecretString: { PasswordLength: 128, ExcludePunctuation: true }

  ChatwootEncryptionPrimaryKey:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub 'comegin/${EnvName}/chatwoot/ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY'
      Description: Chatwoot Active Record encryption primary key.
      GenerateSecretString: { PasswordLength: 32, ExcludePunctuation: true }

  ChatwootEncryptionDeterministicKey:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub 'comegin/${EnvName}/chatwoot/ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY'
      Description: Chatwoot Active Record encryption deterministic key.
      GenerateSecretString: { PasswordLength: 32, ExcludePunctuation: true }

  ChatwootEncryptionKeyDerivationSalt:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub 'comegin/${EnvName}/chatwoot/ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT'
      Description: Chatwoot Active Record encryption key derivation salt.
      GenerateSecretString: { PasswordLength: 32, ExcludePunctuation: true }

  MauticSecretKey:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub 'comegin/${EnvName}/mautic/SECRET_KEY'
      Description: Mautic application secret_key.
      GenerateSecretString: { PasswordLength: 64, ExcludePunctuation: true }

  # ---------------------------------------------------------------- admin-auth
  AdminAuthBetterAuthSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub 'comegin/${EnvName}/admin-auth/BETTER_AUTH_SECRET'
      Description: Better Auth secret of admin-auth.
      GenerateSecretString: { PasswordLength: 64, ExcludePunctuation: true }

  # Google の OAuth クライアント（Workspace の「内部」）のシークレット。Google Cloud で発行した値を人間が入れる。
  AdminAuthGoogleClientSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub 'comegin/${EnvName}/admin-auth/GOOGLE_CLIENT_SECRET'
      Description: Placeholder. Google OAuth client secret for admin-auth login.

  # ALB の authenticate-oidc のクライアントシークレット。ALB（edge.yaml が動的参照で読む）と admin-auth の
  # 両方が同じ値を知る必要があるため、ここで自動生成して両方に渡す（人間が値を運ばなくてよい）。
  AdminAuthAlbClientSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub 'comegin/${EnvName}/admin-auth/ALB_CLIENT_SECRET'
      Description: OIDC client secret shared by the ALB listener rules and admin-auth.
      GenerateSecretString: { PasswordLength: 64, ExcludePunctuation: true }

Outputs:
  # サービス側は arn:…:secret:<SecretNamePrefix>/<サービス>/<変数名>（部分 ARN）で参照する。ECS の valueFrom に名前だけを書くと SSM のパラメータとして扱われ、タスクが起動しない。
  SecretNamePrefix:
    Value: !Sub 'comegin/${EnvName}'
