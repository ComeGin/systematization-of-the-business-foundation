# 本番の n8n（オンプレ。ADR-21）。データは AWS の RDS（PostgreSQL の n8n データベース）にあり、WireGuard 越しにつなぐ。
#
# 開発環境の middleware/n8n/compose.yml（ローカルの PostgreSQL・サンドボックス・SearXNG つき、5678）とは別のインスタンス。
# 本番にはサンドボックス（privileged な Docker-in-Docker）・SearXNG・PostgreSQL を置かない。
#
#   ホスト                                        コンテナ
#   127.0.0.1:5679 ───────────────────────────▶ n8n:5678                  エディター・API・MCP（人とローカルのエージェントだけ）
#   ${WG_ADDRESS}:5680 ──▶ webhook-proxy:8080 ──▶ n8n:5678                /webhook/* の POST だけ（クラウドの Mautic・Chatwoot から）
#
# 起動の順番は WireGuard（wg-quick@wg0）→ Strapi → n8n。${WG_ADDRESS} のアドレスが wg0 に無いと、
# webhook-proxy は Docker がバインドできず起動しない（README.md の「起動の順番」）。
#
# 初回の準備:
#   ./dev/init-env.sh        # .env を作り、暗号化キーなどを生成する（DB のパスワードは人が入れる）
#   docker compose build     # 派生イメージ（RDS の CA つき）
#   docker compose up -d

services:
  n8n:
    build:
      context: .
      args:
        N8N_VERSION: ${N8N_VERSION:?.env に N8N_VERSION を設定してください（.env.example を参照）}
    image: comegin/n8n-onprem:${N8N_VERSION}
    restart: unless-stopped
    ports:
      # エディター・API・MCP。ループバックだけ。WireGuard のアドレスにも LAN にも開かない
      - '127.0.0.1:${N8N_EDITOR_PORT_HOST:-5679}:5678'
    # .env 全体は渡さず、必要な変数だけを明示する
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: ${DB_POSTGRESDB_HOST:?.env に DB_POSTGRESDB_HOST（RDS のエンドポイント）を設定してください}
      DB_POSTGRESDB_PORT: ${DB_POSTGRESDB_PORT:-5432}
      DB_POSTGRESDB_DATABASE: ${DB_POSTGRESDB_DATABASE:-n8n}
      DB_POSTGRESDB_USER: ${DB_POSTGRESDB_USER:-n8n}
      DB_POSTGRESDB_PASSWORD: ${DB_POSTGRESDB_PASSWORD:?.env に DB_POSTGRESDB_PASSWORD を設定してください（RDS の n8n ユーザーのパスワード。人が入れる）}
      # RDS のサーバー証明書を検証する（派生イメージが CA を /etc/rds/ に置いている）。false にしない
      DB_POSTGRESDB_SSL_CA_FILE: /etc/rds/global-bundle.pem
      DB_POSTGRESDB_SSL_REJECT_UNAUTHORIZED: 'true'
      # 保存済みの資格情報の暗号化キー。一度作ったら変えない（変えると RDS 上の資格情報をすべて復号できなくなる）
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?.env に N8N_ENCRYPTION_KEY を設定してください（dev/init-env.sh で生成できます）}
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-Asia/Tokyo}
      TZ: ${TZ:-Asia/Tokyo}
      # Code ノードは別コンテナ（runners）で実行する
      N8N_RUNNERS_MODE: external
      N8N_RUNNERS_AUTH_TOKEN: ${N8N_RUNNERS_AUTH_TOKEN:?.env に N8N_RUNNERS_AUTH_TOKEN を設定してください（dev/init-env.sh で生成できます）}
      N8N_RUNNERS_BROKER_LISTEN_ADDRESS: 0.0.0.0
      # Webhook の URL として n8n が表示する値。クラウドの Mautic・Chatwoot に登録する宛先と同じにする（末尾のスラッシュを含める）。
      # N8N_WEBHOOK_URL は n8n 2.35.0 で WEBHOOK_URL を置き換えた名前
      N8N_WEBHOOK_URL: http://${WG_ADDRESS:?.env に WG_ADDRESS（WireGuard のオンプレ側のアドレス）を設定してください}:5680/
      N8N_EDITOR_BASE_URL: http://127.0.0.1:${N8N_EDITOR_PORT_HOST:-5679}
      # webhook-proxy の 1 段を信頼する（X-Forwarded-For を読む）
      N8N_PROXY_HOPS: '1'
    volumes:
      - n8n-data:/home/node/.n8n
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:5678/healthz']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  runners:
    # n8n 本体とバージョンを必ず一致させる（N8N_VERSION）。DB には接続しない
    image: ghcr.io/n8n-io/runners:${N8N_VERSION}
    restart: unless-stopped
    depends_on:
      - n8n
    environment:
      N8N_RUNNERS_AUTH_TOKEN: ${N8N_RUNNERS_AUTH_TOKEN}
      N8N_RUNNERS_TASK_BROKER_URI: http://n8n:5679
      # アイドル状態のランナーは終了し、タスクが来ると再起動する
      N8N_RUNNERS_AUTO_SHUTDOWN_TIMEOUT: '15'
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-Asia/Tokyo}
    # ポートは公開しない

  webhook-proxy:
    # /webhook/* の POST だけを n8n に通す。設定は proxy/webhook-proxy.conf.template
    image: nginxinc/nginx-unprivileged:1.29.8-alpine
    restart: unless-stopped
    depends_on:
      n8n:
        condition: service_healthy
    ports:
      # WireGuard のアドレスだけに開く。127.0.0.1 にも 0.0.0.0 にも開かない（クラウドの製品から届く唯一の口）
      - '${WG_ADDRESS:?.env に WG_ADDRESS を設定してください}:5680:8080'
    environment:
      # /webhook/ を受け付ける送信元（空白区切りで複数可。IPv4 のアドレスか CIDR）。EC2 が VPC からの通信を masquerade するので、
      # 本番は常に 10.99.0.1 だけ。Docker のブリッジは足さない（同じマシンの別のコンテナから届いてしまう）。
      # ローカルで試すときだけ、ブリッジのアドレスを足す（README.md の「疎通の確かめ方」）
      WEBHOOK_ALLOWED_SOURCES: ${WEBHOOK_ALLOWED_SOURCES:-10.99.0.1}
    volumes:
      # nginx 公式イメージの templates 機能が、起動時に conf.d/default.conf を作る
      - ./proxy/webhook-proxy.conf.template:/etc/nginx/templates/default.conf.template:ro
      # 起動時に、許可する送信元の geo（conf.d/00-allowed-sources.conf）を WEBHOOK_ALLOWED_SOURCES から作る。実行権が要る
      - ./proxy/05-allowed-sources.sh:/docker-entrypoint.d/05-allowed-sources.sh:ro
    read_only: true
    tmpfs:
      - /tmp
      # 生成した設定の置き場（read_only のため。nginx-unprivileged のユーザーは uid 101）
      - /etc/nginx/conf.d:uid=101,gid=101,mode=0755
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8080/_proxy_health']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  n8n-data:
