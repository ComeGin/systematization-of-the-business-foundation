AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  ネットワーク。新しい VPC（2AZ の public / private、NAT Gateway 1 台、S3 ゲートウェイエンドポイント）と、
  すべてのセキュリティグループ。TA-06 の 5.6。
  セキュリティグループとその ingress は、子スタック間の循環参照を避けるためここにまとめる。

Parameters:
  EnvName:
    Type: String
    Default: prod
    Description: 環境名。リソース名に入る。
  VpcCidr:
    Type: String
    Default: 10.20.0.0/16
    Description: デフォルト VPC（172.31.0.0/16）と重ならない範囲にする。
  PublicSubnet1Cidr:
    Type: String
    Default: 10.20.0.0/24
  PublicSubnet2Cidr:
    Type: String
    Default: 10.20.1.0/24
  PrivateSubnet1Cidr:
    Type: String
    Default: 10.20.10.0/24
  PrivateSubnet2Cidr:
    Type: String
    Default: 10.20.11.0/24
  # コンテナの待ち受けポート。ALB からの ingress に使う。
  # 上流製品のポートは各公式イメージの既定値（TODO: T1-3 で各テンプレートの値と突き合わせる）。
  MauticWebPort:
    Type: Number
    Default: 80
  ChatwootWebPort:
    Type: Number
    Default: 3000
  UmamiPort:
    Type: Number
    Default: 3000
  AdminAuthPort:
    Type: Number
    Default: 3103
  CalcomPort:
    Type: Number
    Default: 3000
  ConsentApiPort:
    Type: Number
    Default: 3104
  # WireGuard（ADR-21）。オンプレの n8n の Webhook の受け口は、WireGuard のアドレス（10.99.0.2）の 5680 だけ。
  WireguardPort:
    Type: Number
    Default: 51820
    Description: WireGuard の待ち受け UDP ポート。
  WireguardIngressCidr:
    Type: String
    Default: 0.0.0.0/0
    Description: >-
      WireGuard の UDP を受ける送信元の CIDR。オンプレの送信元 IP が固定でないため既定は 0.0.0.0/0。
      固定の IP が使えるようになったら絞る。守りは WireGuard の鍵の認証（鍵を知らない相手には応答しない）。
  OnpremWebhookPort:
    Type: Number
    Default: 5680
    Description: オンプレのリバースプロキシ（n8n の /webhook/* だけを通す）のポート。WireGuard のアドレスにだけ開く。

Resources:
  # ---------------------------------------------------------------- VPC
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - { Key: Name, Value: !Sub 'comegin-${EnvName}' }

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - { Key: Name, Value: !Sub 'comegin-${EnvName}' }

  InternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  # ---------------------------------------------------------------- サブネット
  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [0, !GetAZs '']
      CidrBlock: !Ref PublicSubnet1Cidr
      MapPublicIpOnLaunch: false
      Tags:
        - { Key: Name, Value: !Sub 'comegin-${EnvName}-public-1' }

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [1, !GetAZs '']
      CidrBlock: !Ref PublicSubnet2Cidr
      MapPublicIpOnLaunch: false
      Tags:
        - { Key: Name, Value: !Sub 'comegin-${EnvName}-public-2' }

  PrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [0, !GetAZs '']
      CidrBlock: !Ref PrivateSubnet1Cidr
      MapPublicIpOnLaunch: false
      Tags:
        - { Key: Name, Value: !Sub 'comegin-${EnvName}-private-1' }

  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [1, !GetAZs '']
      CidrBlock: !Ref PrivateSubnet2Cidr
      MapPublicIpOnLaunch: false
      Tags:
        - { Key: Name, Value: !Sub 'comegin-${EnvName}-private-2' }

  # ---------------------------------------------------------------- ルーティング
  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - { Key: Name, Value: !Sub 'comegin-${EnvName}-public' }

  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: InternetGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet1
      RouteTableId: !Ref PublicRouteTable

  PublicSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet2
      RouteTableId: !Ref PublicRouteTable

  # NAT Gateway は 1 台（単一 AZ。TA-06 の 4.6 で決定）。その AZ が落ちると、タスクから外への送信が止まる。
  NatGatewayEip:
    Type: AWS::EC2::EIP
    DependsOn: InternetGatewayAttachment
    Properties:
      Domain: vpc
      Tags:
        - { Key: Name, Value: !Sub 'comegin-${EnvName}-nat' }

  NatGateway:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NatGatewayEip.AllocationId
      SubnetId: !Ref PublicSubnet1
      Tags:
        - { Key: Name, Value: !Sub 'comegin-${EnvName}' }

  # NAT が 1 台なので、private のルートテーブルも 1 つで足りる。
  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - { Key: Name, Value: !Sub 'comegin-${EnvName}-private' }

  PrivateDefaultRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway

  PrivateSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet1
      RouteTableId: !Ref PrivateRouteTable

  PrivateSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet2
      RouteTableId: !Ref PrivateRouteTable

  # S3 ゲートウェイエンドポイント（無料）。S3 への通信を NAT Gateway に通さない。
  S3GatewayEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      VpcEndpointType: Gateway
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.s3'
      RouteTableIds:
        - !Ref PrivateRouteTable

  # ---------------------------------------------------------------- セキュリティグループ
  # ALB はインターネットから 443 だけを受ける（80 のリスナーは作らない）。
  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ALB - 443 from the internet only
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        # cfn-guard の「0.0.0.0/0 への ingress」の指摘は、ALB の役割上の意図した例外。
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0, Description: HTTPS from the internet }
      # ALB の authenticate-oidc は、ALB 自身が IdP（auth. ホスト）のトークンと UserInfo のエンドポイントを
      # インターネット経由で呼ぶため、443 の外向きが要る。ターゲットへはサービスの SG とポートに限る。
      SecurityGroupEgress:
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0, Description: OIDC IdP endpoints }
        - { IpProtocol: tcp, FromPort: !Ref MauticWebPort, ToPort: !Ref MauticWebPort, DestinationSecurityGroupId: !Ref MauticWebSecurityGroup, Description: To mautic-web }
        - { IpProtocol: tcp, FromPort: !Ref ChatwootWebPort, ToPort: !Ref ChatwootWebPort, DestinationSecurityGroupId: !Ref ChatwootWebSecurityGroup, Description: To chatwoot-web }
        - { IpProtocol: tcp, FromPort: !Ref UmamiPort, ToPort: !Ref UmamiPort, DestinationSecurityGroupId: !Ref UmamiSecurityGroup, Description: To umami }
        - { IpProtocol: tcp, FromPort: !Ref AdminAuthPort, ToPort: !Ref AdminAuthPort, DestinationSecurityGroupId: !Ref AdminAuthSecurityGroup, Description: To admin-auth }
        - { IpProtocol: tcp, FromPort: !Ref CalcomPort, ToPort: !Ref CalcomPort, DestinationSecurityGroupId: !Ref CalcomSecurityGroup, Description: To calcom }
        - { IpProtocol: tcp, FromPort: !Ref ConsentApiPort, ToPort: !Ref ConsentApiPort, DestinationSecurityGroupId: !Ref ConsentApiSecurityGroup, Description: To consent-api }
      Tags:
        - { Key: Name, Value: !Sub 'comegin-${EnvName}-alb' }

  # サービスごとに SG を分ける。とくに consent-api は Valkey にだけ届き、RDS には届かない（TA-06 の 3.1）。
  MauticWebSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: mautic-web tasks
      VpcId: !Ref Vpc
      SecurityGroupEgress:
        - { IpProtocol: tcp, FromPort: 0, ToPort: 65535, CidrIp: 0.0.0.0/0, Description: Outbound via NAT for ECR and Secrets Manager and SES and external APIs }
      Tags:
        - { Key: Name, Value: !Sub 'comegin-${EnvName}-mautic-web' }

  MauticCronSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: mautic-cron tasks (no ingress)
      VpcId: !Ref Vpc
      SecurityGroupEgress:
        - { IpProtocol: tcp, FromPort: 0, ToPort: 65535, CidrIp: 0.0.0.0/0, Description: Outbound via NAT for ECR and Secrets Manager and SES and external APIs }
      Tags:
        - { Key: Name, Value: !Sub 'comegin-${EnvName}-mautic-cron' }

  ChatwootWebSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: chatwoot-web tasks
      VpcId: !Ref Vpc
      SecurityGroupEgress:
        - { IpProtocol: tcp, FromPort: 0, ToPort: 65535, CidrIp: 0.0.0.0/0, Description: Outbound via NAT for ECR and Secrets Manager and SES and external APIs }
      Tags:
        - { Key: Name, Value: !Sub 'comegin-${EnvName}-chatwoot-web' }

  ChatwootWorkerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: chatwoot-worker (Sidekiq) tasks (no ingress)
      VpcId: !Ref Vpc
      SecurityGroupEgress:
        - { IpProtocol: tcp, FromPort: 0, ToPort: 65535, CidrIp: 0.0.0.0/0, Description: Outbound via NAT for ECR and Secrets Manager and SES and external APIs }
      Tags:
        - { Key: Name, Value: !Sub 'comegin-${EnvName}-chatwoot-worker' }

  UmamiSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: umami tasks
      VpcId: !Ref Vpc
      SecurityGroupEgress:
        - { IpProtocol: tcp, FromPort: 0, ToPort: 65535, CidrIp: 0.0.0.0/0, Description: Outbound via NAT for ECR and Secrets Manager and SES and external APIs }
      Tags:
        - { Key: Name, Value: !Sub 'comegin-${EnvName}-umami' }

  AdminAuthSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: admin-auth tasks
      VpcId: !Ref Vpc
      SecurityGroupEgress:
        - { IpProtocol: tcp, FromPort: 0, ToPort: 65535, CidrIp: 0.0.0.0/0, Description: Outbound via NAT for ECR and Secrets Manager and SES and external APIs }
      Tags:
        - { Key: Name, Value: !Sub 'comegin-${EnvName}-admin-auth' }

  CalcomSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: calcom tasks
      VpcId: !Ref Vpc
      SecurityGroupEgress:
        - { IpProtocol: tcp, FromPort: 0, ToPort: 65535, CidrIp: 0.0.0.0/0, Description: Outbound via NAT for ECR and Secrets Manager and SES and external APIs }
      Tags:
        - { Key: Name, Value: !Sub 'comegin-${EnvName}-calcom' }

  ConsentApiSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: consent-api tasks (reach Valkey only)
      VpcId: !Ref Vpc
      SecurityGroupEgress:
        - { IpProtocol: tcp, FromPort: 0, ToPort: 65535, CidrIp: 0.0.0.0/0, Description: Outbound via NAT for ECR and Secrets Manager and SES and external APIs }
      Tags:
        - { Key: Name, Value: !Sub 'comegin-${EnvName}-consent-api' }

  # オンプレとの WireGuard の終端（wireguard.yaml の EC2）。ADR-21。
  # ingress は、UDP（WireguardPort。送信元の IP が固定でないため WireguardIngressCidr は既定で 0.0.0.0/0。
  # cfn-guard の「0.0.0.0/0 への ingress」の指摘は意図した例外。鍵を知らない相手には WireGuard が応答しない）と、
  # 下の ingress（Mautic・Chatwoot のタスクから Webhook の 1 ポートだけ）。
  # egress は EC2 自身の運用（SSM・OS の更新・DNS・NTP）と、オンプレから RDS への転送（5432）だけ。
  # WireGuard の応答（オンプレからの UDP への返信）は、SG がステートフルなので egress の許可は要らない（NAT で送信元ポートが変わっても同じ）。
  # オンプレの PersistentKeepalive が通信を保つので、EC2 から先に送る必要は無い。
  WireguardSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: WireGuard EC2 (on-premises tunnel endpoint)
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - { IpProtocol: udp, FromPort: !Ref WireguardPort, ToPort: !Ref WireguardPort, CidrIp: !Ref WireguardIngressCidr, Description: WireGuard from on-premises }
      SecurityGroupEgress:
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0, Description: SSM and OS package repositories }
        - { IpProtocol: udp, FromPort: 53, ToPort: 53, CidrIp: !Ref VpcCidr, Description: DNS (VPC resolver) }
        - { IpProtocol: udp, FromPort: 123, ToPort: 123, CidrIp: 169.254.169.123/32, Description: Amazon Time Sync Service }
        - { IpProtocol: tcp, FromPort: 5432, ToPort: 5432, DestinationSecurityGroupId: !Ref PostgresSecurityGroup, Description: Forwarded from on-premises strapi and n8n to RDS }
      Tags:
        - { Key: Name, Value: !Sub 'comegin-${EnvName}-wireguard' }

  # DB 作成・マイグレーションなど、運用者が RunTask で 1 回だけ起動するタスク用（ops-tasks.yaml）。
  OpsTasksSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: one-off operator tasks started by RunTask (no ingress)
      VpcId: !Ref Vpc
      SecurityGroupEgress:
        - { IpProtocol: tcp, FromPort: 0, ToPort: 65535, CidrIp: 0.0.0.0/0, Description: Outbound via NAT for ECR and Secrets Manager and SES and external APIs }
      Tags:
        - { Key: Name, Value: !Sub 'comegin-${EnvName}-ops-tasks' }

  MysqlSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: RDS for MySQL (mautic)
      VpcId: !Ref Vpc
      SecurityGroupEgress:
        - { IpProtocol: tcp, FromPort: 1, ToPort: 1, CidrIp: 127.0.0.1/32, Description: No outbound traffic needed }
      Tags:
        - { Key: Name, Value: !Sub 'comegin-${EnvName}-mysql' }

  PostgresSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: RDS for PostgreSQL (chatwoot, umami, admin_auth, strapi, n8n, calcom)
      VpcId: !Ref Vpc
      SecurityGroupEgress:
        - { IpProtocol: tcp, FromPort: 1, ToPort: 1, CidrIp: 127.0.0.1/32, Description: No outbound traffic needed }
      Tags:
        - { Key: Name, Value: !Sub 'comegin-${EnvName}-postgres' }

  ValkeySecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ElastiCache (Valkey)
      VpcId: !Ref Vpc
      SecurityGroupEgress:
        - { IpProtocol: tcp, FromPort: 1, ToPort: 1, CidrIp: 127.0.0.1/32, Description: No outbound traffic needed }
      Tags:
        - { Key: Name, Value: !Sub 'comegin-${EnvName}-valkey' }

  EfsSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: EFS (mautic media and config)
      VpcId: !Ref Vpc
      SecurityGroupEgress:
        - { IpProtocol: tcp, FromPort: 1, ToPort: 1, CidrIp: 127.0.0.1/32, Description: No outbound traffic needed }
      Tags:
        - { Key: Name, Value: !Sub 'comegin-${EnvName}-efs' }

  # ---------------------------------------------------------------- ingress: ALB -> サービス
  MauticWebFromAlb:
    Type: AWS::EC2::SecurityGroupIngress
    Properties: { GroupId: !Ref MauticWebSecurityGroup, SourceSecurityGroupId: !Ref AlbSecurityGroup, IpProtocol: tcp, FromPort: !Ref MauticWebPort, ToPort: !Ref MauticWebPort, Description: From ALB }
  ChatwootWebFromAlb:
    Type: AWS::EC2::SecurityGroupIngress
    Properties: { GroupId: !Ref ChatwootWebSecurityGroup, SourceSecurityGroupId: !Ref AlbSecurityGroup, IpProtocol: tcp, FromPort: !Ref ChatwootWebPort, ToPort: !Ref ChatwootWebPort, Description: From ALB }
  UmamiFromAlb:
    Type: AWS::EC2::SecurityGroupIngress
    Properties: { GroupId: !Ref UmamiSecurityGroup, SourceSecurityGroupId: !Ref AlbSecurityGroup, IpProtocol: tcp, FromPort: !Ref UmamiPort, ToPort: !Ref UmamiPort, Description: From ALB }
  AdminAuthFromAlb:
    Type: AWS::EC2::SecurityGroupIngress
    Properties: { GroupId: !Ref AdminAuthSecurityGroup, SourceSecurityGroupId: !Ref AlbSecurityGroup, IpProtocol: tcp, FromPort: !Ref AdminAuthPort, ToPort: !Ref AdminAuthPort, Description: From ALB }
  CalcomFromAlb:
    Type: AWS::EC2::SecurityGroupIngress
    Properties: { GroupId: !Ref CalcomSecurityGroup, SourceSecurityGroupId: !Ref AlbSecurityGroup, IpProtocol: tcp, FromPort: !Ref CalcomPort, ToPort: !Ref CalcomPort, Description: From ALB }
  ConsentApiFromAlb:
    Type: AWS::EC2::SecurityGroupIngress
    Properties: { GroupId: !Ref ConsentApiSecurityGroup, SourceSecurityGroupId: !Ref AlbSecurityGroup, IpProtocol: tcp, FromPort: !Ref ConsentApiPort, ToPort: !Ref ConsentApiPort, Description: From ALB }

  # ---------------------------------------------------------------- ingress: WireGuard の EC2（ADR-21）
  # AWS → オンプレ: クラウドの Mautic・Chatwoot が、オンプレの n8n の Webhook の受け口（10.99.0.2:5680）へ送る。
  # 経路表の 10.99.0.0/24 → WireGuard の EC2 の ENI を通って、EC2 に届く。EC2 の中の nftables も 10.99.0.2:5680 以外の転送を落とす。
  WireguardFromMauticWeb:
    Type: AWS::EC2::SecurityGroupIngress
    Properties: { GroupId: !Ref WireguardSecurityGroup, SourceSecurityGroupId: !Ref MauticWebSecurityGroup, IpProtocol: tcp, FromPort: !Ref OnpremWebhookPort, ToPort: !Ref OnpremWebhookPort, Description: Webhook from mautic-web }
  WireguardFromMauticCron:
    Type: AWS::EC2::SecurityGroupIngress
    Properties: { GroupId: !Ref WireguardSecurityGroup, SourceSecurityGroupId: !Ref MauticCronSecurityGroup, IpProtocol: tcp, FromPort: !Ref OnpremWebhookPort, ToPort: !Ref OnpremWebhookPort, Description: Webhook from mautic-cron }
  WireguardFromChatwootWeb:
    Type: AWS::EC2::SecurityGroupIngress
    Properties: { GroupId: !Ref WireguardSecurityGroup, SourceSecurityGroupId: !Ref ChatwootWebSecurityGroup, IpProtocol: tcp, FromPort: !Ref OnpremWebhookPort, ToPort: !Ref OnpremWebhookPort, Description: Webhook from chatwoot-web }
  WireguardFromChatwootWorker:
    Type: AWS::EC2::SecurityGroupIngress
    Properties: { GroupId: !Ref WireguardSecurityGroup, SourceSecurityGroupId: !Ref ChatwootWorkerSecurityGroup, IpProtocol: tcp, FromPort: !Ref OnpremWebhookPort, ToPort: !Ref OnpremWebhookPort, Description: Webhook from chatwoot-worker }

  # ---------------------------------------------------------------- ingress: データストア
  # RDS・ElastiCache・EFS は、対応するタスクの SG からだけ受ける。
  MysqlFromMauticWeb:
    Type: AWS::EC2::SecurityGroupIngress
    Properties: { GroupId: !Ref MysqlSecurityGroup, SourceSecurityGroupId: !Ref MauticWebSecurityGroup, IpProtocol: tcp, FromPort: 3306, ToPort: 3306, Description: From mautic-web }
  MysqlFromMauticCron:
    Type: AWS::EC2::SecurityGroupIngress
    Properties: { GroupId: !Ref MysqlSecurityGroup, SourceSecurityGroupId: !Ref MauticCronSecurityGroup, IpProtocol: tcp, FromPort: 3306, ToPort: 3306, Description: From mautic-cron }
  MysqlFromOpsTasks:
    Type: AWS::EC2::SecurityGroupIngress
    Properties: { GroupId: !Ref MysqlSecurityGroup, SourceSecurityGroupId: !Ref OpsTasksSecurityGroup, IpProtocol: tcp, FromPort: 3306, ToPort: 3306, Description: From ops-tasks }

  PostgresFromChatwootWeb:
    Type: AWS::EC2::SecurityGroupIngress
    Properties: { GroupId: !Ref PostgresSecurityGroup, SourceSecurityGroupId: !Ref ChatwootWebSecurityGroup, IpProtocol: tcp, FromPort: 5432, ToPort: 5432, Description: From chatwoot-web }
  PostgresFromChatwootWorker:
    Type: AWS::EC2::SecurityGroupIngress
    Properties: { GroupId: !Ref PostgresSecurityGroup, SourceSecurityGroupId: !Ref ChatwootWorkerSecurityGroup, IpProtocol: tcp, FromPort: 5432, ToPort: 5432, Description: From chatwoot-worker }
  PostgresFromUmami:
    Type: AWS::EC2::SecurityGroupIngress
    Properties: { GroupId: !Ref PostgresSecurityGroup, SourceSecurityGroupId: !Ref UmamiSecurityGroup, IpProtocol: tcp, FromPort: 5432, ToPort: 5432, Description: From umami }
  PostgresFromAdminAuth:
    Type: AWS::EC2::SecurityGroupIngress
    Properties: { GroupId: !Ref PostgresSecurityGroup, SourceSecurityGroupId: !Ref AdminAuthSecurityGroup, IpProtocol: tcp, FromPort: 5432, ToPort: 5432, Description: From admin-auth }
  PostgresFromCalcom:
    Type: AWS::EC2::SecurityGroupIngress
    Properties: { GroupId: !Ref PostgresSecurityGroup, SourceSecurityGroupId: !Ref CalcomSecurityGroup, IpProtocol: tcp, FromPort: 5432, ToPort: 5432, Description: From calcom }
  # オンプレの Strapi・n8n（WireGuard 経由。EC2 で SNAT されて、送信元は WireGuard の EC2 になる）。
  # このルールで届くのは PostgreSQL の 5432 まで。どのデータベースに入れるかは DB ユーザーの権限（ops-tasks の REVOKE ALL FROM PUBLIC と、データベースごとのオーナー）で strapi・n8n だけに絞る。
  PostgresFromWireguard:
    Type: AWS::EC2::SecurityGroupIngress
    Properties: { GroupId: !Ref PostgresSecurityGroup, SourceSecurityGroupId: !Ref WireguardSecurityGroup, IpProtocol: tcp, FromPort: 5432, ToPort: 5432, Description: From WireGuard EC2 (on-premises strapi and n8n) }
  PostgresFromOpsTasks:
    Type: AWS::EC2::SecurityGroupIngress
    Properties: { GroupId: !Ref PostgresSecurityGroup, SourceSecurityGroupId: !Ref OpsTasksSecurityGroup, IpProtocol: tcp, FromPort: 5432, ToPort: 5432, Description: From ops-tasks }

  # Valkey: Chatwoot（必須）、Mautic（キャッシュ。任意）、consent-api（同意の記録。TA-06 の 4.8）。
  ValkeyFromChatwootWeb:
    Type: AWS::EC2::SecurityGroupIngress
    Properties: { GroupId: !Ref ValkeySecurityGroup, SourceSecurityGroupId: !Ref ChatwootWebSecurityGroup, IpProtocol: tcp, FromPort: 6379, ToPort: 6379, Description: From chatwoot-web }
  ValkeyFromChatwootWorker:
    Type: AWS::EC2::SecurityGroupIngress
    Properties: { GroupId: !Ref ValkeySecurityGroup, SourceSecurityGroupId: !Ref ChatwootWorkerSecurityGroup, IpProtocol: tcp, FromPort: 6379, ToPort: 6379, Description: From chatwoot-worker }
  ValkeyFromMauticWeb:
    Type: AWS::EC2::SecurityGroupIngress
