# 開発用: consent-api と Valkey。Valkey は 127.0.0.1:6380 にだけ開く（結合テストが Lambda の入口から直接つなぐため。外部には出さない）。
# 設定は同じディレクトリの環境変数ファイル（.env.example を写して作る）かシェルの環境変数から読む。
services:
  consent-api:
    build: .
    ports:
      - "127.0.0.1:3104:3104"
    environment:
      HOST: 0.0.0.0
      PORT: "3104"
      VALKEY_URL: redis://valkey:6379
      VALKEY_PASSWORD: ${VALKEY_PASSWORD:-}
      VALKEY_KEY_PREFIX: ${VALKEY_KEY_PREFIX:-consent:}
      SITE_URL: ${SITE_URL:?SITE_URL を設定してください（.env.example を参照）}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      CONSENT_POLICY_VERSION: ${CONSENT_POLICY_VERSION:?CONSENT_POLICY_VERSION を設定してください（.env.example を参照）}
    depends_on:
      valkey:
        condition: service_healthy
    restart: unless-stopped

  valkey:
    image: valkey/valkey:8-alpine
    # 結合テスト（pnpm test:integration）が Lambda の入口から直接つなぐ。127.0.0.1 だけ
    ports:
      - "127.0.0.1:6380:6379"
    environment:
      VALKEY_PASSWORD: ${VALKEY_PASSWORD:-}
    # 同意の記録は失うと取り戻せないため、AOF で永続化する。パスワードが空なら認証なし（開発のみ）
    command:
      - sh
      - -c
      - |
        if [ -n "$$VALKEY_PASSWORD" ]; then
          exec valkey-server --appendonly yes --requirepass "$$VALKEY_PASSWORD"
        else
          exec valkey-server --appendonly yes
        fi
    volumes:
      - valkey_data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - |
          if [ -n "$$VALKEY_PASSWORD" ]; then export REDISCLI_AUTH="$$VALKEY_PASSWORD"; fi
          valkey-cli ping | grep -q PONG
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  valkey_data:
