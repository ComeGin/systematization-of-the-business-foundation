id: weekly-content-draft
description: "承認済みの企画から記事の下書きを 1 本作る。本番の Strapi には下書きまで。公開は R2 が管理画面で行う"
enabled: true
cron: "30 2 * * 2"
kind: agent
agent: content-writer
builtin: null
after: []
prompt: |
  承認済み（plan_state が approved）で、まだ記事が結ばれていない企画のうち、最も古いもの 1 件だけから、記事の下書きを本番の Strapi に作る。

  取得の範囲（変えない）:
  - 触る記事は 1 回の実行で 1 つだけ。この実行で作った記事以外の記事を更新しない
  - publishedAt を設定しない（公開は R2 が本番の管理画面で行う）
  - 企画の assignee_role が R4 で、outline に R4 の素材が無いときは、書かずに止まる
  - 企画の更新は、作った記事を article の関連に結ぶことだけ
timeout_sec: 1200
max_turns: 60
# 監視アプリに出す説明（2026-11-06。docs/superpowers/specs/2026-11-06-job-agent-info-design.md の 4 節）
overview: |
  Agent content-writer を起動し、承認済み（plan_state: approved）で記事がまだ結ばれていない企画のうち最も古い 1 件から、記事の初稿を書いて本番の Strapi に下書き（E-04）として作り、企画に結ぶ。1 回の実行で 1 記事だけ。公開は R2 が管理画面で行う。
stage: create
io:
  reads:
    - "本番の Strapi の E-03（approved の企画）・E-01・既存の E-04"
  writes:
    - "本番の Strapi の E-04 の下書き 1 件"
    - "E-03 の article の関連"
  does_not_write:
    - "記事の公開（publishedAt）・非公開化・削除（R2 が行う）"
    - "この実行で作った記事以外の記事"
