AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  ローカル（オンプレ）側の主体に付ける管理ポリシー 2 本と、オンプレの Strapi・n8n 用の IAM ユーザー 2 つ。
  アクセスキーはここでは作らない（キーを CloudFormation の出力や状態に残さないため。発行は運用者が人の操作で行い、
  オンプレの秘匿ファイルにだけ置く。README の 4.5）。管理ポリシー 2 本の付与先の IAM ユーザーも、人が作る。
  1) 監視アプリ用: E-15 の写しへの追記と、ハートビートの送信だけ（TA-04 の 1 節、TA-06 の 4.7・7 節）。
  2) デプロイ用: Astro の配信（s3 sync と無効化）だけ（TA-02 の 6 節）。
  3) IAM ユーザー comegin-<env>-onprem-strapi-media: Strapi のメディアのバケットだけ（ADR-21）。
  4) IAM ユーザー comegin-<env>-onprem-n8n-sns: ops・lead の 2 トピックへの sns:Publish だけ（ADR-21）。

Parameters:
  EnvName:
    Type: String
    Default: prod
  RunLogBucketArn:
    Type: String
    Description: E-15 の写しのバケットの ARN（runlog-archive.yaml の RunLogBucketArn）
  RunLogKeyPrefix:
    Type: String
    Default: runs/
    Description: 写しのキーの接頭辞。runlog-archive.yaml の値と一致させる。
  HeartbeatNamespace:
    Type: String
    Default: ComeGin/Onprem
    Description: PutMetricData を許す名前空間。observability.yaml の値と一致させる。
  AstroBucketArn:
    Type: String
    Description: Astro の配信用バケットの ARN（data.yaml）
  DistributionArn:
    Type: String
    Description: Astro の CloudFront ディストリビューションの ARN（cdn.yaml）
  StrapiMediaBucketArn:
    Type: String
    Description: Strapi のメディアのバケットの ARN（data.yaml の StrapiMediaBucketArn）
  OpsAlertTopicArn:
    Type: String
    Description: ops トピックの ARN（observability.yaml）
  LeadAlertTopicArn:
    Type: String
    Description: lead トピックの ARN（observability.yaml）

Resources:
  # 監視アプリのサーバー側だけが使う。Claude Code の実行環境に渡さない（TA-04 の 1 節）。
  # 与えるのは「写しへの追記」と「生存信号を送る」だけ。
  # 与えない: s3:DeleteObject / s3:DeleteObjectVersion / バケットの設定変更 / 読み取り、
  #   cloudwatch:PutMetricAlarm / DisableAlarmActions / DeleteAlarms（アラームを止められない）、sns:*。
  ControlPlanePolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub 'comegin-${EnvName}-control-plane'
      Description: 監視アプリ用。E-15 の写しへの追記と、ハートビートの送信だけ。
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AppendRunLogArchive
            Effect: Allow
            Action: s3:PutObject
            Resource: !Sub '${RunLogBucketArn}/${RunLogKeyPrefix}*'
          # PutMetricData はリソースを絞れないため、条件キーで名前空間を限定する。
          # cfn-guard の IAM_POLICYDOCUMENT_NO_WILDCARD_RESOURCE は、この 1 件だけ意図した例外
          # （このアクションはリソースレベルの権限に対応しない）。
          - Sid: SendHeartbeatOnly
            Effect: Allow
            Action: cloudwatch:PutMetricData
            Resource: '*'
            Condition:
              StringEquals:
                'cloudwatch:namespace': !Ref HeartbeatNamespace

  # 配信を実行する人間が使う。Claude Code の実行環境に置かない（ADR-15）。
  # バケットポリシーの変更権限やディストリビューションの設定変更権限は渡さない。
  DeployPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub 'comegin-${EnvName}-deploy'
      Description: Astro の配信用。S3 への同期と CloudFront のキャッシュ無効化だけ。
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: SyncAstroBucketObjects
            Effect: Allow
            Action:
              - s3:PutObject
              - s3:DeleteObject
            Resource: !Sub '${AstroBucketArn}/*'
          - Sid: ListAstroBucket
            Effect: Allow
            Action: s3:ListBucket
            Resource: !Ref AstroBucketArn
          - Sid: InvalidateDistribution
            Effect: Allow
            Action: cloudfront:CreateInvalidation
            Resource: !Ref DistributionArn

  # オンプレの Strapi 専用。アップロードの Put、配信用の署名付き URL の Get、削除、一覧だけ。
  # バケットの設定・ポリシー・バージョン管理の操作は与えない。ほかのバケットにも届かない。
  # アクセスキーは作らない（人が発行して、オンプレの秘匿ファイルにだけ置く。Claude Code の環境には渡さない）。
  OnpremStrapiMediaUser:
    Type: AWS::IAM::User
    Properties:
      UserName: !Sub 'comegin-${EnvName}-onprem-strapi-media'

  OnpremStrapiMediaPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub 'comegin-${EnvName}-onprem-strapi-media'
      Description: オンプレの Strapi 用。メディアのバケットへの Put・Get・Delete・List だけ。
      Users:
        - !Ref OnpremStrapiMediaUser
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: MediaBucketObjects
            Effect: Allow
            Action:
              - s3:GetObject
              - s3:PutObject
              - s3:DeleteObject
            Resource: !Sub '${StrapiMediaBucketArn}/*'
          - Sid: MediaBucketList
            Effect: Allow
            Action: s3:ListBucket
            Resource: !Ref StrapiMediaBucketArn

  # オンプレの n8n 専用。通知（ops・lead）への発行だけ。購読の変更・トピックの設定変更は与えない（TA-04 の 1 節）。
  # n8n の AWS の資格情報には、このユーザーのアクセスキーを入れる（Assume Role と Use System Credentials は使わない）。
  OnpremN8nSnsUser:
    Type: AWS::IAM::User
    Properties:
      UserName: !Sub 'comegin-${EnvName}-onprem-n8n-sns'

  OnpremN8nSnsPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub 'comegin-${EnvName}-onprem-n8n-sns'
      Description: オンプレの n8n 用。ops・lead の 2 トピックへの sns:Publish だけ。
      Users:
        - !Ref OnpremN8nSnsUser
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: PublishAlerts
            Effect: Allow
            Action: sns:Publish
            Resource:
              - !Ref OpsAlertTopicArn
              - !Ref LeadAlertTopicArn

Outputs:
  ControlPlanePolicyArn:
    Value: !Ref ControlPlanePolicy
  DeployPolicyArn:
    Value: !Ref DeployPolicy
  OnpremStrapiMediaUserName:
    Value: !Ref OnpremStrapiMediaUser
  OnpremN8nSnsUserName:
    Value: !Ref OnpremN8nSnsUser
