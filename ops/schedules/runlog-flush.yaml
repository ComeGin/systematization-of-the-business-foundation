id: runlog-flush
description: "実行記録（E-15）の写しを S3 に追記する。送れていない分を送り直す（写しは正本ではない）"
enabled: true
cron: "*/15 0-7 * * *"
kind: builtin
agent: null
builtin: runlog-flush
after: []
timeout_sec: 300
# 監視アプリに出す説明（2026-11-06。docs/superpowers/specs/2026-11-06-job-agent-info-design.md の 4 節）
overview: |
  エージェントを使わない決まった処理。実行記録（E-15）のうち、まだ S3 に送れていないものを S3 に追記する。写しは正本ではない（正本は監視アプリの SQLite）。
stage: maintain
io:
  reads:
    - "実行記録（E-15）の未送の分"
  writes:
    - "S3 の実行記録の写し（runs/YYYY/MM/DD/<ULID>.json。既にあるものは上書きしない）"
    - "E-15 の送った時刻"
  does_not_write: []
