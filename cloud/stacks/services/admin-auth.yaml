AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  admin-auth: 管理画面の関門（Better Auth）。ALB の authenticate-oidc の IdP で、Google Workspace でログインさせる（ECS on Fargate）。TA-06 の 5.2.1。
  止まっても、ALB のセッションが残っている間は管理画面を使い続けられる（新しいログインだけができなくなる）。
  環境変数名は backend/admin-auth/.env.example が正本。ALB の登録（pnpm alb:register）は 1 回だけの RunTask で行う（README の手順）。
  RDS の CA はイメージが NODE_EXTRA_CA_CERTS で持つ（証明書の検証つきで TLS 接続する）。

Parameters:
  EnvName:
    Type: String
    Default: prod
  ClusterArn:
    Type: String
    Description: cluster.yaml の ClusterArn
  PrivateSubnetIds:
    Type: CommaDelimitedList
    Description: private サブネットの ID（network.yaml の PrivateSubnetIds）
  SecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: network.yaml の AdminAuthSecurityGroupId
  LogGroupName:
    Type: String
    Description: cluster.yaml の AdminAuthLogGroupName
  SecretNamePrefix:
    Type: String
    Description: secrets.yaml の SecretNamePrefix
  ImageRepositoryUri:
    Type: String
    Description: ecr.yaml の AdminAuthRepositoryUri
  ImageTag:
    Type: String
    AllowedPattern: '^(?!latest$).+$'
    ConstraintDescription: latest は使えない。バージョンのタグで固定する（TA-06 の 3.2）。
    Default: REPLACE-WITH-FIXED-TAG
    Description: admin-auth のイメージのタグ（backend/admin-auth からビルドしたもの）。
  DesiredCount:
    Type: Number
    Default: 0
    MinValue: 0
    Description: 初期値は 0（README の順に上げる）。
  Cpu:
    Type: String
    Default: '256'
    AllowedValues: ['256', '512', '1024', '2048', '4096']
    Description: 暫定値（TA-06 の 9 節の見積もり前）
  Memory:
    Type: String
    Default: '512'
    Description: 暫定値。Fargate の CPU との組み合わせに合う値にする。
  EnableExecuteCommand:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: ECS Exec（運用者が DB やコンテナに入るための手段。踏み台は置かない。TA-06 の 5.6）
  ContainerPort:
    Type: Number
    Default: 3103
    Description: コンテナの待ち受けポート。network.yaml と edge.yaml の値と同じにする（親が同じ値を渡す）。
  TargetGroupArn:
    Type: String
    Description: edge.yaml の AdminAuthTargetGroupArn
  HealthCheckGracePeriodSeconds:
    Type: Number
    Default: 60
    Description: 起動直後のヘルスチェックの猶予（秒）
  PostgresEndpoint:
    Type: String
    Description: data.yaml の PostgresEndpoint
  AuthHost:
    Type: String
    Description: admin-auth の公開ホスト名（BETTER_AUTH_URL = OIDC の issuer の基）
  DomainName:
    Type: String
    Default: comegin.com
    Description: Google の hd クレームと照合する Workspace のドメイン（GOOGLE_HOSTED_DOMAIN）
  GoogleClientId:
    Type: String
    Default: ''
    Description: Google の OAuth クライアント ID（Workspace の「内部」）。本番（NODE_ENV=production）では必須。人間が Google Cloud で発行して入れる。
  AdminBootstrapEmails:
    Type: String
    Default: ''
    Description: 管理者の許可リストの初期値（カンマ区切り。起動時に表へ追加するだけ）。以後の追加と削除は README の SQL で行う。
  AlbClientId:
    Type: String
    Default: alb
    Description: ALB の OIDC のクライアント ID（edge.yaml の AlbOidcClientId と同じ値）
  AlbProtectedHosts:
    Type: String
    Description: edge.yaml の AlbProtectedHosts（/oauth2/idpresponse を登録するホスト。カンマ区切り）

Resources:
  # 実行ロール（ECS のエージェントが使う）。イメージの取得、ログの書き込み、このサービスの Secret の読み取りだけ。
  # RDS のマスターの資格情報は読めない（ops-tasks.yaml の実行ロールだけが読める）。
  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'comegin-${EnvName}-admin-auth-execution'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                'aws:SourceAccount': !Ref AWS::AccountId

  ExecutionPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub 'comegin-${EnvName}-admin-auth-execution'
      Roles:
        - !Ref ExecutionRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          # cfn-guard の Resource '*' の指摘は意図した例外（リソースレベルの権限に対応しないアクション）:
          #   ecr:GetAuthorizationToken、タスクロールの ssmmessages（ECS Exec）。
          - Sid: EcrAuthorization
            Effect: Allow
            Action: ecr:GetAuthorizationToken
            Resource: '*'
          - Sid: EcrPull
            Effect: Allow
            Action:
              - ecr:BatchCheckLayerAvailability
              - ecr:GetDownloadUrlForLayer
              - ecr:BatchGetImage
            Resource:
              - !Sub
                - 'arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/${RepositoryName}'
                - RepositoryName: !Select [1, !Split ['.amazonaws.com/', !Ref ImageRepositoryUri]]
          - Sid: WriteLogs
            Effect: Allow
            Action:
              - logs:CreateLogStream
              - logs:PutLogEvents
            Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:${LogGroupName}:*'
          - Sid: ReadOwnSecrets
            Effect: Allow
            Action: secretsmanager:GetSecretValue
            Resource:
              - !Sub 'arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${SecretNamePrefix}/admin-auth/*'

  # タスクロール（アプリのコードが使う）。アクセスキーは発行しない。
  # Secrets Manager の読み取りは付けない（エージェントとワークフローに渡さない。TA-04 の 1 節）。
  # ECS Exec の ssmmessages はリソースを絞れない（公式の要件）。
  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'comegin-${EnvName}-admin-auth-task'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                'aws:SourceAccount': !Ref AWS::AccountId

  TaskPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub 'comegin-${EnvName}-admin-auth-task'
      Roles:
        - !Ref TaskRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: EcsExec
            Effect: Allow
            Action:
              - ssmmessages:CreateControlChannel
              - ssmmessages:CreateDataChannel
              - ssmmessages:OpenControlChannel
              - ssmmessages:OpenDataChannel
            Resource: '*'

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub 'comegin-${EnvName}-admin-auth'
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: !Ref Cpu
      Memory: !Ref Memory
      RuntimePlatform: { CpuArchitecture: X86_64, OperatingSystemFamily: LINUX }
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: admin-auth
          Image: !Sub '${ImageRepositoryUri}:${ImageTag}'
          Essential: true
          PortMappings:
            - { Name: http, ContainerPort: !Ref ContainerPort, Protocol: tcp, AppProtocol: http }
          Environment:
            - { Name: NODE_ENV, Value: production }
            - { Name: HOST, Value: 0.0.0.0 }
            - { Name: PORT, Value: !Ref ContainerPort }
            - { Name: BETTER_AUTH_URL, Value: !Sub 'https://${AuthHost}' }
            - { Name: DATABASE_HOST, Value: !Ref PostgresEndpoint }
            - { Name: DATABASE_PORT, Value: '5432' }
            - { Name: DATABASE_NAME, Value: admin_auth }
            - { Name: DATABASE_USERNAME, Value: admin_auth }
            - { Name: DATABASE_SSL, Value: 'true' }
            - { Name: GOOGLE_CLIENT_ID, Value: !Ref GoogleClientId }
            - { Name: GOOGLE_HOSTED_DOMAIN, Value: !Ref DomainName }
            - { Name: ADMIN_BOOTSTRAP_EMAILS, Value: !Ref AdminBootstrapEmails }
            - { Name: ALB_CLIENT_ID, Value: !Ref AlbClientId }
            - { Name: ALB_PROTECTED_HOSTS, Value: !Ref AlbProtectedHosts }
          Secrets:
            - { Name: BETTER_AUTH_SECRET, ValueFrom: !Sub '${SecretNamePrefix}/admin-auth/BETTER_AUTH_SECRET' }
            - { Name: DATABASE_PASSWORD, ValueFrom: !Sub '${SecretNamePrefix}/admin-auth/DB_PASSWORD' }
            - { Name: GOOGLE_CLIENT_SECRET, ValueFrom: !Sub '${SecretNamePrefix}/admin-auth/GOOGLE_CLIENT_SECRET' }
            - { Name: ALB_CLIENT_SECRET, ValueFrom: !Sub '${SecretNamePrefix}/admin-auth/ALB_CLIENT_SECRET' }
          LinuxParameters:
            InitProcessEnabled: true
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroupName
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: admin-auth

  Service:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: !Sub 'comegin-${EnvName}-admin-auth'
      Cluster: !Ref ClusterArn
      LaunchType: FARGATE
      DesiredCount: !Ref DesiredCount
      TaskDefinition: !Ref TaskDefinition
      EnableExecuteCommand: !Ref EnableExecuteCommand
      PropagateTags: SERVICE
      # デプロイのサーキットブレーカー: 新しいタスクが起動に失敗し続けたら、直前のリビジョンに戻す。
      DeploymentConfiguration:
        MaximumPercent: 200
        MinimumHealthyPercent: 100
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          SecurityGroups:
            - !Ref SecurityGroupId
          Subnets: !Ref PrivateSubnetIds
      HealthCheckGracePeriodSeconds: !Ref HealthCheckGracePeriodSeconds
      LoadBalancers:
        - ContainerName: admin-auth
          ContainerPort: !Ref ContainerPort
          TargetGroupArn: !Ref TargetGroupArn

Outputs:
  ServiceName:
    Value: !GetAtt Service.Name
  TaskRoleArn:
    Value: !GetAtt TaskRole.Arn
  TaskDefinitionArn:
    Value: !Ref TaskDefinition
