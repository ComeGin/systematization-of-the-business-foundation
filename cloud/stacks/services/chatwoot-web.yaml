AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  chatwoot-web: Rails（管理画面・API・ウィジェット・ActionCable）。TA-06 の 3.1。
  Rails の起動は DB のマイグレーションをしない。新しいイメージを出す前に、1 回だけの RunTask で
  bundle exec rails db:chatwoot_prepare を実行する（README の手順。TA-06 の 3.3）。タスクの起動処理には入れない。

Parameters:
  EnvName:
    Type: String
    Default: prod
  ClusterArn:
    Type: String
    Description: cluster.yaml の ClusterArn
  PrivateSubnetIds:
    Type: CommaDelimitedList
    Description: private サブネットの ID（network.yaml の PrivateSubnetIds）
  SecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: network.yaml の ChatwootWebSecurityGroupId
  LogGroupName:
    Type: String
    Description: cluster.yaml の ChatwootWebLogGroupName
  SecretNamePrefix:
    Type: String
    Description: secrets.yaml の SecretNamePrefix
  ImageRepositoryUri:
    Type: String
    Description: ecr.yaml の ChatwootRepositoryUri
  ImageTag:
    Type: String
    AllowedPattern: '^(?!latest$).+$'
    ConstraintDescription: latest は使えない。バージョンのタグで固定する（TA-06 の 3.2）。
    Default: v4.18.0-1
    Description: Chatwoot の ECR のタグ（chatwoot-worker と同じ値にする）。<上流のタグ>-<ビルドの連番>。上流は 4.12 以上に固定する（X-Chatwoot-Signature の署名つき Webhook は 4.12 以降。API チャネルとエージェントボットの署名は 4.13 以降）。
  DesiredCount:
    Type: Number
    Default: 0
    MinValue: 0
    Description: 初期値は 0（README の順に上げる）。
  Cpu:
    Type: String
    Default: '1024'
    AllowedValues: ['256', '512', '1024', '2048', '4096']
    Description: 暫定値（TA-06 の 9 節の見積もり前）
  Memory:
    Type: String
    Default: '2048'
    Description: 暫定値。Fargate の CPU との組み合わせに合う値にする。
  EnableExecuteCommand:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: ECS Exec（運用者が DB やコンテナに入るための手段。踏み台は置かない。TA-06 の 5.6）
  ContainerPort:
    Type: Number
    Default: 3000
    Description: コンテナの待ち受けポート。network.yaml と edge.yaml の値と同じにする（親が同じ値を渡す）。
  TargetGroupArn:
    Type: String
    Description: edge.yaml の ChatwootWebTargetGroupArn
  HealthCheckGracePeriodSeconds:
    Type: Number
    Default: 180
    Description: 起動直後のヘルスチェックの猶予（秒）
  PostgresEndpoint:
    Type: String
    Description: data.yaml の PostgresEndpoint
  ValkeyEndpoint:
    Type: String
    Description: data.yaml の ValkeyEndpoint
  ChatHost:
    Type: String
    Description: Chatwoot の公開ホスト名（FRONTEND_URL になる）
  DomainName:
    Type: String
    Default: comegin.com
    Description: 送信元ドメイン（SMTP_DOMAIN）。ses.yaml のドメイン ID と同じ。
  AttachmentBucketName:
    Type: String
    Description: data.yaml の ChatwootBucketName
  AttachmentBucketArn:
    Type: String
    Description: data.yaml の ChatwootBucketArn
  MailerSenderEmail:
    Type: String
    Default: Chatwoot <no-reply@comegin.com>
    Description: 送信元（MAILER_SENDER_EMAIL）。SES で検証済みのドメインのアドレスにする。

Resources:
  # 実行ロール（ECS のエージェントが使う）。イメージの取得、ログの書き込み、このサービスの Secret の読み取りだけ。
  # RDS のマスターの資格情報は読めない（ops-tasks.yaml の実行ロールだけが読める）。
  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'comegin-${EnvName}-chatwoot-web-execution'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                'aws:SourceAccount': !Ref AWS::AccountId

  ExecutionPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub 'comegin-${EnvName}-chatwoot-web-execution'
      Roles:
        - !Ref ExecutionRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          # cfn-guard の Resource '*' の指摘は意図した例外（リソースレベルの権限に対応しないアクション）:
          #   ecr:GetAuthorizationToken、タスクロールの ssmmessages（ECS Exec）。
          - Sid: EcrAuthorization
            Effect: Allow
            Action: ecr:GetAuthorizationToken
            Resource: '*'
          - Sid: EcrPull
            Effect: Allow
            Action:
              - ecr:BatchCheckLayerAvailability
              - ecr:GetDownloadUrlForLayer
              - ecr:BatchGetImage
            Resource:
              - !Sub
                - 'arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/${RepositoryName}'
                - RepositoryName: !Select [1, !Split ['.amazonaws.com/', !Ref ImageRepositoryUri]]
          - Sid: WriteLogs
            Effect: Allow
            Action:
              - logs:CreateLogStream
              - logs:PutLogEvents
            Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:${LogGroupName}:*'
          - Sid: ReadOwnSecrets
            Effect: Allow
            Action: secretsmanager:GetSecretValue
            Resource:
              - !Sub 'arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${SecretNamePrefix}/chatwoot/*'
              - !Sub 'arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${SecretNamePrefix}/shared/VALKEY_AUTH_TOKEN-*'

  # タスクロール（アプリのコードが使う）。アクセスキーは発行しない。
  # Secrets Manager の読み取りは付けない（エージェントとワークフローに渡さない。TA-04 の 1 節）。
  # ECS Exec の ssmmessages はリソースを絞れない（公式の要件）。
  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'comegin-${EnvName}-chatwoot-web-task'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                'aws:SourceAccount': !Ref AWS::AccountId

  TaskPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub 'comegin-${EnvName}-chatwoot-web-task'
      Roles:
        - !Ref TaskRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: EcsExec
            Effect: Allow
            Action:
              - ssmmessages:CreateControlChannel
              - ssmmessages:CreateDataChannel
              - ssmmessages:OpenControlChannel
              - ssmmessages:OpenDataChannel
            Resource: '*'
          - Sid: AttachmentBucketObjects
            Effect: Allow
            Action:
              - s3:GetObject
              - s3:PutObject
              - s3:DeleteObject
            Resource: !Sub '${AttachmentBucketArn}/*'
          - Sid: AttachmentBucketList
            Effect: Allow
            Action: s3:ListBucket
            Resource: !Ref AttachmentBucketArn

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub 'comegin-${EnvName}-chatwoot-web'
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: !Ref Cpu
      Memory: !Ref Memory
      RuntimePlatform: { CpuArchitecture: X86_64, OperatingSystemFamily: LINUX }
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: chatwoot
          Image: !Sub '${ImageRepositoryUri}:${ImageTag}'
          Essential: true
          EntryPoint: [docker/entrypoints/rails.sh]
          Command: [bundle, exec, rails, s, -p, '3000', -b, 0.0.0.0]
          PortMappings:
            - { Name: http, ContainerPort: !Ref ContainerPort, Protocol: tcp, AppProtocol: http }
          Environment:
            - { Name: RAILS_ENV, Value: production }
            - { Name: NODE_ENV, Value: production }
            - { Name: INSTALLATION_ENV, Value: docker }
            - { Name: FRONTEND_URL, Value: !Sub 'https://${ChatHost}' }
            - { Name: FORCE_SSL, Value: 'true' }
            - { Name: ENABLE_ACCOUNT_SIGNUP, Value: 'false' }
            - { Name: DEFAULT_LOCALE, Value: ja }
            - { Name: RAILS_LOG_TO_STDOUT, Value: 'true' }
            - { Name: LOG_LEVEL, Value: info }
            - { Name: RAILS_MAX_THREADS, Value: '5' }
            - { Name: VIPS_BLOCK_UNTRUSTED, Value: '1' }
            # Webhook の宛先（オンプレの n8n。10.99.0.2:5680。WireGuard 経由）は私設アドレスなので、許可が無いと SafeFetch が送らない
            # （Sidekiq のログに "has no public ip addresses" が出るだけで再送もしない）。宛先ごとの許可が無い切り替えなので、
            # 届く先は SG の出口で絞る（network.yaml の ChatwootWebSecurityGroup・ChatwootWorkerSecurityGroup）
            - { Name: SAFE_FETCH_ALLOW_PRIVATE_NETWORK, Value: 'true' }
            - { Name: REDIS_URL, Value: !Sub 'rediss://${ValkeyEndpoint}:6379' }
            - { Name: POSTGRES_HOST, Value: !Ref PostgresEndpoint }
            - { Name: POSTGRES_PORT, Value: '5432' }
            - { Name: POSTGRES_DATABASE, Value: chatwoot }
            - { Name: POSTGRES_USERNAME, Value: chatwoot }
            - { Name: PGSSLMODE, Value: verify-full }
            - { Name: PGSSLROOTCERT, Value: /etc/rds/global-bundle.pem }
            - { Name: ACTIVE_STORAGE_SERVICE, Value: amazon }
            - { Name: S3_BUCKET_NAME, Value: !Ref AttachmentBucketName }
            - { Name: AWS_REGION, Value: !Ref AWS::Region }
            - { Name: MAILER_SENDER_EMAIL, Value: !Ref MailerSenderEmail }
            - { Name: SMTP_DOMAIN, Value: !Ref DomainName }
            - { Name: SMTP_ADDRESS, Value: !Sub 'email-smtp.${AWS::Region}.amazonaws.com' }
            - { Name: SMTP_PORT, Value: '587' }
            - { Name: SMTP_AUTHENTICATION, Value: login }
            - { Name: SMTP_ENABLE_STARTTLS_AUTO, Value: 'true' }
            - { Name: SMTP_OPENSSL_VERIFY_MODE, Value: peer }
          Secrets:
            - { Name: SECRET_KEY_BASE, ValueFrom: !Sub 'arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${SecretNamePrefix}/chatwoot/SECRET_KEY_BASE' }
            - { Name: ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY, ValueFrom: !Sub 'arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${SecretNamePrefix}/chatwoot/ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY' }
            - { Name: ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY, ValueFrom: !Sub 'arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${SecretNamePrefix}/chatwoot/ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY' }
            - { Name: ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT, ValueFrom: !Sub 'arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${SecretNamePrefix}/chatwoot/ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT' }
            - { Name: POSTGRES_PASSWORD, ValueFrom: !Sub 'arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${SecretNamePrefix}/chatwoot/DB_PASSWORD' }
            - { Name: SMTP_USERNAME, ValueFrom: !Sub 'arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${SecretNamePrefix}/chatwoot/SMTP_USERNAME' }
            - { Name: SMTP_PASSWORD, ValueFrom: !Sub 'arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${SecretNamePrefix}/chatwoot/SMTP_PASSWORD' }
            - { Name: REDIS_PASSWORD, ValueFrom: !Sub 'arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${SecretNamePrefix}/shared/VALKEY_AUTH_TOKEN' }
          LinuxParameters:
            InitProcessEnabled: true
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroupName
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: chatwoot-web

  Service:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: !Sub 'comegin-${EnvName}-chatwoot-web'
      Cluster: !Ref ClusterArn
      LaunchType: FARGATE
      DesiredCount: !Ref DesiredCount
      TaskDefinition: !Ref TaskDefinition
      EnableExecuteCommand: !Ref EnableExecuteCommand
      PropagateTags: SERVICE
      # デプロイのサーキットブレーカー: 新しいタスクが起動に失敗し続けたら、直前のリビジョンに戻す。
      DeploymentConfiguration:
        MaximumPercent: 200
        MinimumHealthyPercent: 100
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          SecurityGroups:
            - !Ref SecurityGroupId
          Subnets: !Ref PrivateSubnetIds
      HealthCheckGracePeriodSeconds: !Ref HealthCheckGracePeriodSeconds
      LoadBalancers:
        - ContainerName: chatwoot
          ContainerPort: !Ref ContainerPort
          TargetGroupArn: !Ref TargetGroupArn

Outputs:
  ServiceName:
    Value: !GetAtt Service.Name
  TaskRoleArn:
    Value: !GetAtt TaskRole.Arn
  TaskDefinitionArn:
    Value: !Ref TaskDefinition
