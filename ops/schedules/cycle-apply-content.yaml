id: cycle-apply-content
description: "承認済みの content_rewrite の E-13 から、記事の下書きを 1 本作る・書き直す。本番の Strapi には下書きまで。公開は R2 が管理画面で行う（改善ループの作用のジョブ）"
enabled: false
# 毎日 06:30。起動 + 1200 秒 = 06:50 で、8 時より前。daily-n8n-export（06:15〜06:25）の後・cycle-collect（07:00）の前なので、同じ日の cycle-collect が成果物を拾える。
# weekly-content-draft（火・金曜 02:30）とは時刻が重ならない（どちらも content-writer だが、起動の経路が違う。こちらは E-13 の経路）
cron: "30 6 * * *"
kind: agent
agent: content-writer
builtin: null
after: []
prompt: |
  承認済み（approval.state が approved）の content_rewrite の E-13 のうち、まだ実行していないもの 1 件（監視アプリが PRP: の行で渡す）だけから、記事の下書きを本番の Strapi に作る。E-13 の change.description を仕様とする。

  取得の範囲（変えない）:
  - 触る記事は 1 回の実行で 1 つだけ。この実行で作った記事以外の記事を更新しない
  - publishedAt を設定しない（公開は R2 が本番の管理画面で行う）
  - 記事のアイキャッチ画像（cover）は設定しない（builtin article-cover が作る）
  - PRP: の行が無いときは、何も書かずに止まる
timeout_sec: 1200
max_turns: 60
proposal_kinds:
  - content_rewrite
overview: |
  Agent content-writer を起動し、承認済みの content_rewrite の E-13（1 回の実行で 1 件。監視アプリが PRP: の行で渡す）を仕様として、記事の下書きを本番の Strapi に作る（E-04）。公開は R2 が管理画面で行う。起動すると、周の項目（記事）が準備中で作られ、cycle-collect が中身を埋めて OK 待ちにする。承認済みの E-13 が無ければ見送る。
stage: create
io:
  reads:
    - "承認済みの E-13（docs/proposals/PRP-*.md。content_rewrite）と、その根拠の E-12"
    - "本番の Strapi の E-04・E-01・E-03"
  writes:
    - "本番の Strapi の E-04 の下書き 1 件"
    - "E-15 の周の項目（記事。準備中）"
  does_not_write:
    - "記事の公開（publishedAt）・非公開化・削除（R2 が行う）"
    - "この実行で作った記事以外の記事"
    - "アイキャッチ画像（article-cover が作る）"
