AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  顧客向けメール（Amazon SES）の送信ドメイン。TA-06 の 6 節。Mautic と Chatwoot が SES の SMTP から送る。
  作るもの: ドメイン ID と Easy DKIM、DKIM の CNAME、MAIL FROM サブドメイン（SPF と MX）、既定の設定セット。
  作らないもの: apex（comegin.com）の SPF と DMARC。comegin.com は Google Workspace のメールも使っており、
  apex には既に MX と SPF の TXT があると思われる（AWS の API を呼べず未確認）。SPF の TXT は 1 つしか持てないため、
  Workspace の設定と統合する作業は人間が行う（cloud/README.md の TODO）。
  SES の本番アクセス（サンドボックスの解除）の申請と SMTP 認証情報の発行は CloudFormation ではできない（README の手順）。
  バウンスと苦情を Mautic に返す経路も未決定（TA-06 の 11 節）。SES のイベントを社内の通知（ops トピック）に流すと
  宛先のメールアドレスが載ってしまうため、ここでは設定しない。

Parameters:
  EnvName:
    Type: String
    Default: prod
  DomainName:
    Type: String
    Default: comegin.com
    Description: 送信元ドメイン（SES のドメイン ID）
  HostedZoneId:
    Type: String
    Description: DomainName の Route 53 ホストゾーン。DKIM と MAIL FROM のレコードを作る。
  MailFromSubdomain:
    Type: String
    Default: bounce
    Description: MAIL FROM のサブドメイン（<これ>.<DomainName>）。バウンスの受け口の MX と SPF をここに置く。

Resources:
  # 設定セット。評判のメトリクス（バウンス率・苦情率）を CloudWatch に出し、TLS を必須にする。
  # アラームはアカウント単位の Reputation.BounceRate / ComplaintRate を見る（alarms.yaml）。
  ConfigurationSet:
    Type: AWS::SES::ConfigurationSet
    Properties:
      Name: !Sub 'comegin-${EnvName}'
      ReputationOptions:
        ReputationMetricsEnabled: true
      SendingOptions:
        SendingEnabled: true
      DeliveryOptions:
        TlsPolicy: REQUIRE

  EmailIdentity:
    Type: AWS::SES::EmailIdentity
    Properties:
      EmailIdentity: !Ref DomainName
      ConfigurationSetAttributes:
        ConfigurationSetName: !Ref ConfigurationSet
      DkimAttributes:
        SigningEnabled: true
      MailFromAttributes:
        MailFromDomain: !Sub '${MailFromSubdomain}.${DomainName}'
        BehaviorOnMxFailure: USE_DEFAULT_VALUE

  # Easy DKIM の CNAME（3 つ）。
  DkimRecord1:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !GetAtt EmailIdentity.DkimDNSTokenName1
      Type: CNAME
      TTL: '1800'
      ResourceRecords:
        - !GetAtt EmailIdentity.DkimDNSTokenValue1

  DkimRecord2:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !GetAtt EmailIdentity.DkimDNSTokenName2
      Type: CNAME
      TTL: '1800'
      ResourceRecords:
        - !GetAtt EmailIdentity.DkimDNSTokenValue2

  DkimRecord3:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !GetAtt EmailIdentity.DkimDNSTokenName3
      Type: CNAME
      TTL: '1800'
      ResourceRecords:
        - !GetAtt EmailIdentity.DkimDNSTokenValue3

  # MAIL FROM サブドメインの MX と SPF。apex の SPF とは別のレコードなので、Workspace の設定と衝突しない。
  # バウンスを受ける MX は SES のリージョンのエンドポイントを指す。
  MailFromMxRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Sub '${MailFromSubdomain}.${DomainName}'
      Type: MX
      TTL: '300'
      ResourceRecords:
        - !Sub '10 feedback-smtp.${AWS::Region}.amazonses.com'

  MailFromSpfRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Sub '${MailFromSubdomain}.${DomainName}'
      Type: TXT
      TTL: '300'
      ResourceRecords:
        - '"v=spf1 include:amazonses.com ~all"'

Outputs:
  EmailIdentityArn:
    Value: !Sub 'arn:${AWS::Partition}:ses:${AWS::Region}:${AWS::AccountId}:identity/${DomainName}'
  ConfigurationSetName:
    Value: !Ref ConfigurationSet
  MailFromDomain:
    Value: !Sub '${MailFromSubdomain}.${DomainName}'
