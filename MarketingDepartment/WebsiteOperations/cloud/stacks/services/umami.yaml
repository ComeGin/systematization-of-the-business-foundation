AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  umami: トラッカー配信・イベント受信・管理画面・API・/mcp（ECS on Fargate）。TA-06 の 3.1。
  Umami の DATABASE_URL はパスワードを含む 1 本の URL のため、DB パスワードの Secret から組み立てた Secret
  （<prefix>/umami/DATABASE_URL）をこのスタックで作る（DB パスワードは英数字のみなので URL に入れて壊れない）。
  DB パスワードを変えたときは、このスタックを更新して URL の Secret を作り直す。
  TODO(未検証): Umami のイメージが起動時に DB を自動で移行するか（TA-06 の 3.3・11 節）。しない場合は 1 回だけの RunTask にする。

Parameters:
  EnvName:
    Type: String
    Default: prod
  ClusterArn:
    Type: String
    Description: cluster.yaml の ClusterArn
  PrivateSubnetIds:
    Type: CommaDelimitedList
    Description: private サブネットの ID（network.yaml の PrivateSubnetIds）
  SecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: network.yaml の UmamiSecurityGroupId
  LogGroupName:
    Type: String
    Description: cluster.yaml の UmamiLogGroupName
  SecretNamePrefix:
    Type: String
    Description: secrets.yaml の SecretNamePrefix
  ImageRepositoryUri:
    Type: String
    Description: ecr.yaml の UmamiRepositoryUri
  ImageTag:
    Type: String
    AllowedPattern: '^(?!latest$).+$'
    ConstraintDescription: latest は使えない。バージョンのタグで固定する（TA-06 の 3.2）。
    Default: 3.4.0-1
    Description: Umami の ECR のタグ。<上流のタグ>-<ビルドの連番>。上流は 3.4.0 以上に固定する（API キーと /mcp が要る。TA-06 の 3.2。ghcr.io のタグは v なしの 3.4.0）。
  DesiredCount:
    Type: Number
    Default: 0
    MinValue: 0
    Description: 初期値は 0（README の順に上げる）。
  Cpu:
    Type: String
    Default: '512'
    AllowedValues: ['256', '512', '1024', '2048', '4096']
    Description: 暫定値（TA-06 の 9 節の見積もり前）
  Memory:
    Type: String
    Default: '1024'
    Description: 暫定値。Fargate の CPU との組み合わせに合う値にする。
  EnableExecuteCommand:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: ECS Exec（運用者が DB やコンテナに入るための手段。踏み台は置かない。TA-06 の 5.6）
  ContainerPort:
    Type: Number
    Default: 3000
    Description: コンテナの待ち受けポート。network.yaml と edge.yaml の値と同じにする（親が同じ値を渡す）。
  TargetGroupArn:
    Type: String
    Description: edge.yaml の UmamiTargetGroupArn
  HealthCheckGracePeriodSeconds:
    Type: Number
    Default: 60
    Description: 起動直後のヘルスチェックの猶予（秒）
  PostgresEndpoint:
    Type: String
    Description: data.yaml の PostgresEndpoint

Resources:
  # DB の URL を組み立てた Secret。パスワードは動的参照で Secrets Manager から読む（テンプレートや状態に平文を持たない）。
  # TLS: sslmode=verify-full&sslaccept=strict で、サーバー証明書とホスト名を検証する。CA は派生イメージ（cloud/images/umami/Dockerfile）が信頼させる。
  #   実行時（@prisma/adapter-pg = Node の pg）は sslmode=verify-full と NODE_EXTRA_CA_CERTS。
  #   起動時の prisma migrate deploy（scripts/check-db.js。Rust のスキーマエンジン）は sslaccept=strict と SSL_CERT_FILE。
  #   重要: Rust のエンジンは sslmode が require でも verify-full でも証明書を検証しない（未知のモードは require 扱い）。検証するのは sslaccept=strict だけ。
  #   2026-10-04 にローカルの TLS つき PostgreSQL（自作の CA）で、Umami 3.4.0 のイメージの Node（pg 8.22）と Prisma のエンジンの両方が、
  #   CA が無いとき・ホスト名が違うときに失敗し、正しい CA のときに接続できることを確かめた。
  #   URL に sslcert は書かない（pg はクライアント証明書と読む）。
  DatabaseUrlSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub '${SecretNamePrefix}/umami/DATABASE_URL'
      Description: Umami DATABASE_URL built from the DB password secret.
      SecretString: !Sub 'postgresql://umami:{{resolve:secretsmanager:${SecretNamePrefix}/umami/DB_PASSWORD:SecretString}}@${PostgresEndpoint}:5432/umami?sslmode=verify-full&sslaccept=strict'

  # 実行ロール（ECS のエージェントが使う）。イメージの取得、ログの書き込み、このサービスの Secret の読み取りだけ。
  # RDS のマスターの資格情報は読めない（ops-tasks.yaml の実行ロールだけが読める）。
  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'comegin-${EnvName}-umami-execution'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                'aws:SourceAccount': !Ref AWS::AccountId

  ExecutionPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub 'comegin-${EnvName}-umami-execution'
      Roles:
        - !Ref ExecutionRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          # cfn-guard の Resource '*' の指摘は意図した例外（リソースレベルの権限に対応しないアクション）:
          #   ecr:GetAuthorizationToken、タスクロールの ssmmessages（ECS Exec）。
          - Sid: EcrAuthorization
            Effect: Allow
            Action: ecr:GetAuthorizationToken
            Resource: '*'
          - Sid: EcrPull
            Effect: Allow
            Action:
              - ecr:BatchCheckLayerAvailability
              - ecr:GetDownloadUrlForLayer
              - ecr:BatchGetImage
            Resource:
              - !Sub
                - 'arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/${RepositoryName}'
                - RepositoryName: !Select [1, !Split ['.amazonaws.com/', !Ref ImageRepositoryUri]]
          - Sid: WriteLogs
            Effect: Allow
            Action:
              - logs:CreateLogStream
              - logs:PutLogEvents
            Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:${LogGroupName}:*'
          - Sid: ReadOwnSecrets
            Effect: Allow
            Action: secretsmanager:GetSecretValue
            Resource:
              - !Sub 'arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${SecretNamePrefix}/umami/*'

  # タスクロール（アプリのコードが使う）。アクセスキーは発行しない。
  # Secrets Manager の読み取りは付けない（エージェントとワークフローに渡さない。TA-04 の 1 節）。
  # ECS Exec の ssmmessages はリソースを絞れない（公式の要件）。
  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'comegin-${EnvName}-umami-task'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                'aws:SourceAccount': !Ref AWS::AccountId

  TaskPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub 'comegin-${EnvName}-umami-task'
      Roles:
        - !Ref TaskRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: EcsExec
            Effect: Allow
            Action:
              - ssmmessages:CreateControlChannel
              - ssmmessages:CreateDataChannel
              - ssmmessages:OpenControlChannel
              - ssmmessages:OpenDataChannel
            Resource: '*'

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub 'comegin-${EnvName}-umami'
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: !Ref Cpu
      Memory: !Ref Memory
      RuntimePlatform: { CpuArchitecture: X86_64, OperatingSystemFamily: LINUX }
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: umami
          Image: !Sub '${ImageRepositoryUri}:${ImageTag}'
          Essential: true
          PortMappings:
            - { Name: http, ContainerPort: !Ref ContainerPort, Protocol: tcp, AppProtocol: http }
          Environment:
            - { Name: DISABLE_TELEMETRY, Value: '1' }
            - { Name: MCP_ENABLED, Value: '1' }
          Secrets:
            - { Name: DATABASE_URL, ValueFrom: !Sub '${SecretNamePrefix}/umami/DATABASE_URL' }
            - { Name: APP_SECRET, ValueFrom: !Sub '${SecretNamePrefix}/umami/APP_SECRET' }
          LinuxParameters:
            InitProcessEnabled: true
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroupName
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: umami

  Service:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: !Sub 'comegin-${EnvName}-umami'
      Cluster: !Ref ClusterArn
      LaunchType: FARGATE
      DesiredCount: !Ref DesiredCount
      TaskDefinition: !Ref TaskDefinition
      EnableExecuteCommand: !Ref EnableExecuteCommand
      PropagateTags: SERVICE
      # デプロイのサーキットブレーカー: 新しいタスクが起動に失敗し続けたら、直前のリビジョンに戻す。
      DeploymentConfiguration:
        MaximumPercent: 200
        MinimumHealthyPercent: 100
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          SecurityGroups:
            - !Ref SecurityGroupId
          Subnets: !Ref PrivateSubnetIds
      HealthCheckGracePeriodSeconds: !Ref HealthCheckGracePeriodSeconds
      LoadBalancers:
        - ContainerName: umami
          ContainerPort: !Ref ContainerPort
          TargetGroupArn: !Ref TargetGroupArn

Outputs:
  ServiceName:
    Value: !GetAtt Service.Name
  TaskRoleArn:
    Value: !GetAtt TaskRole.Arn
  TaskDefinitionArn:
    Value: !Ref TaskDefinition
