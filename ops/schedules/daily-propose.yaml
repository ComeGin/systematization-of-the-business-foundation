id: daily-propose
description: "観測 4 本の完了を待ち、起票前チェック 15 項目を通した改善提案だけを E-13（draft）として起票する"
enabled: false
cron: "0 7 * * *"
kind: agent
agent: proposal-writer
builtin: null
after:
  - daily-observe-seo
  - daily-observe-analytics
  - daily-observe-conversations
  - daily-observe-ops
prompt: |
  docs/audits/ の全 source の E-12 と、docs/proposals/ の全 E-13（却下されたものを含む）を読み、改善提案を起票するか判断する。

  - 起票前チェックの 15 項目をすべて、番号の順に検査する。1 つでも通らなければ起票しない
  - 止めた・起票しなかったときは、SUMMARY の行に、どの検査（番号）で止めたかと対象の ID を書く
  - 状態は draft のまま。approval・applied_at・verification は起票時の固定値のままにする
  - 1 回の実行で起票するのは、検査 5 の当日の上限を超えない範囲まで
timeout_sec: 900
max_turns: 40
