[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "comegin-livekit-agent"
version = "0.1.0"
description = "音声で SEO の BI を伝えるエージェント（LiveKit セルフホスト × OpenAI GPT-Live × OpenSEO MCP）"
requires-python = ">=3.10, <3.15"

dependencies = [
    # openai: GPT-Live（GPTLiveModel）とビジョン、mcp: MCPToolset、silero: 割り込み用の VAD
    "livekit-agents[openai,mcp,silero]~=1.8.8",
    "python-dotenv",
    "pydantic>=2",
]

[project.optional-dependencies]
# 話者分離（有償のライセンスが要る）。AUDIO_ENHANCEMENT で選んだときだけ入れる。
#   uv sync --extra ai-coustics   … AUDIO_ENHANCEMENT=ai_coustics
#   uv sync --extra krisp         … AUDIO_ENHANCEMENT=krisp
ai-coustics = ["livekit-plugins-ai-coustics~=0.3"]
krisp = ["livekit-plugins-krisp"]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[tool.uv]
# yarl 1.24.1 was published with only a cp310 wheel and no sdist, so it can't
# install on Python 3.11+. Remove this once upstream uploads the remaining wheels.
constraint-dependencies = ["yarl<1.24"]
# 公開から 7 日たっていない版は使わない（供給網の攻撃への備え。pnpm の minimumReleaseAge と同じ方針）。
# 相対の期間（"7 days"）は uv 0.8.19 では読めない（年の 4 桁として解釈して失敗する）ため、日付で書く。
# 依存を上げるときは、この日付を「その日の 7 日前」に進めてから uv lock する。
exclude-newer = "2026-11-14T00:00:00Z"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "A", "C4", "UP", "SIM", "RUF"]
ignore = [
    "E501",    # 行の長さは formatter に任せる
    "RUF001",  # 日本語の全角記号（「、」「：」など）を誤検知するため
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.isort]
known-first-party = ["comegin_voice"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
