AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  ECR リポジトリ。自作（admin-auth・consent-api）、Mautic・Chatwoot・Umami の派生イメージ用。Strapi と n8n はオンプレで動かす（ADR-21）、Cal.com は SaaS（ADR-24）なので、リポジトリを持たない。
  TA-06 の 3.2「イメージは ECR に置く」。タグは不変にし、プッシュ時にスキャンする。

Parameters:
  EnvName:
    Type: String
    Default: prod
    Description: 環境名。リポジトリ名は comegin/<EnvName>/<名前>。
  UntaggedImageExpireDays:
    Type: Number
    Default: 7
    MinValue: 1
    Description: タグの無いイメージを何日で期限切れにするか。タグ付きは消さない（タスク定義が参照するため）。

# リポジトリは作り直すと中のイメージが失われるため、すべて Retain にする。
# ライフサイクルポリシーは 6 本とも同じ内容（CloudFormation は YAML のアンカーを使えないため繰り返す）。
Resources:
  AdminAuthRepository:
    Type: AWS::ECR::Repository
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RepositoryName: !Sub 'comegin/${EnvName}/admin-auth'
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration: { ScanOnPush: true }
      EncryptionConfiguration: { EncryptionType: AES256 }
      LifecyclePolicy:
        LifecyclePolicyText: !Sub >-
          {"rules":[{"rulePriority":1,"description":"untagged images","selection":{"tagStatus":"untagged","countType":"sinceImagePushed","countUnit":"days","countNumber":${UntaggedImageExpireDays}},"action":{"type":"expire"}}]}

  ConsentApiRepository:
    Type: AWS::ECR::Repository
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RepositoryName: !Sub 'comegin/${EnvName}/consent-api'
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration: { ScanOnPush: true }
      EncryptionConfiguration: { EncryptionType: AES256 }
      LifecyclePolicy:
        LifecyclePolicyText: !Sub >-
          {"rules":[{"rulePriority":1,"description":"untagged images","selection":{"tagStatus":"untagged","countType":"sinceImagePushed","countUnit":"days","countNumber":${UntaggedImageExpireDays}},"action":{"type":"expire"}}]}

  # 公式イメージが Mautic 7.x を提供しているかは未確認（TA-06 の 3.2・11 節）。
  # 無ければ cloud/images/mautic/ の Dockerfile から自前でビルドして、ここに置く。
  MauticRepository:
    Type: AWS::ECR::Repository
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RepositoryName: !Sub 'comegin/${EnvName}/mautic'
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration: { ScanOnPush: true }
      EncryptionConfiguration: { EncryptionType: AES256 }
      LifecyclePolicy:
        LifecyclePolicyText: !Sub >-
          {"rules":[{"rulePriority":1,"description":"untagged images","selection":{"tagStatus":"untagged","countType":"sinceImagePushed","countUnit":"days","countNumber":${UntaggedImageExpireDays}},"action":{"type":"expire"}}]}

  # ここから下は上流イメージのミラー。Docker Hub などから直接取得すると、取得回数の制限と
  # 上流のタグの付け替えの影響を受けるため（TA-06 の 3.2）。README の手順で固定タグを pull → tag → push する。
  # TODO: ECR のプルスルーキャッシュで代用できるか（Docker Hub / GHCR は認証情報の Secret が要る）。
  ChatwootRepository:
    Type: AWS::ECR::Repository
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RepositoryName: !Sub 'comegin/${EnvName}/chatwoot'
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration: { ScanOnPush: true }
      EncryptionConfiguration: { EncryptionType: AES256 }
      LifecyclePolicy:
        LifecyclePolicyText: !Sub >-
          {"rules":[{"rulePriority":1,"description":"untagged images","selection":{"tagStatus":"untagged","countType":"sinceImagePushed","countUnit":"days","countNumber":${UntaggedImageExpireDays}},"action":{"type":"expire"}}]}

  UmamiRepository:
    Type: AWS::ECR::Repository
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RepositoryName: !Sub 'comegin/${EnvName}/umami'
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration: { ScanOnPush: true }
      EncryptionConfiguration: { EncryptionType: AES256 }
      LifecyclePolicy:
        LifecyclePolicyText: !Sub >-
          {"rules":[{"rulePriority":1,"description":"untagged images","selection":{"tagStatus":"untagged","countType":"sinceImagePushed","countUnit":"days","countNumber":${UntaggedImageExpireDays}},"action":{"type":"expire"}}]}

Outputs:
  AdminAuthRepositoryUri:
    Value: !GetAtt AdminAuthRepository.RepositoryUri
  ConsentApiRepositoryUri:
    Value: !GetAtt ConsentApiRepository.RepositoryUri
  MauticRepositoryUri:
    Value: !GetAtt MauticRepository.RepositoryUri
  ChatwootRepositoryUri:
    Value: !GetAtt ChatwootRepository.RepositoryUri
  UmamiRepositoryUri:
    Value: !GetAtt UmamiRepository.RepositoryUri
