# サプライチェーン対策（他の自作プロジェクトと同じ 3 設定）
minimumReleaseAge: 10080 # 公開から 7 日未満のバージョンはインストールしない（分）
trustPolicy: no-downgrade
blockExoticSubdeps: true

# trust downgrade の除外（バージョンまで指定）。
# いずれも eslint-config-next@16.3.5 の推移的依存で、既存のロックファイルにも含まれる。
# 2026-10-04 にユーザー判断で除外した。eslint-config-next を上げたら、まず除外を外して確かめる。
trustPolicyExclude:
  - eslint-import-resolver-typescript@3.10.1
  - semver@6.3.1
  - undici-types@6.21.0

allowBuilds:
  sharp: false
  unrs-resolver: false
