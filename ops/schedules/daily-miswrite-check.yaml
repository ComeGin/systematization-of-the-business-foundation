id: daily-miswrite-check
description: "誤った書き込みの突き合わせ。エージェント専用ユーザーの送信の記録のうち、どの E-13 にも対応しないものを候補として監視アプリに出す（TA-07 の 6.2）"
enabled: true
cron: "45 5 * * *"
kind: builtin
agent: null
builtin: miswrite-check
after: []
timeout_sec: 600
# 監視アプリに出す説明（2026-11-06。docs/superpowers/specs/2026-11-06-job-agent-info-design.md の 4 節）
overview: |
  エージェントを使わない決まった処理。本番の Chatwoot の会話のメッセージを読み、エージェント専用ユーザーが送ったもののうち、承認済みの E-13 にも実行記録（E-15）にも対応しないものを「誤った書き込みの候補」として監視アプリに残す。メッセージの本文は保存しない。本番の Chatwoot は夜間も止めない（2026-11-12）。
stage: check
io:
  reads:
    - "本番の Chatwoot の会話とメッセージ（参照専用のトークン）"
    - "承認済み main の E-13（approved・applied）"
    - "実行記録（E-15）"
  writes:
    - "監視アプリの「誤った書き込みの候補」（E-15 の置き場の SQLite）"
  does_not_write:
    - "本番の Chatwoot（読むだけ）"
    - "メッセージの本文"
