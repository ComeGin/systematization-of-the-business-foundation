id: weekly-observe-serp-audit
description: "OpenSEO のランク追跡とサイト監査の保存済みの結果を E-12（source: serp・site_audit）に正規化する。計測と監査の実行は人間が OpenSEO で行う"
enabled: true
cron: "0 2 * * 1"
kind: agent
agent: seo-auditor
builtin: null
after: []
prompt: |
  次の source だけを処理する: serp、site_audit

  取得の範囲（変えない）:
  - serp: get_rank_tracker で一覧を取り、トラッカーごとに最新の結果を読む（保存済みの結果を読むだけ。ランク追跡の作成・実行はしない）
  - site_audit: get_audit_status で最新の監査が完了しているときだけ、get_audit_issues（limit は 1000）を読む。完了した監査が無ければ E-12 を作らない
  - 費用の発生するツールは使わない

  lighthouse・gsc は処理しない。
timeout_sec: 900
max_turns: 40
# 監視アプリに出す説明（2026-11-06。docs/superpowers/specs/2026-11-06-job-agent-info-design.md の 4 節）
overview: |
  Agent seo-auditor を起動し、OpenSEO に保存済みのランク追跡の結果とサイト監査の結果を読んで、E-12（source: serp・site_audit）に正規化する。ランク追跡と監査の実行は人が OpenSEO で行う。完了した監査が無ければ site_audit の E-12 は作らない。
stage: observe
io:
  reads:
    - "OpenSEO のランク追跡の保存済みの結果（get_rank_tracker）"
    - "OpenSEO のサイト監査の結果（get_audit_status・get_audit_issues）"
  writes:
    - "E-12（docs/audits/serp/・docs/audits/site_audit/。作業ツリー）"
  does_not_write:
    - "ランク追跡の作成・実行、監査の実行（費用の出るツールは使わない）"
