AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  chatwoot-worker: Sidekiq（ジョブの実行。ALB には繋がない）。TA-06 の 3.1。
  Valkey が止まるとキューのジョブは失われる（バックアップは取らない。TA-06 の 4.5）。

Parameters:
  EnvName:
    Type: String
    Default: prod
  ClusterArn:
    Type: String
    Description: cluster.yaml の ClusterArn
  PrivateSubnetIds:
    Type: CommaDelimitedList
    Description: private サブネットの ID（network.yaml の PrivateSubnetIds）
  SecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: network.yaml の ChatwootWorkerSecurityGroupId
  LogGroupName:
    Type: String
    Description: cluster.yaml の ChatwootWorkerLogGroupName
  SecretNamePrefix:
    Type: String
    Description: secrets.yaml の SecretNamePrefix
  ImageRepositoryUri:
    Type: String
    Description: ecr.yaml の ChatwootRepositoryUri
  ImageTag:
    Type: String
    AllowedPattern: '^(?!latest$).+$'
    ConstraintDescription: latest は使えない。バージョンのタグで固定する（TA-06 の 3.2）。
    Default: v4.18.0-1
    Description: Chatwoot の ECR のタグ（chatwoot-web と同じ値にする）。
  DesiredCount:
    Type: Number
    Default: 0
    MinValue: 0
    Description: 初期値は 0（README の順に上げる）。
  Cpu:
    Type: String
    Default: '512'
    AllowedValues: ['256', '512', '1024', '2048', '4096']
    Description: 暫定値（TA-06 の 9 節の見積もり前）
  Memory:
    Type: String
    Default: '1024'
    Description: 暫定値。Fargate の CPU との組み合わせに合う値にする。
  EnableExecuteCommand:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: ECS Exec（運用者が DB やコンテナに入るための手段。踏み台は置かない。TA-06 の 5.6）
  PostgresEndpoint:
    Type: String
    Description: data.yaml の PostgresEndpoint
  ValkeyEndpoint:
    Type: String
    Description: data.yaml の ValkeyEndpoint
  ChatHost:
    Type: String
    Description: Chatwoot の公開ホスト名（FRONTEND_URL になる）
  DomainName:
    Type: String
    Default: comegin.com
    Description: 送信元ドメイン（SMTP_DOMAIN）。ses.yaml のドメイン ID と同じ。
  AttachmentBucketName:
    Type: String
    Description: data.yaml の ChatwootBucketName
  AttachmentBucketArn:
    Type: String
    Description: data.yaml の ChatwootBucketArn
  MailerSenderEmail:
    Type: String
    Default: Chatwoot <no-reply@comegin.com>
    Description: 送信元（MAILER_SENDER_EMAIL）。SES で検証済みのドメインのアドレスにする。

Resources:
  # 実行ロール（ECS のエージェントが使う）。イメージの取得、ログの書き込み、このサービスの Secret の読み取りだけ。
  # RDS のマスターの資格情報は読めない（ops-tasks.yaml の実行ロールだけが読める）。
  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'comegin-${EnvName}-chatwoot-worker-execution'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                'aws:SourceAccount': !Ref AWS::AccountId

  ExecutionPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub 'comegin-${EnvName}-chatwoot-worker-execution'
      Roles:
        - !Ref ExecutionRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          # cfn-guard の Resource '*' の指摘は意図した例外（リソースレベルの権限に対応しないアクション）:
          #   ecr:GetAuthorizationToken、タスクロールの ssmmessages（ECS Exec）。
          - Sid: EcrAuthorization
            Effect: Allow
            Action: ecr:GetAuthorizationToken
            Resource: '*'
          - Sid: EcrPull
            Effect: Allow
            Action:
              - ecr:BatchCheckLayerAvailability
              - ecr:GetDownloadUrlForLayer
              - ecr:BatchGetImage
            Resource:
              - !Sub
                - 'arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/${RepositoryName}'
                - RepositoryName: !Select [1, !Split ['.amazonaws.com/', !Ref ImageRepositoryUri]]
          - Sid: WriteLogs
            Effect: Allow
            Action:
              - logs:CreateLogStream
              - logs:PutLogEvents
            Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:${LogGroupName}:*'
          - Sid: ReadOwnSecrets
            Effect: Allow
            Action: secretsmanager:GetSecretValue
            Resource:
              - !Sub 'arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${SecretNamePrefix}/chatwoot/*'
              - !Sub 'arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${SecretNamePrefix}/shared/VALKEY_AUTH_TOKEN-*'

  # タスクロール（アプリのコードが使う）。アクセスキーは発行しない。
  # Secrets Manager の読み取りは付けない（エージェントとワークフローに渡さない。TA-04 の 1 節）。
  # ECS Exec の ssmmessages はリソースを絞れない（公式の要件）。
  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'comegin-${EnvName}-chatwoot-worker-task'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                'aws:SourceAccount': !Ref AWS::AccountId

  TaskPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub 'comegin-${EnvName}-chatwoot-worker-task'
      Roles:
        - !Ref TaskRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: EcsExec
            Effect: Allow
            Action:
              - ssmmessages:CreateControlChannel
              - ssmmessages:CreateDataChannel
              - ssmmessages:OpenControlChannel
              - ssmmessages:OpenDataChannel
            Resource: '*'
          - Sid: AttachmentBucketObjects
            Effect: Allow
            Action:
              - s3:GetObject
              - s3:PutObject
              - s3:DeleteObject
            Resource: !Sub '${AttachmentBucketArn}/*'
          - Sid: AttachmentBucketList
            Effect: Allow
            Action: s3:ListBucket
            Resource: !Ref AttachmentBucketArn

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub 'comegin-${EnvName}-chatwoot-worker'
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: !Ref Cpu
      Memory: !Ref Memory
      RuntimePlatform: { CpuArchitecture: X86_64, OperatingSystemFamily: LINUX }
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: chatwoot
          Image: !Sub '${ImageRepositoryUri}:${ImageTag}'
          Essential: true
          Command: [bundle, exec, sidekiq, -C, config/sidekiq.yml]
          Environment:
            - { Name: RAILS_ENV, Value: production }
            - { Name: NODE_ENV, Value: production }
            - { Name: INSTALLATION_ENV, Value: docker }
            - { Name: FRONTEND_URL, Value: !Sub 'https://${ChatHost}' }
            - { Name: FORCE_SSL, Value: 'true' }
            - { Name: ENABLE_ACCOUNT_SIGNUP, Value: 'false' }
            - { Name: DEFAULT_LOCALE, Value: ja }
            - { Name: RAILS_LOG_TO_STDOUT, Value: 'true' }
            - { Name: LOG_LEVEL, Value: info }
            - { Name: RAILS_MAX_THREADS, Value: '5' }
            - { Name: VIPS_BLOCK_UNTRUSTED, Value: '1' }
            - { Name: REDIS_URL, Value: !Sub 'rediss://${ValkeyEndpoint}:6379' }
            - { Name: POSTGRES_HOST, Value: !Ref PostgresEndpoint }
            - { Name: POSTGRES_PORT, Value: '5432' }
            - { Name: POSTGRES_DATABASE, Value: chatwoot }
            - { Name: POSTGRES_USERNAME, Value: chatwoot }
            - { Name: PGSSLMODE, Value: verify-full }
            - { Name: PGSSLROOTCERT, Value: /etc/rds/global-bundle.pem }
            - { Name: ACTIVE_STORAGE_SERVICE, Value: amazon }
            - { Name: S3_BUCKET_NAME, Value: !Ref AttachmentBucketName }
            - { Name: AWS_REGION, Value: !Ref AWS::Region }
            - { Name: MAILER_SENDER_EMAIL, Value: !Ref MailerSenderEmail }
            - { Name: SMTP_DOMAIN, Value: !Ref DomainName }
            - { Name: SMTP_ADDRESS, Value: !Sub 'email-smtp.${AWS::Region}.amazonaws.com' }
            - { Name: SMTP_PORT, Value: '587' }
            - { Name: SMTP_AUTHENTICATION, Value: login }
            - { Name: SMTP_ENABLE_STARTTLS_AUTO, Value: 'true' }
            - { Name: SMTP_OPENSSL_VERIFY_MODE, Value: peer }
          Secrets:
            - { Name: SECRET_KEY_BASE, ValueFrom: !Sub '${SecretNamePrefix}/chatwoot/SECRET_KEY_BASE' }
            - { Name: ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY, ValueFrom: !Sub '${SecretNamePrefix}/chatwoot/ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY' }
            - { Name: ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY, ValueFrom: !Sub '${SecretNamePrefix}/chatwoot/ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY' }
            - { Name: ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT, ValueFrom: !Sub '${SecretNamePrefix}/chatwoot/ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT' }
            - { Name: POSTGRES_PASSWORD, ValueFrom: !Sub '${SecretNamePrefix}/chatwoot/DB_PASSWORD' }
            - { Name: SMTP_USERNAME, ValueFrom: !Sub '${SecretNamePrefix}/chatwoot/SMTP_USERNAME' }
            - { Name: SMTP_PASSWORD, ValueFrom: !Sub '${SecretNamePrefix}/chatwoot/SMTP_PASSWORD' }
            - { Name: REDIS_PASSWORD, ValueFrom: !Sub '${SecretNamePrefix}/shared/VALKEY_AUTH_TOKEN' }
          LinuxParameters:
            InitProcessEnabled: true
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroupName
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: chatwoot-worker

  Service:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: !Sub 'comegin-${EnvName}-chatwoot-worker'
      Cluster: !Ref ClusterArn
      LaunchType: FARGATE
      DesiredCount: !Ref DesiredCount
      TaskDefinition: !Ref TaskDefinition
      EnableExecuteCommand: !Ref EnableExecuteCommand
      PropagateTags: SERVICE
      # デプロイのサーキットブレーカー: 新しいタスクが起動に失敗し続けたら、直前のリビジョンに戻す。
      DeploymentConfiguration:
        MaximumPercent: 200
        MinimumHealthyPercent: 100
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          SecurityGroups:
            - !Ref SecurityGroupId
          Subnets: !Ref PrivateSubnetIds

Outputs:
  ServiceName:
    Value: !GetAtt Service.Name
  TaskRoleArn:
    Value: !GetAtt TaskRole.Arn
  TaskDefinitionArn:
    Value: !Ref TaskDefinition
