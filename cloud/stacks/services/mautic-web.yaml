AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  mautic-web: Mautic の管理画面・API・フォーム受付・トラッキング（ECS on Fargate）。TA-06 の 3.1。
# テンプレートの Description は 1024 バイトまで（日本語は 1 文字 3 バイト。超えるとスタックの作成が失敗する）。詳しい説明は以下のコメント。
# DOCKER_MAUTIC_ROLE=mautic_web（公式イメージ mautic/mautic の契約。公式に 7.x のタグがある）。イメージは公式を派生させて RDS の CA を足したもの
# （cloud/images/mautic/Dockerfile。MySQL への接続でサーバー証明書を検証する）。
# データは RDS の MySQL（mautic データベース）と EFS（media/images・media/files・config）。
# マイグレーション: 公式の entrypoint が、インストール済み（config/local.php に db_driver と site_url がある）なら起動のたびに
# doctrine:migrations:migrate を実行する。未インストールのあいだは何もせず、管理画面の /installer（OIDC の内側）でインストールする。
# Mautic のメール送信（SES の SMTP）は、管理画面で設定する（SMTP 認証情報は secrets.yaml の mautic/SMTP_USERNAME・SMTP_PASSWORD に
# 人間が入れた値を使う）。環境変数で渡さないのは、Mautic 7 の設定名を確かめられていないため（TODO）。

Parameters:
  EnvName:
    Type: String
    Default: prod
  ClusterArn:
    Type: String
    Description: cluster.yaml の ClusterArn
  PrivateSubnetIds:
    Type: CommaDelimitedList
    Description: private サブネットの ID（network.yaml の PrivateSubnetIds）
  SecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: network.yaml の MauticWebSecurityGroupId
  LogGroupName:
    Type: String
    Description: cluster.yaml の MauticWebLogGroupName
  SecretNamePrefix:
    Type: String
    Description: secrets.yaml の SecretNamePrefix
  ImageRepositoryUri:
    Type: String
    Description: ecr.yaml の MauticRepositoryUri
  ImageTag:
    Type: String
    AllowedPattern: '^(?!latest$).+$'
    ConstraintDescription: latest は使えない。バージョンのタグで固定する（TA-06 の 3.2）。
    Default: 7.2.0-1
    Description: Mautic の ECR のタグ（mautic-cron と同じ値にする）。<公式のタグ>-<ビルドの連番>（例 7.2.0-apache の派生を 7.2.0-1）。取り込み済みのソースは 7.2.0。
  DesiredCount:
    Type: Number
    Default: 0
    AllowedValues: [0, 1]
    Description: 1 に固定。複数にするには PHP のセッションの共有が要る（既定はファイル。TA-06 の 3.1）。
  Cpu:
    Type: String
    Default: '1024'
    AllowedValues: ['256', '512', '1024', '2048', '4096']
    Description: 暫定値（TA-06 の 9 節の見積もり前）
  Memory:
    Type: String
    Default: '2048'
    Description: 暫定値。Fargate の CPU との組み合わせに合う値にする。
  EnableExecuteCommand:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: ECS Exec（運用者が DB やコンテナに入るための手段。踏み台は置かない。TA-06 の 5.6）
  ContainerPort:
    Type: Number
    Default: 80
    Description: コンテナの待ち受けポート。network.yaml と edge.yaml の値と同じにする（親が同じ値を渡す）。
  TargetGroupArn:
    Type: String
    Description: edge.yaml の MauticWebTargetGroupArn
  HealthCheckGracePeriodSeconds:
    Type: Number
    Default: 180
    MinValue: 60
    MaxValue: 2147483647
    Description: >-
      起動直後のヘルスチェックの猶予（秒）。公式の entrypoint は doctrine:migrations:migrate を終えてから Apache を起動するので、
      版を上げて移行が長いときは、その間だけ延ばす（親の MauticWebHealthCheckGracePeriodSeconds。README の 4.12）。
      猶予を過ぎると ECS がタスクを入れ替え、移行が途中で止まる（MySQL の DDL は巻き戻らない）。
  MysqlEndpoint:
    Type: String
    Description: data.yaml の MysqlEndpoint
  MktHost:
    Type: String
    Description: Mautic の公開ホスト名（ALB の振り分け。site_url になる）
  TrustedProxyCidr:
    Type: String
    Default: 10.20.0.0/16
    Description: ALB が属する VPC の CIDR。ALB 越しの HTTPS をアプリに信頼させる（network.yaml の VpcCidr と同じ値）。
  EfsFileSystemId:
    Type: String
    Description: data.yaml の EfsFileSystemId
  MediaImagesAccessPointId:
    Type: String
    Description: data.yaml の MauticMediaImagesAccessPointId
  MediaFilesAccessPointId:
    Type: String
    Description: data.yaml の MauticMediaFilesAccessPointId
  ConfigAccessPointId:
    Type: String
    Description: data.yaml の MauticConfigAccessPointId
  MountConfigVolume:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: >-
      config ディレクトリを EFS で覆うか（管理画面で変えた設定とインストールの結果 config/local.php を、タスクの再起動で消さない。TA-06 の 4.4）。
      公式イメージ（7.2.0-apache）の config には .gitkeep しか無く、EFS で覆っても隠れる既定のファイルは無い。
      entrypoint が、local.php が無ければテンプレートから作る（startup/check_local_php_exists.sh）。
      アクセスポイントの所有者は uid 33 の www-data で、entrypoint のボリュームの所有者の検査と一致する。

Conditions:
  MountConfig: !Equals [!Ref MountConfigVolume, 'true']

Resources:
  # 実行ロール（ECS のエージェントが使う）。イメージの取得、ログの書き込み、このサービスの Secret の読み取りだけ。
  # RDS のマスターの資格情報は読めない（ops-tasks.yaml の実行ロールだけが読める）。
  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'comegin-${EnvName}-mautic-web-execution'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                'aws:SourceAccount': !Ref AWS::AccountId

  ExecutionPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub 'comegin-${EnvName}-mautic-web-execution'
      Roles:
        - !Ref ExecutionRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          # cfn-guard の Resource '*' の指摘は意図した例外（リソースレベルの権限に対応しないアクション）:
          #   ecr:GetAuthorizationToken、タスクロールの ssmmessages（ECS Exec）。
          - Sid: EcrAuthorization
            Effect: Allow
            Action: ecr:GetAuthorizationToken
            Resource: '*'
          - Sid: EcrPull
            Effect: Allow
            Action:
              - ecr:BatchCheckLayerAvailability
              - ecr:GetDownloadUrlForLayer
              - ecr:BatchGetImage
            Resource:
              - !Sub
                - 'arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/${RepositoryName}'
                - RepositoryName: !Select [1, !Split ['.amazonaws.com/', !Ref ImageRepositoryUri]]
          - Sid: WriteLogs
            Effect: Allow
            Action:
              - logs:CreateLogStream
              - logs:PutLogEvents
            Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:${LogGroupName}:*'
          - Sid: ReadOwnSecrets
            Effect: Allow
            Action: secretsmanager:GetSecretValue
            Resource:
              - !Sub 'arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${SecretNamePrefix}/mautic/*'

  # タスクロール（アプリのコードが使う）。アクセスキーは発行しない。
  # Secrets Manager の読み取りは付けない（エージェントとワークフローに渡さない。TA-04 の 1 節）。
  # ECS Exec の ssmmessages はリソースを絞れない（公式の要件）。
  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'comegin-${EnvName}-mautic-web-task'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                'aws:SourceAccount': !Ref AWS::AccountId

  TaskPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub 'comegin-${EnvName}-mautic-web-task'
      Roles:
        - !Ref TaskRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: EcsExec
            Effect: Allow
            Action:
              - ssmmessages:CreateControlChannel
              - ssmmessages:CreateDataChannel
              - ssmmessages:OpenControlChannel
              - ssmmessages:OpenDataChannel
            Resource: '*'

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub 'comegin-${EnvName}-mautic-web'
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: !Ref Cpu
      Memory: !Ref Memory
      RuntimePlatform: { CpuArchitecture: X86_64, OperatingSystemFamily: LINUX }
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      Volumes:
        - Name: mautic-media-images
          EFSVolumeConfiguration:
            FilesystemId: !Ref EfsFileSystemId
            TransitEncryption: ENABLED
            AuthorizationConfig: { AccessPointId: !Ref MediaImagesAccessPointId, IAM: DISABLED }
        - Name: mautic-media-files
          EFSVolumeConfiguration:
            FilesystemId: !Ref EfsFileSystemId
            TransitEncryption: ENABLED
            AuthorizationConfig: { AccessPointId: !Ref MediaFilesAccessPointId, IAM: DISABLED }
        - !If
          - MountConfig
          - Name: mautic-config
            EFSVolumeConfiguration:
              FilesystemId: !Ref EfsFileSystemId
              TransitEncryption: ENABLED
              AuthorizationConfig: { AccessPointId: !Ref ConfigAccessPointId, IAM: DISABLED }
          - !Ref AWS::NoValue
      ContainerDefinitions:
        - Name: mautic
          Image: !Sub '${ImageRepositoryUri}:${ImageTag}'
          Essential: true
          PortMappings:
            - { Name: http, ContainerPort: !Ref ContainerPort, Protocol: tcp, AppProtocol: http }
          Environment:
            - { Name: DOCKER_MAUTIC_ROLE, Value: mautic_web }
            - { Name: MAUTIC_DB_HOST, Value: !Ref MysqlEndpoint }
            - { Name: MAUTIC_DB_PORT, Value: '3306' }
            - { Name: MAUTIC_DB_DATABASE, Value: mautic }
            - { Name: MAUTIC_DB_USER, Value: mautic }
            - { Name: PHP_INI_VALUE_DATE_TIMEZONE, Value: Asia/Tokyo }
            - { Name: MAUTIC_SITE_URL, Value: !Sub 'https://${MktHost}' }
            # Mautic はこの環境変数を直接は読まない。派生イメージの entrypoint（cloud/images/mautic/comegin-entrypoint.sh）が
            # 起動のたびに config/parameters_local.php の trusted_proxies に写す（ALB 越しの要求を https・訪問者の IP と判定させる）
            - { Name: MAUTIC_TRUSTED_PROXIES, Value: !Sub '["${TrustedProxyCidr}"]' }
          Secrets:
            - { Name: MAUTIC_DB_PASSWORD, ValueFrom: !Sub 'arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${SecretNamePrefix}/mautic/DB_PASSWORD' }
            - { Name: MAUTIC_SECRET_KEY, ValueFrom: !Sub 'arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${SecretNamePrefix}/mautic/SECRET_KEY' }
          MountPoints:
            - { SourceVolume: mautic-media-images, ContainerPath: /var/www/html/docroot/media/images, ReadOnly: false }
            - { SourceVolume: mautic-media-files, ContainerPath: /var/www/html/docroot/media/files, ReadOnly: false }
            - !If
              - MountConfig
              - { SourceVolume: mautic-config, ContainerPath: /var/www/html/config, ReadOnly: false }
              - !Ref AWS::NoValue
          LinuxParameters:
            InitProcessEnabled: true
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroupName
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: mautic-web

  Service:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: !Sub 'comegin-${EnvName}-mautic-web'
      Cluster: !Ref ClusterArn
      LaunchType: FARGATE
      DesiredCount: !Ref DesiredCount
      TaskDefinition: !Ref TaskDefinition
      EnableExecuteCommand: !Ref EnableExecuteCommand
      PropagateTags: SERVICE
      # デプロイのサーキットブレーカー: 新しいタスクが起動に失敗し続けたら、直前のリビジョンに戻す。
      DeploymentConfiguration:
        MaximumPercent: 200
        MinimumHealthyPercent: 100
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          SecurityGroups:
            - !Ref SecurityGroupId
          Subnets: !Ref PrivateSubnetIds
      HealthCheckGracePeriodSeconds: !Ref HealthCheckGracePeriodSeconds
      LoadBalancers:
        - ContainerName: mautic
          ContainerPort: !Ref ContainerPort
          TargetGroupArn: !Ref TargetGroupArn

Outputs:
  ServiceName:
    Value: !GetAtt Service.Name
  TaskRoleArn:
    Value: !GetAtt TaskRole.Arn
  TaskDefinitionArn:
    Value: !Ref TaskDefinition
