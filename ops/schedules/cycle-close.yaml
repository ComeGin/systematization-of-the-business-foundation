id: cycle-close
description: "改善ループの周（14 日）の終わり。期間が終わった周を、反映の件数と止まっている場所を数えて閉じる（エージェントは使わない）。月曜 00:05 に起動し、期間が終わって閉じていない周が無ければ何もせず見送る"
enabled: false
# 周の終わりは次の周の 0 日目（月曜）の 00:00。毎週月曜に起動し、期間が終わった（今 >= 周の終わり）のに閉じていない周だけを閉じる（Ruling 32）。
# 周の終わりの日（13 日目の日曜）に確かめた反映もその周に数えるため、日曜ではなく月曜に動かす。cycle-open（00:00）が先に閉じていれば skipped
# （「期間が終わって閉じていない周が無い」）。周の途中の月曜も skipped。起動 + 300 秒 = 00:10 で、8 時より前
cron: "5 0 * * 1"
kind: builtin
agent: null
builtin: cycle-close
after: []
timeout_sec: 300
overview: |
  エージェントを使わない決まった処理。毎週月曜に起動し、期間（14 日）が終わったのに閉じていない改善ループの周を閉じる。閉じる前に、確かめ済みの配信に含まれた記事・コードの反映を記録し、反映（配信が済んで公開サイトに出たもの）の件数を E-13 由来とキーワード由来で数え、止まっている場所（改修案が出なかった・PR が承認されていない・OK 待ち・実行されていない・配信されていない）を出す。どちらも 0 件なら画面と通知で知らせる。期間の途中の周は、手で起動しても閉じない。閉じる周が無いとき（cycle-open が先に閉じた・周の途中の週）は見送る。CONTROL_CYCLE_ANCHOR が無いときも見送る。
stage: monitor
io:
  reads:
    - "CONTROL_CYCLE_ANCHOR（周の起点）"
    - "E-15 の周と項目"
    - "GitHub（code の項目の PR のマージのコミットが配信に含まれるか。設定があるときだけ）"
  writes:
    - "E-15 の周（閉じる。反映の件数と止まっている場所）"
    - "E-15 の項目の反映の時刻（確かめ済みの配信に含まれた article・code）"
    - "反映が 0 件だったときの知らせ（画面・通知）"
  does_not_write:
    - "項目の状態（cycle-collect が更新する）"
    - "閉じた周の取り消し"
