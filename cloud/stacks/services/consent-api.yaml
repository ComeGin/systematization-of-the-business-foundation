AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  consent-api: Cookie 同意の状態を受け取り、ElastiCache（Valkey）に記録する（ECS on Fargate）。TA-06 の 3.1・4.8。
  訪問者のリクエストを直接受ける唯一の自作のコード。DB を持たず、RDS の資格情報を一切渡さない（実行ロールは Valkey の AUTH トークンだけを読める。
  セキュリティグループも Valkey にしか届かない）。環境変数名は backend/consent-api/.env.example が正本。
  ALB の許可パスは /v1/consent の 1 本だけ（edge.yaml）。/healthz は外に出さない。
  Valkey の証明書は Amazon の CA が署名しており、Node の標準の信頼ストアで検証できる（RDS の CA とは違う）。

Parameters:
  EnvName:
    Type: String
    Default: prod
  ClusterArn:
    Type: String
    Description: cluster.yaml の ClusterArn
  PrivateSubnetIds:
    Type: CommaDelimitedList
    Description: private サブネットの ID（network.yaml の PrivateSubnetIds）
  SecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: network.yaml の ConsentApiSecurityGroupId
  LogGroupName:
    Type: String
    Description: cluster.yaml の ConsentApiLogGroupName
  SecretNamePrefix:
    Type: String
    Description: secrets.yaml の SecretNamePrefix
  ImageRepositoryUri:
    Type: String
    Description: ecr.yaml の ConsentApiRepositoryUri
  ImageTag:
    Type: String
    AllowedPattern: '^(?!latest$).+$'
    ConstraintDescription: latest は使えない。バージョンのタグで固定する（TA-06 の 3.2）。
    Default: REPLACE-WITH-FIXED-TAG
    Description: consent-api のイメージのタグ（backend/consent-api からビルドしたもの）。
  DesiredCount:
    Type: Number
    Default: 0
    MinValue: 0
    Description: 初期値は 0（README の順に上げる）。
  Cpu:
    Type: String
    Default: '256'
    AllowedValues: ['256', '512', '1024', '2048', '4096']
    Description: 暫定値（TA-06 の 9 節の見積もり前）
  Memory:
    Type: String
    Default: '512'
    Description: 暫定値。Fargate の CPU との組み合わせに合う値にする。
  EnableExecuteCommand:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: ECS Exec（運用者が DB やコンテナに入るための手段。踏み台は置かない。TA-06 の 5.6）
  ContainerPort:
    Type: Number
    Default: 3104
    Description: コンテナの待ち受けポート。network.yaml と edge.yaml の値と同じにする（親が同じ値を渡す）。
  TargetGroupArn:
    Type: String
    Description: edge.yaml の ConsentApiTargetGroupArn
  HealthCheckGracePeriodSeconds:
    Type: Number
    Default: 30
    Description: 起動直後のヘルスチェックの猶予（秒）
  ValkeyEndpoint:
    Type: String
    Description: data.yaml の ValkeyEndpoint
  SiteUrl:
    Type: String
    Description: CORS で許す公開サイトのオリジン（1 つだけ。パスは付けない。例 https://comegin.com）
  CookieDomain:
    Type: String
    Default: .comegin.com
    Description: Cookie の Domain 属性。同意の Cookie を公開サイトの JavaScript が読めるよう、同一サイトのドメインにする。
  ConsentPolicyVersion:
    Type: String
    Default: '2026-10-01'
    Description: 現行のプライバシーポリシー・Cookie 文面の版。記録と Cookie に入る。

Resources:
  # 実行ロール（ECS のエージェントが使う）。イメージの取得、ログの書き込み、このサービスの Secret の読み取りだけ。
  # RDS のマスターの資格情報は読めない（ops-tasks.yaml の実行ロールだけが読める）。
  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'comegin-${EnvName}-consent-api-execution'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                'aws:SourceAccount': !Ref AWS::AccountId

  ExecutionPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub 'comegin-${EnvName}-consent-api-execution'
      Roles:
        - !Ref ExecutionRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          # cfn-guard の Resource '*' の指摘は意図した例外（リソースレベルの権限に対応しないアクション）:
          #   ecr:GetAuthorizationToken、タスクロールの ssmmessages（ECS Exec）。
          - Sid: EcrAuthorization
            Effect: Allow
            Action: ecr:GetAuthorizationToken
            Resource: '*'
          - Sid: EcrPull
            Effect: Allow
            Action:
              - ecr:BatchCheckLayerAvailability
              - ecr:GetDownloadUrlForLayer
              - ecr:BatchGetImage
            Resource:
              - !Sub
                - 'arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/${RepositoryName}'
                - RepositoryName: !Select [1, !Split ['.amazonaws.com/', !Ref ImageRepositoryUri]]
          - Sid: WriteLogs
            Effect: Allow
            Action:
              - logs:CreateLogStream
              - logs:PutLogEvents
            Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:${LogGroupName}:*'
          - Sid: ReadOwnSecrets
            Effect: Allow
            Action: secretsmanager:GetSecretValue
            Resource:
              - !Sub 'arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${SecretNamePrefix}/shared/VALKEY_AUTH_TOKEN-*'

  # タスクロール（アプリのコードが使う）。アクセスキーは発行しない。
  # Secrets Manager の読み取りは付けない（エージェントとワークフローに渡さない。TA-04 の 1 節）。
  # ECS Exec の ssmmessages はリソースを絞れない（公式の要件）。
  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'comegin-${EnvName}-consent-api-task'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                'aws:SourceAccount': !Ref AWS::AccountId

  TaskPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub 'comegin-${EnvName}-consent-api-task'
      Roles:
        - !Ref TaskRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: EcsExec
            Effect: Allow
            Action:
              - ssmmessages:CreateControlChannel
              - ssmmessages:CreateDataChannel
              - ssmmessages:OpenControlChannel
              - ssmmessages:OpenDataChannel
            Resource: '*'

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub 'comegin-${EnvName}-consent-api'
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: !Ref Cpu
      Memory: !Ref Memory
      RuntimePlatform: { CpuArchitecture: X86_64, OperatingSystemFamily: LINUX }
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: consent-api
          Image: !Sub '${ImageRepositoryUri}:${ImageTag}'
          Essential: true
          PortMappings:
            - { Name: http, ContainerPort: !Ref ContainerPort, Protocol: tcp, AppProtocol: http }
          StopTimeout: 30
          Environment:
            - { Name: NODE_ENV, Value: production }
            - { Name: HOST, Value: 0.0.0.0 }
            - { Name: PORT, Value: !Ref ContainerPort }
            - { Name: VALKEY_URL, Value: !Sub 'rediss://${ValkeyEndpoint}:6379' }
            - { Name: VALKEY_KEY_PREFIX, Value: 'consent:' }
            - { Name: SITE_URL, Value: !Ref SiteUrl }
            - { Name: COOKIE_DOMAIN, Value: !Ref CookieDomain }
            - { Name: CONSENT_POLICY_VERSION, Value: !Ref ConsentPolicyVersion }
          Secrets:
            - { Name: VALKEY_PASSWORD, ValueFrom: !Sub '${SecretNamePrefix}/shared/VALKEY_AUTH_TOKEN' }
          LinuxParameters:
            InitProcessEnabled: true
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroupName
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: consent-api

  Service:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: !Sub 'comegin-${EnvName}-consent-api'
      Cluster: !Ref ClusterArn
      LaunchType: FARGATE
      DesiredCount: !Ref DesiredCount
      TaskDefinition: !Ref TaskDefinition
      EnableExecuteCommand: !Ref EnableExecuteCommand
      PropagateTags: SERVICE
      # デプロイのサーキットブレーカー: 新しいタスクが起動に失敗し続けたら、直前のリビジョンに戻す。
      DeploymentConfiguration:
        MaximumPercent: 200
        MinimumHealthyPercent: 100
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          SecurityGroups:
            - !Ref SecurityGroupId
          Subnets: !Ref PrivateSubnetIds
      HealthCheckGracePeriodSeconds: !Ref HealthCheckGracePeriodSeconds
      LoadBalancers:
        - ContainerName: consent-api
          ContainerPort: !Ref ContainerPort
          TargetGroupArn: !Ref TargetGroupArn

Outputs:
  ServiceName:
    Value: !GetAtt Service.Name
  TaskRoleArn:
    Value: !GetAtt TaskRole.Arn
  TaskDefinitionArn:
    Value: !Ref TaskDefinition
