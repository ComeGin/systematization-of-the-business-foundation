id: daily-observe-conversations
description: "本番の Chatwoot の未解決の会話を一次切り分けし、社内メモと集計（E-12 の source: conversations）を残す（日次の観測 4 本のうちの 1 本。顧客への送信は許可しない）"
enabled: true
cron: "0 4 * * *"
kind: agent
agent: conversation-triage
builtin: null
after: []
prompt: |
  本番の Chatwoot（chatwoot-prod）の未解決の会話を一次切り分けする。顧客へのメッセージは送らない。社内メモは chatwoot_add_private_note だけで書く。

  取得の範囲（変えない）:
  - 対象: 直近の未解決の会話に限定する（status は open と pending）。本文検索（q）は使わない
  - 上限: 最大 4 ページ（1 ページ 25 件。ページ件数はサーバ側の固定）
  - 長文は既定の省略のまま判断する。全文を取るのは記事化候補の要旨を残すときだけ
  - 更新してよいのは labels の追加（add）と priority だけ。status・assignee_id・team_id は変えない
  - 社内メモと E-12 に会話本文・顧客の氏名・メールアドレスを書かない。会話は display_id と主題の分類だけで指す
timeout_sec: 1200
max_turns: 80
# 監視アプリに出す説明（2026-11-06。docs/superpowers/specs/2026-11-06-job-agent-info-design.md の 4 節）
overview: |
  Agent conversation-triage を起動し、本番の Chatwoot の未解決（open・pending）の会話を最大 4 ページ読んで一次切り分けする。会話に社内メモ（顧客には届かない）とラベル・優先度を付け、集計を E-12（source: conversations）に残す。本番の Chatwoot は夜間も止めない（2026-11-12）。
stage: observe
io:
  reads:
    - "本番の Chatwoot の未解決の会話とメッセージ（chatwoot-prod）"
  writes:
    - "本番の Chatwoot の社内メモ（chatwoot_add_private_note）"
    - "会話のラベルの追加と優先度"
    - "E-12（docs/audits/conversations/。作業ツリー）"
  does_not_write:
    - "顧客へのメッセージ"
    - "会話の状態・担当者・チーム"
    - "社内メモと E-12 に、会話の本文・顧客の氏名・メールアドレス"
