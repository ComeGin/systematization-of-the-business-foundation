AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >-
  ComeGin の本番環境（ap-northeast-1）。親スタック。子スタックを AWS::Serverless::Application で呼ぶ。
  子スタック同士は、この親が !GetAtt <Child>.Outputs.<Name> をパラメータに渡す形だけでつなぐ
  （Fn::ImportValue と Export は使わない）。設計は docs/RequirementDefinition/TA/06-aws-runtime.md。
  us-east-1 の ACM と CloudFront 用 WAF は別スタック（global/template.yaml。先にデプロイする）。

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: { default: 全体 }
        Parameters: [EnvName, DomainName, HostedZoneId]
      - Label: { default: ホスト名（ALB の振り分け。TA-06 の 5.1） }
        Parameters: [ChatHost, MktHost, AuthHost, ConsentHost]
      - Label: { default: Astro の配信（CloudFront。global/template.yaml の出力を写す） }
        Parameters: [SiteHost, CloudFrontCertificateArn, CloudFrontWebAclArn]
      - Label: { default: コンテナの待ち受けポート }
        Parameters: [MauticWebPort, ChatwootWebPort]
      - Label: { default: 管理者の認証（ALB の authenticate-oidc） }
        Parameters: [AlbOidcClientId]
      - Label: { default: データストア（暫定値） }
        Parameters: [MysqlMinCapacity, MysqlMaxCapacity, PostgresMinCapacity, PostgresMaxCapacity, ValkeyNodeType]
      - Label: { default: オンプレとの WireGuard（ADR-21。wireguard.yaml） }
        Parameters: [OnpremWireguardCidr, WireguardServerAddress, OnpremPeerAddress, WireguardPort, WireguardIngressCidr, OnpremWebhookPort, OnpremWireguardPublicKey, WireguardInstanceType, WireguardAmiSsmId, WireguardFixedAmiId]
      - Label: { default: WAF（暫定値） }
        Parameters: [WafRateLimitConsent, WafRateLimitForm, WafRateLimitApi, WafRateLimitVisitor, WafRateLimitAuth, WafCommonRuleSetAction]
      - Label: { default: サービスのイメージのタグ（製品ごと。latest は使えない） }
        Parameters: [MauticImageTag, ChatwootImageTag]
      - Label: { default: サービスの台数・CPU・メモリ（暫定値。台数は 0 が初期値） }
        Parameters: [NightlyStopEnabled, NightlyStopSchedule, NightlyStartSchedule, NightlyStopTimezone, MauticWebDesiredCount, MauticWebCpu, MauticWebMemory, MauticWebHealthCheckGracePeriodSeconds, MauticCronDesiredCount, MauticCronCpu, MauticCronMemory, ChatwootWebDesiredCount, ChatwootWebCpu, ChatwootWebMemory, ChatwootWorkerDesiredCount, ChatwootWorkerCpu, ChatwootWorkerMemory]
      - Label: { default: サービスの設定 }
        Parameters: [VpcCidr, RdsCaSha256, MauticMountConfigVolume, ChatwootMailerSenderEmail, GoogleClientId, AdminBootstrapEmails, ConsentPolicyVersion]
      - Label: { default: consent-api（ADR-26。services/consent-api.yaml） }
        Parameters: [ConsentApiReservedConcurrency]
      - Label: { default: admin-auth（ADR-26。services/admin-auth.yaml） }
        Parameters: [AdminAuthReservedConcurrency, AdminAuthOpsReservedConcurrency, AdminAuthProvisionedConcurrency]
      - Label: { default: FAQ ボット（ADR-26。services/faq-bot.yaml） }
        Parameters: [FaqBotReservedConcurrency, FaqBotChatwootAccountId, FaqMatchHigh, FaqMatchLow, FaqMatchMargin]
      - Label: { default: 通知と監視 }
        Parameters: [HeartbeatAlarmActionsEnabled, SesTlsPolicy]
      - Label: { default: E-15 の写し }
        Parameters: [RunLogAdminPrincipalArns]

Parameters:
  EnvName:
    Type: String
    Default: prod
    Description: 環境名。リソース名に入る。
  DomainName:
    Type: String
    Default: comegin.com
  HostedZoneId:
    Type: String
    Default: Z0000211V2SV6GQWKMCL
    Description: DomainName の Route 53 ホストゾーン（作成済み）。ACM の DNS 検証、エイリアス、SES の DKIM に使う。

  ChatHost:
    Type: String
    Default: chat.comegin.com
    Description: chatwoot-web（確定）
  MktHost:
    Type: String
    Default: mkt.comegin.com
    Description: mautic-web（確定）
  # stats.（以前のアクセス解析）は ADR-25 で外した。アクセス解析は GA4（SaaS）で、クラウドに置くものが無い。
  AuthHost:
    Type: String
    Default: auth.comegin.com
    Description: admin-auth（確定）
  ConsentHost:
    Type: String
    Default: consent.comegin.com
    Description: consent-api。案。同意の Cookie を公開サイトの JavaScript が読めるよう、同一サイトのサブドメインにする。

  SiteHost:
    Type: String
    Default: comegin.com
    Description: Astro の公開ホスト名。global/template.yaml の SiteHost と同じにする。TODO(未決定) apex か www か（TA-02 の 9 節）。
  CloudFrontCertificateArn:
    Type: String
    Description: 必須（既定なし）。global/template.yaml（us-east-1）の出力 CertificateArn。
  CloudFrontWebAclArn:
    Type: String
    Description: 必須（既定なし）。global/template.yaml（us-east-1）の出力 WebAclArn。

  # コンテナの待ち受けポート。network.yaml の SG、edge.yaml のターゲットグループ、各サービスのタスク定義で同じ値を使う。
  MauticWebPort:
    Type: Number
    Default: 80
  ChatwootWebPort:
    Type: Number
    Default: 3000

  AlbOidcClientId:
    Type: String
    Default: alb-admin-gate
    MinLength: 8
    AllowedPattern: '^[A-Za-z0-9_-]+$'
    ConstraintDescription: 8 文字以上の英数字と _ - だけ（admin-auth の config.ts の ALB_CLIENT_ID の検査と同じ）。
    Description: >-
      ALB の authenticate-oidc のクライアント ID。admin-auth の ALB_CLIENT_ID と同じ値になる。
      8 文字未満だと admin-auth-ops が設定の検査で止まり、migrate も ALB の登録もできない（誰も管理画面に入れない）。

  # 暫定値（TA-06 の 9 節の見積もり前）。
  # MySQL（Mautic）も PostgreSQL（4 アプリが共有）も Aurora Serverless v2（ユーザーの条件: 互換があればサーバーレス。2026-10-27）。
  # コストの比較（クラスターの db.t4g.medium との損益分岐は平均 0.75 ACU）は stacks/data.yaml の注記と README の 6 節
  MysqlMinCapacity:
    Type: Number
    Default: 0.5
    MinValue: 0.5
  MysqlMaxCapacity:
    Type: Number
    Default: 2
    MinValue: 1
  PostgresMinCapacity:
    Type: Number
    Default: 0.5
    MinValue: 0.5
  PostgresMaxCapacity:
    Type: Number
    Default: 2
    MinValue: 1
  ValkeyNodeType:
    Type: String
    Default: cache.t4g.micro

  # WAF（5 分あたり・送信元 IP あたりのリクエスト数。暫定。実測して決める）
  WafRateLimitConsent:
    Type: Number
    Default: 100
  WafRateLimitForm:
    Type: Number
    Default: 100
  WafRateLimitApi:
    Type: Number
    Default: 1000
  WafRateLimitVisitor:
    Type: Number
    Default: 2000
  WafRateLimitAuth:
    Type: Number
    Default: 300
  WafCommonRuleSetAction:
    Type: String
    Default: Count
    AllowedValues: [Count, Block]
    Description: 管理画面の誤検知が無いことを WAF のログで確かめてから Block にする。

  SesTlsPolicy:
    Type: String
    Default: REQUIRE
    AllowedValues: [REQUIRE, OPTIONAL]
    Description: >-
      SES の受信サーバーへの TLS（stacks/ses.yaml の TlsPolicy）。REQUIRE は TLS の無い受信先に送らない（個人情報を平文で流さない）。
      届かない宛先が業務に要ると分かったら、R1 の判断で OPTIONAL にする。
  HeartbeatAlarmActionsEnabled:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: ハートビートのアラームの通知を有効にするか。監視アプリが信号を送り始めるまでは通知が出る。
  RunLogAdminPrincipalArns:
    Type: CommaDelimitedList
    Description: >-
      必須（既定なし）。E-15 の写しのバケットの削除系・設定変更系の拒否を免除する主体の ARN。
      デプロイに使う主体（IAM ユーザー comegin-iam、または CloudFormation のサービスロール）の ARN を入れる。
      入れないと、スタック自身の更新も拒否される。

  # ---- サービス（T1-3）
  # ECR のタグは「<上流のタグ>-<ビルドの連番>」（RDS の CA を足した派生イメージ。cloud/images/<製品>/Dockerfile。README の 4.7）。
  # イメージのタグはサービスごとではなく製品ごと（mautic-web と mautic-cron、chatwoot-web と chatwoot-worker は同じタグ。ずれを防ぐ）。
  # latest は使えない。REPLACE-WITH-FIXED-TAG のままでは起動しない（DesiredCount は 0 が初期値）。
  MauticImageTag:
    Type: String
    AllowedPattern: '^(?!latest$).+$'
    ConstraintDescription: latest は使えない。バージョンのタグで固定する。
    Default: 7.2.0-1
  ChatwootImageTag:
    Type: String
    AllowedPattern: '^(?!latest$).+$'
    ConstraintDescription: latest は使えない。バージョンのタグで固定する。
    Default: v4.18.0-1
  # 夜間の停止（2026-10-26。ユーザーの決定）。chatwoot-web・chatwoot-worker・mautic-cron を毎日 22 時〜翌 8 時（日本時間）に 0 台にする。
  # mautic-web は止めない（夜間の公開サイトのフォームの申し込みを取りこぼさないため）。費用は月 $37 前後下がる（README の 3.1）
  NightlyStopEnabled:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
  NightlyStopSchedule:
    Type: String
    Default: cron(0 22 * * ? *)
  NightlyStartSchedule:
    Type: String
    Default: cron(0 8 * * ? *)
  NightlyStopTimezone:
    Type: String
    Default: Asia/Tokyo
  MauticWebDesiredCount:
    Type: Number
    Default: 0
    AllowedValues: [0, 1]
  MauticWebCpu:
    Type: String
    Default: '1024'
    AllowedValues: ['256', '512', '1024', '2048', '4096']
  MauticWebMemory:
    Type: String
    Default: '2048'
  MauticWebHealthCheckGracePeriodSeconds:
    Type: Number
    Default: 180
    MinValue: 60
    Description: >-
      mautic-web の起動直後のヘルスチェックの猶予（秒）。版を上げて移行（起動時の doctrine:migrations:migrate）が長いときだけ延ばし、
      終わったら戻す（README の 4.12）。
  MauticCronDesiredCount:
    Type: Number
    Default: 0
    AllowedValues: [0, 1]
  MauticCronCpu:
    Type: String
    Default: '512'
    AllowedValues: ['256', '512', '1024', '2048', '4096']
  MauticCronMemory:
    Type: String
    Default: '1024'
  ChatwootWebDesiredCount:
    Type: Number
    Default: 0
    MinValue: 0
  ChatwootWebCpu:
    Type: String
    Default: '1024'
    AllowedValues: ['256', '512', '1024', '2048', '4096']
  ChatwootWebMemory:
    Type: String
    Default: '2048'
  ChatwootWorkerDesiredCount:
    Type: Number
    Default: 0
    MinValue: 0
  ChatwootWorkerCpu:
    Type: String
    Default: '512'
    AllowedValues: ['256', '512', '1024', '2048', '4096']
  ChatwootWorkerMemory:
    Type: String
    Default: '1024'
  # ---- オンプレとの WireGuard（ADR-21。TA-06 の 5.6・wireguard.yaml）
  OnpremWireguardCidr:
    Type: String
    Default: 10.99.0.0/24
    Description: WireGuard のアドレス帯（VPC の外。VpcCidr と重ならない）。private サブネットの経路表の宛先と、EC2 の nftables に使う。EC2 の wg0 は WireguardServerAddress/24。
  WireguardServerAddress:
    Type: String
    Default: 10.99.0.1
    Description: EC2 側の WireGuard のアドレス（OnpremWireguardCidr の中。/24 で割り当てる）。
  OnpremPeerAddress:
    Type: String
    Default: 10.99.0.2
    Description: オンプレ側の WireGuard のアドレス。Webhook の宛先と、EC2 のピアの AllowedIPs（/32）になる。
  WireguardPort:
    Type: Number
    Default: 51820
    Description: WireGuard の待ち受け UDP ポート。
  WireguardIngressCidr:
    Type: String
    Default: 0.0.0.0/0
    Description: WireGuard の UDP を受ける送信元の CIDR。オンプレの送信元 IP が固定でないため既定は 0.0.0.0/0（守りは WireGuard の鍵の認証）。固定の IP が使えるなら絞る。
  OnpremWebhookPort:
    Type: Number
    Default: 5680
    Description: オンプレのリバースプロキシ（n8n の /webhook/* だけを通す）のポート。OnpremPeerAddress にだけ開く。
  OnpremWireguardPublicKey:
    Type: String
    Default: ''
    AllowedPattern: '^$|^[A-Za-z0-9+/]{43}=$'
    ConstraintDescription: WireGuard の公開鍵（base64 の 44 文字）。空なら未設定。
    Description: オンプレの WireGuard の公開鍵（秘密鍵ではない）。空のあいだ、EC2 はピアを持たない。EC2 の公開鍵を取り出してオンプレに設定してから入れる（README の 4.2）。
  WireguardInstanceType:
    Type: String
    Default: t4g.nano
    AllowedPattern: '^t4g\..+$'
    ConstraintDescription: arm64（Graviton）のインスタンスタイプにする（AMI が arm64）。
  # 親では String（SSM の名前のまま子に渡す）。解決は子（wireguard.yaml の AmiSsmId。SSM 型）が行う。
  # 親も SSM 型にすると、親が解決した ami-... を子がもう一度パラメータの名前として引きに行き、作成が失敗する。
  WireguardAmiSsmId:
    Type: String
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-arm64
    Description: >-
      AMI の SSM パラメータの名前（Amazon Linux 2023・arm64。AMI の ID ではない）。WireguardFixedAmiId が空のときだけ使う。
      「最新」を指すので、新しい AMI が出たあとの更新でインスタンスが置き換わり、秘密鍵が失われて公開鍵が変わる（オンプレの更新が要る）。
      初回のデプロイのあとは WireguardFixedAmiId で固定する（README の 4.2）。
  WireguardFixedAmiId:
    Type: String
    Default: ''
    AllowedPattern: '^$|^ami-[0-9a-f]{8,17}$'
    ConstraintDescription: AMI の ID（ami-...）か、空。
    Description: WireGuard の EC2 の AMI の ID。空でなければ WireguardAmiSsmId より優先する。初回のデプロイのあと、動いている EC2 の AMI の ID を入れて固定する。
  RdsCaSha256:
    Type: String
    Default: fe45bbebf92ad3e27a583bbb2ddd1553c521ed4d49af5514dc0a40372ea5395c
    Description: >-
      RDS の CA 束（global-bundle.pem）の SHA-256。ops-tasks の DB 作成タスクが起動時に束を取得して照合する。
      cloud/images/*/Dockerfile の RDS_CA_SHA256 と同じ値にする（README の 4.7）。
  VpcCidr:
    Type: String
    Default: 10.20.0.0/16
    Description: VPC の CIDR。デフォルト VPC（172.31.0.0/16）と重ならない範囲にする。サブネットの既定の CIDR もこの中にある。
  MauticMountConfigVolume:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: Mautic の config ディレクトリを EFS で覆うか（local.php を再起動で消さない）。公式イメージの config は空（.gitkeep だけ）なので、覆っても既定のファイルは隠れない。
  ChatwootMailerSenderEmail:
    Type: String
    Default: Chatwoot <no-reply@comegin.com>
    Description: Chatwoot の送信元。SES で検証済みのドメインのアドレスにする。
  GoogleClientId:
    Type: String
    Default: ''
    Description: admin-auth の Google の OAuth クライアント ID（Workspace の「内部」）。人間が Google Cloud で発行して入れる。
  AdminBootstrapEmails:
    Type: String
    Default: ''
    Description: admin-auth の管理者の許可リストの初期値（カンマ区切り）。
  ConsentPolicyVersion:
    Type: String
    Default: '2026-10-01'
    Description: 現行のプライバシーポリシー・Cookie 文面の版（consent-api が記録と Cookie に入れる）。
  # 予約同時実行数は、0 なら付けない（Lambda に 0 を渡すと全部止まるので、子が条件で外す）。
  # アカウントの同時実行数の上限が 121 未満だと、予約を 1 つでも付けた関数の作成が失敗する。このアカウントは 10 から 1,000 に
  # 引き上げ済み（2026-10-27 に GetAccountSettings で確認。cloud/README.md の 2 節）。0 は、上限が足りない別のアカウントに出すときの逃げ道。
  ConsentApiReservedConcurrency:
    Type: Number
    Default: 10
    MinValue: 0
    Description: consent-api（Lambda）の予約同時実行数（暫定値。docs/superpowers/specs/2026-10-12-consent-api-lambda-design.md の 12 節）。0 なら付けない
  AdminAuthReservedConcurrency:
    Type: Number
    Default: 5
    MinValue: 0
    Description: admin-auth（Lambda の本体）の予約同時実行数（暫定値。docs/superpowers/specs/2026-10-12-admin-auth-lambda-design.md の 12 節）。0 なら付けない
  AdminAuthOpsReservedConcurrency:
    Type: Number
    Default: 1
    AllowedValues: [0, 1]
    Description: admin-auth の運用の Lambda の予約同時実行数（1 で移行と登録が重ねて走らない）。0 なら付けない
  FaqBotReservedConcurrency:
    Type: Number
    Default: 5
    MinValue: 0
    Description: faq-bot（Lambda）の予約同時実行数（費用と乱用の上限。関数 URL は署名を関数の中で検査する）。0 なら付けない
  AdminAuthProvisionedConcurrency:
    Type: Number
    Default: 0
    MinValue: 0
    Description: admin-auth（本体）のプロビジョニングされた同時実行数。0 なら付けない。Wave 4 で ALB の IdP の呼び出しが遅ければ 1 にする（月 4〜5 USD 前後）
  FaqBotChatwootAccountId:
    Type: Number
    Default: 1
    MinValue: 1
    Description: faq-bot が操作する Chatwoot のアカウントの ID
  FaqMatchHigh:
    Type: String
    Default: '0.5'
    Description: faq-bot が答える 1 位のスコアの下限（docs/superpowers/specs/2026-10-11-faq-bot-design.md の 7.2）
  FaqMatchLow:
    Type: String
    Default: '0.25'
    Description: faq-bot が候補を出す 1 位のスコアの下限
  FaqMatchMargin:
    Type: String
    Default: '0.1'
    Description: faq-bot が答えるときの 1 位と 2 位の差の下限

# Fargate の CPU とメモリの組み合わせの検査（変更セットを作る前に止める。タスク定義の登録で失敗させない）。
# 出典: https://docs.aws.amazon.com/AmazonECS/latest/developerguide/fargate-tasks-services.html（Task CPU and memory。Linux）。
# CPU は各サービスのパラメータの AllowedValues（256〜4096）。メモリは MiB の文字列で書く（例 '2048'）。
Rules:
  MauticWebCpu256Memory:
    RuleCondition: !Equals [!Ref MauticWebCpu, '256']
    Assertions:
      - Assert: !Contains [['512', '1024', '2048'], !Ref MauticWebMemory]
        AssertDescription: MauticWebCpu=256 のとき MauticWebMemory は 512〜2048（512・1024・2048）
  MauticWebCpu512Memory:
    RuleCondition: !Equals [!Ref MauticWebCpu, '512']
    Assertions:
      - Assert: !Contains [['1024', '2048', '3072', '4096'], !Ref MauticWebMemory]
        AssertDescription: MauticWebCpu=512 のとき MauticWebMemory は 1024〜4096（1024 刻み）
  MauticWebCpu1024Memory:
    RuleCondition: !Equals [!Ref MauticWebCpu, '1024']
    Assertions:
      - Assert: !Contains [['2048', '3072', '4096', '5120', '6144', '7168', '8192'], !Ref MauticWebMemory]
        AssertDescription: MauticWebCpu=1024 のとき MauticWebMemory は 2048〜8192（1024 刻み）
  MauticWebCpu2048Memory:
    RuleCondition: !Equals [!Ref MauticWebCpu, '2048']
    Assertions:
      - Assert: !Contains [['4096', '5120', '6144', '7168', '8192', '9216', '10240', '11264', '12288', '13312', '14336', '15360', '16384'], !Ref MauticWebMemory]
        AssertDescription: MauticWebCpu=2048 のとき MauticWebMemory は 4096〜16384（1024 刻み）
  MauticWebCpu4096Memory:
    RuleCondition: !Equals [!Ref MauticWebCpu, '4096']
    Assertions:
      - Assert: !Contains [['8192', '9216', '10240', '11264', '12288', '13312', '14336', '15360', '16384', '17408', '18432', '19456', '20480', '21504', '22528', '23552', '24576', '25600', '26624', '27648', '28672', '29696', '30720'], !Ref MauticWebMemory]
        AssertDescription: MauticWebCpu=4096 のとき MauticWebMemory は 8192〜30720（1024 刻み）
  MauticCronCpu256Memory:
    RuleCondition: !Equals [!Ref MauticCronCpu, '256']
    Assertions:
      - Assert: !Contains [['512', '1024', '2048'], !Ref MauticCronMemory]
        AssertDescription: MauticCronCpu=256 のとき MauticCronMemory は 512〜2048（512・1024・2048）
  MauticCronCpu512Memory:
    RuleCondition: !Equals [!Ref MauticCronCpu, '512']
    Assertions:
      - Assert: !Contains [['1024', '2048', '3072', '4096'], !Ref MauticCronMemory]
        AssertDescription: MauticCronCpu=512 のとき MauticCronMemory は 1024〜4096（1024 刻み）
  MauticCronCpu1024Memory:
    RuleCondition: !Equals [!Ref MauticCronCpu, '1024']
    Assertions:
      - Assert: !Contains [['2048', '3072', '4096', '5120', '6144', '7168', '8192'], !Ref MauticCronMemory]
        AssertDescription: MauticCronCpu=1024 のとき MauticCronMemory は 2048〜8192（1024 刻み）
  MauticCronCpu2048Memory:
    RuleCondition: !Equals [!Ref MauticCronCpu, '2048']
    Assertions:
      - Assert: !Contains [['4096', '5120', '6144', '7168', '8192', '9216', '10240', '11264', '12288', '13312', '14336', '15360', '16384'], !Ref MauticCronMemory]
        AssertDescription: MauticCronCpu=2048 のとき MauticCronMemory は 4096〜16384（1024 刻み）
  MauticCronCpu4096Memory:
    RuleCondition: !Equals [!Ref MauticCronCpu, '4096']
    Assertions:
      - Assert: !Contains [['8192', '9216', '10240', '11264', '12288', '13312', '14336', '15360', '16384', '17408', '18432', '19456', '20480', '21504', '22528', '23552', '24576', '25600', '26624', '27648', '28672', '29696', '30720'], !Ref MauticCronMemory]
        AssertDescription: MauticCronCpu=4096 のとき MauticCronMemory は 8192〜30720（1024 刻み）
  ChatwootWebCpu256Memory:
    RuleCondition: !Equals [!Ref ChatwootWebCpu, '256']
    Assertions:
      - Assert: !Contains [['512', '1024', '2048'], !Ref ChatwootWebMemory]
        AssertDescription: ChatwootWebCpu=256 のとき ChatwootWebMemory は 512〜2048（512・1024・2048）
  ChatwootWebCpu512Memory:
    RuleCondition: !Equals [!Ref ChatwootWebCpu, '512']
    Assertions:
      - Assert: !Contains [['1024', '2048', '3072', '4096'], !Ref ChatwootWebMemory]
        AssertDescription: ChatwootWebCpu=512 のとき ChatwootWebMemory は 1024〜4096（1024 刻み）
  ChatwootWebCpu1024Memory:
    RuleCondition: !Equals [!Ref ChatwootWebCpu, '1024']
    Assertions:
      - Assert: !Contains [['2048', '3072', '4096', '5120', '6144', '7168', '8192'], !Ref ChatwootWebMemory]
        AssertDescription: ChatwootWebCpu=1024 のとき ChatwootWebMemory は 2048〜8192（1024 刻み）
  ChatwootWebCpu2048Memory:
    RuleCondition: !Equals [!Ref ChatwootWebCpu, '2048']
    Assertions:
      - Assert: !Contains [['4096', '5120', '6144', '7168', '8192', '9216', '10240', '11264', '12288', '13312', '14336', '15360', '16384'], !Ref ChatwootWebMemory]
        AssertDescription: ChatwootWebCpu=2048 のとき ChatwootWebMemory は 4096〜16384（1024 刻み）
  ChatwootWebCpu4096Memory:
    RuleCondition: !Equals [!Ref ChatwootWebCpu, '4096']
    Assertions:
      - Assert: !Contains [['8192', '9216', '10240', '11264', '12288', '13312', '14336', '15360', '16384', '17408', '18432', '19456', '20480', '21504', '22528', '23552', '24576', '25600', '26624', '27648', '28672', '29696', '30720'], !Ref ChatwootWebMemory]
        AssertDescription: ChatwootWebCpu=4096 のとき ChatwootWebMemory は 8192〜30720（1024 刻み）
  ChatwootWorkerCpu256Memory:
    RuleCondition: !Equals [!Ref ChatwootWorkerCpu, '256']
    Assertions:
      - Assert: !Contains [['512', '1024', '2048'], !Ref ChatwootWorkerMemory]
        AssertDescription: ChatwootWorkerCpu=256 のとき ChatwootWorkerMemory は 512〜2048（512・1024・2048）
  ChatwootWorkerCpu512Memory:
    RuleCondition: !Equals [!Ref ChatwootWorkerCpu, '512']
    Assertions:
      - Assert: !Contains [['1024', '2048', '3072', '4096'], !Ref ChatwootWorkerMemory]
        AssertDescription: ChatwootWorkerCpu=512 のとき ChatwootWorkerMemory は 1024〜4096（1024 刻み）
  ChatwootWorkerCpu1024Memory:
    RuleCondition: !Equals [!Ref ChatwootWorkerCpu, '1024']
    Assertions:
      - Assert: !Contains [['2048', '3072', '4096', '5120', '6144', '7168', '8192'], !Ref ChatwootWorkerMemory]
        AssertDescription: ChatwootWorkerCpu=1024 のとき ChatwootWorkerMemory は 2048〜8192（1024 刻み）
  ChatwootWorkerCpu2048Memory:
    RuleCondition: !Equals [!Ref ChatwootWorkerCpu, '2048']
    Assertions:
      - Assert: !Contains [['4096', '5120', '6144', '7168', '8192', '9216', '10240', '11264', '12288', '13312', '14336', '15360', '16384'], !Ref ChatwootWorkerMemory]
        AssertDescription: ChatwootWorkerCpu=2048 のとき ChatwootWorkerMemory は 4096〜16384（1024 刻み）
  ChatwootWorkerCpu4096Memory:
    RuleCondition: !Equals [!Ref ChatwootWorkerCpu, '4096']
    Assertions:
      - Assert: !Contains [['8192', '9216', '10240', '11264', '12288', '13312', '14336', '15360', '16384', '17408', '18432', '19456', '20480', '21504', '22528', '23552', '24576', '25600', '26624', '27648', '28672', '29696', '30720'], !Ref ChatwootWorkerMemory]
        AssertDescription: ChatwootWorkerCpu=4096 のとき ChatwootWorkerMemory は 8192〜30720（1024 刻み）

Resources:
  NetworkStack:
    Type: AWS::Serverless::Application
    Properties:
      Location: stacks/network.yaml
      Parameters:
        EnvName: !Ref EnvName
        VpcCidr: !Ref VpcCidr
        MauticWebPort: !Ref MauticWebPort
        ChatwootWebPort: !Ref ChatwootWebPort
        WireguardPort: !Ref WireguardPort
        WireguardIngressCidr: !Ref WireguardIngressCidr
        OnpremWebhookPort: !Ref OnpremWebhookPort
        OnpremPeerAddress: !Ref OnpremPeerAddress

  EcrStack:
    Type: AWS::Serverless::Application
    Properties:
      Location: stacks/ecr.yaml
      Parameters:
        EnvName: !Ref EnvName

  ObservabilityStack:
    Type: AWS::Serverless::Application
    Properties:
      Location: stacks/observability.yaml
      Parameters:
        EnvName: !Ref EnvName
        HeartbeatAlarmActionsEnabled: !Ref HeartbeatAlarmActionsEnabled

  RunLogArchiveStack:
    Type: AWS::Serverless::Application
    Properties:
      Location: stacks/runlog-archive.yaml
      Parameters:
        EnvName: !Ref EnvName
        RunLogAdminPrincipalArns: !Join [',', !Ref RunLogAdminPrincipalArns]

  SecretsStack:
    Type: AWS::Serverless::Application
    Properties:
      Location: stacks/secrets.yaml
      Parameters:
        EnvName: !Ref EnvName

  DataStack:
    Type: AWS::Serverless::Application
    Properties:
      Location: stacks/data.yaml
      Parameters:
        EnvName: !Ref EnvName
        PrivateSubnetIds: !GetAtt NetworkStack.Outputs.PrivateSubnetIds
        MysqlSecurityGroupId: !GetAtt NetworkStack.Outputs.MysqlSecurityGroupId
        PostgresSecurityGroupId: !GetAtt NetworkStack.Outputs.PostgresSecurityGroupId
        ValkeySecurityGroupId: !GetAtt NetworkStack.Outputs.ValkeySecurityGroupId
        EfsSecurityGroupId: !GetAtt NetworkStack.Outputs.EfsSecurityGroupId
        SecretNamePrefix: !GetAtt SecretsStack.Outputs.SecretNamePrefix
        MysqlMinCapacity: !Ref MysqlMinCapacity
        MysqlMaxCapacity: !Ref MysqlMaxCapacity
        PostgresMinCapacity: !Ref PostgresMinCapacity
        PostgresMaxCapacity: !Ref PostgresMaxCapacity
        ValkeyNodeType: !Ref ValkeyNodeType

  ClusterStack:
    Type: AWS::Serverless::Application
    Properties:
      Location: stacks/cluster.yaml
      Parameters:
        EnvName: !Ref EnvName

  EdgeStack:
    Type: AWS::Serverless::Application
    Properties:
      Location: stacks/edge.yaml
      Parameters:
        EnvName: !Ref EnvName
        VpcId: !GetAtt NetworkStack.Outputs.VpcId
        PublicSubnetIds: !GetAtt NetworkStack.Outputs.PublicSubnetIds
        AlbSecurityGroupId: !GetAtt NetworkStack.Outputs.AlbSecurityGroupId
        HostedZoneId: !Ref HostedZoneId
        SecretNamePrefix: !GetAtt SecretsStack.Outputs.SecretNamePrefix
        ChatHost: !Ref ChatHost
        MktHost: !Ref MktHost
        AuthHost: !Ref AuthHost
        ConsentHost: !Ref ConsentHost
        MauticWebPort: !Ref MauticWebPort
        ChatwootWebPort: !Ref ChatwootWebPort
        ConsentApiTargetGroupArn: !GetAtt ConsentApiService.Outputs.TargetGroupArn
        AdminAuthTargetGroupArn: !GetAtt AdminAuthService.Outputs.TargetGroupArn
        AlbOidcClientId: !Ref AlbOidcClientId
        WafRateLimitConsent: !Ref WafRateLimitConsent
        WafRateLimitForm: !Ref WafRateLimitForm
        WafRateLimitApi: !Ref WafRateLimitApi
        WafRateLimitVisitor: !Ref WafRateLimitVisitor
        WafRateLimitAuth: !Ref WafRateLimitAuth
        WafCommonRuleSetAction: !Ref WafCommonRuleSetAction

  CdnStack:
    Type: AWS::Serverless::Application
    Properties:
      Location: stacks/cdn.yaml
      Parameters:
        EnvName: !Ref EnvName
        SiteHost: !Ref SiteHost
        HostedZoneId: !Ref HostedZoneId
        AstroBucketName: !GetAtt DataStack.Outputs.AstroBucketName
        AstroBucketArn: !GetAtt DataStack.Outputs.AstroBucketArn
        AstroBucketRegionalDomainName: !GetAtt DataStack.Outputs.AstroBucketRegionalDomainName
        CloudFrontCertificateArn: !Ref CloudFrontCertificateArn
        CloudFrontWebAclArn: !Ref CloudFrontWebAclArn

  SesStack:
    Type: AWS::Serverless::Application
    Properties:
      Location: stacks/ses.yaml
      Parameters:
        EnvName: !Ref EnvName
        TlsPolicy: !Ref SesTlsPolicy
        DomainName: !Ref DomainName
        HostedZoneId: !Ref HostedZoneId

  OpsTasksStack:
    Type: AWS::Serverless::Application
    Properties:
      Location: stacks/ops-tasks.yaml
      Parameters:
        EnvName: !Ref EnvName
        SecretNamePrefix: !GetAtt SecretsStack.Outputs.SecretNamePrefix
        TasksLogGroupName: !GetAtt ClusterStack.Outputs.TasksLogGroupName
        PostgresEndpoint: !GetAtt DataStack.Outputs.PostgresEndpoint
        PostgresMasterSecretArn: !GetAtt DataStack.Outputs.PostgresMasterSecretArn
        MysqlEndpoint: !GetAtt DataStack.Outputs.MysqlEndpoint
        MysqlMasterSecretArn: !GetAtt DataStack.Outputs.MysqlMasterSecretArn
        RdsCaSha256: !Ref RdsCaSha256

  IamStack:
    Type: AWS::Serverless::Application
    Properties:
      Location: stacks/iam.yaml
      Parameters:
        EnvName: !Ref EnvName
        RunLogBucketArn: !GetAtt RunLogArchiveStack.Outputs.RunLogBucketArn
        RunLogKeyPrefix: !GetAtt RunLogArchiveStack.Outputs.RunLogKeyPrefix
        HeartbeatNamespace: !GetAtt ObservabilityStack.Outputs.HeartbeatNamespace
        N8nHeartbeatNamespace: !GetAtt ObservabilityStack.Outputs.N8nHeartbeatNamespace
        AstroBucketArn: !GetAtt DataStack.Outputs.AstroBucketArn
        DistributionArn: !GetAtt CdnStack.Outputs.DistributionArn
        StrapiMediaBucketArn: !GetAtt DataStack.Outputs.StrapiMediaBucketArn
        OpsAlertTopicArn: !GetAtt ObservabilityStack.Outputs.OpsAlertTopicArn
        LeadAlertTopicArn: !GetAtt ObservabilityStack.Outputs.LeadAlertTopicArn

  # ---- オンプレとの WireGuard（ADR-21）。EC2 1 台。SG は network.yaml、経路は private サブネットの経路表。
  WireguardStack:
    Type: AWS::Serverless::Application
    Properties:
      Location: stacks/wireguard.yaml
      Parameters:
        EnvName: !Ref EnvName
        PublicSubnetIds: !GetAtt NetworkStack.Outputs.PublicSubnetIds
        PrivateRouteTableId: !GetAtt NetworkStack.Outputs.PrivateRouteTableId
        SecurityGroupId: !GetAtt NetworkStack.Outputs.WireguardSecurityGroupId
        VpcCidr: !Ref VpcCidr
        OnpremWireguardCidr: !Ref OnpremWireguardCidr
        WireguardServerAddress: !Ref WireguardServerAddress
        OnpremPeerAddress: !Ref OnpremPeerAddress
        WireguardPort: !Ref WireguardPort
        OnpremWebhookPort: !Ref OnpremWebhookPort
        OnpremWireguardPublicKey: !Ref OnpremWireguardPublicKey
        InstanceType: !Ref WireguardInstanceType
        AmiSsmId: !Ref WireguardAmiSsmId
        FixedAmiId: !Ref WireguardFixedAmiId

  # ---- サービス（T1-3）。DesiredCount は 0 が初期値。README の順に上げる。
  MauticWebService:
    Type: AWS::Serverless::Application
    Properties:
      Location: stacks/services/mautic-web.yaml
      Parameters:
        EnvName: !Ref EnvName
        ClusterArn: !GetAtt ClusterStack.Outputs.ClusterArn
        PrivateSubnetIds: !GetAtt NetworkStack.Outputs.PrivateSubnetIds
        SecurityGroupId: !GetAtt NetworkStack.Outputs.MauticWebSecurityGroupId
        LogGroupName: !GetAtt ClusterStack.Outputs.MauticWebLogGroupName
        SecretNamePrefix: !GetAtt SecretsStack.Outputs.SecretNamePrefix
        ImageRepositoryUri: !GetAtt EcrStack.Outputs.MauticRepositoryUri
        ImageTag: !Ref MauticImageTag
        DesiredCount: !Ref MauticWebDesiredCount
        Cpu: !Ref MauticWebCpu
        Memory: !Ref MauticWebMemory
        ContainerPort: !Ref MauticWebPort
        TargetGroupArn: !GetAtt EdgeStack.Outputs.MauticWebTargetGroupArn
        HealthCheckGracePeriodSeconds: !Ref MauticWebHealthCheckGracePeriodSeconds
        MysqlEndpoint: !GetAtt DataStack.Outputs.MysqlEndpoint
        MktHost: !Ref MktHost
        TrustedProxyCidr: !Ref VpcCidr
        EfsFileSystemId: !GetAtt DataStack.Outputs.EfsFileSystemId
        MediaImagesAccessPointId: !GetAtt DataStack.Outputs.MauticMediaImagesAccessPointId
        MediaFilesAccessPointId: !GetAtt DataStack.Outputs.MauticMediaFilesAccessPointId
        ConfigAccessPointId: !GetAtt DataStack.Outputs.MauticConfigAccessPointId
        MountConfigVolume: !Ref MauticMountConfigVolume

  MauticCronService:
    Type: AWS::Serverless::Application
    Properties:
      Location: stacks/services/mautic-cron.yaml
      Parameters:
        NightlyStopEnabled: !Ref NightlyStopEnabled
        NightlyStopSchedule: !Ref NightlyStopSchedule
        NightlyStartSchedule: !Ref NightlyStartSchedule
        NightlyStopTimezone: !Ref NightlyStopTimezone
        EnvName: !Ref EnvName
        ClusterArn: !GetAtt ClusterStack.Outputs.ClusterArn
        PrivateSubnetIds: !GetAtt NetworkStack.Outputs.PrivateSubnetIds
        SecurityGroupId: !GetAtt NetworkStack.Outputs.MauticCronSecurityGroupId
        LogGroupName: !GetAtt ClusterStack.Outputs.MauticCronLogGroupName
        SecretNamePrefix: !GetAtt SecretsStack.Outputs.SecretNamePrefix
        ImageRepositoryUri: !GetAtt EcrStack.Outputs.MauticRepositoryUri
        ImageTag: !Ref MauticImageTag
        DesiredCount: !Ref MauticCronDesiredCount
        Cpu: !Ref MauticCronCpu
        Memory: !Ref MauticCronMemory
        MysqlEndpoint: !GetAtt DataStack.Outputs.MysqlEndpoint
        MktHost: !Ref MktHost
        TrustedProxyCidr: !Ref VpcCidr
        EfsFileSystemId: !GetAtt DataStack.Outputs.EfsFileSystemId
        MediaImagesAccessPointId: !GetAtt DataStack.Outputs.MauticMediaImagesAccessPointId
        MediaFilesAccessPointId: !GetAtt DataStack.Outputs.MauticMediaFilesAccessPointId
        ConfigAccessPointId: !GetAtt DataStack.Outputs.MauticConfigAccessPointId
        MountConfigVolume: !Ref MauticMountConfigVolume

  ChatwootWebService:
    Type: AWS::Serverless::Application
    Properties:
      Location: stacks/services/chatwoot-web.yaml
      Parameters:
        NightlyStopEnabled: !Ref NightlyStopEnabled
        NightlyStopSchedule: !Ref NightlyStopSchedule
        NightlyStartSchedule: !Ref NightlyStartSchedule
        NightlyStopTimezone: !Ref NightlyStopTimezone
        EnvName: !Ref EnvName
        ClusterArn: !GetAtt ClusterStack.Outputs.ClusterArn
        PrivateSubnetIds: !GetAtt NetworkStack.Outputs.PrivateSubnetIds
        SecurityGroupId: !GetAtt NetworkStack.Outputs.ChatwootWebSecurityGroupId
        LogGroupName: !GetAtt ClusterStack.Outputs.ChatwootWebLogGroupName
        SecretNamePrefix: !GetAtt SecretsStack.Outputs.SecretNamePrefix
        ImageRepositoryUri: !GetAtt EcrStack.Outputs.ChatwootRepositoryUri
        ImageTag: !Ref ChatwootImageTag
        DesiredCount: !Ref ChatwootWebDesiredCount
        Cpu: !Ref ChatwootWebCpu
        Memory: !Ref ChatwootWebMemory
        ContainerPort: !Ref ChatwootWebPort
        TargetGroupArn: !GetAtt EdgeStack.Outputs.ChatwootWebTargetGroupArn
        PostgresEndpoint: !GetAtt DataStack.Outputs.PostgresEndpoint
        ValkeyEndpoint: !GetAtt DataStack.Outputs.ValkeyEndpoint
        ChatHost: !Ref ChatHost
        DomainName: !Ref DomainName
        AttachmentBucketName: !GetAtt DataStack.Outputs.ChatwootBucketName
        AttachmentBucketArn: !GetAtt DataStack.Outputs.ChatwootBucketArn
        MailerSenderEmail: !Ref ChatwootMailerSenderEmail

  ChatwootWorkerService:
    Type: AWS::Serverless::Application
    Properties:
      Location: stacks/services/chatwoot-worker.yaml
      Parameters:
        NightlyStopEnabled: !Ref NightlyStopEnabled
        NightlyStopSchedule: !Ref NightlyStopSchedule
        NightlyStartSchedule: !Ref NightlyStartSchedule
        NightlyStopTimezone: !Ref NightlyStopTimezone
        EnvName: !Ref EnvName
        ClusterArn: !GetAtt ClusterStack.Outputs.ClusterArn
        PrivateSubnetIds: !GetAtt NetworkStack.Outputs.PrivateSubnetIds
        SecurityGroupId: !GetAtt NetworkStack.Outputs.ChatwootWorkerSecurityGroupId
        LogGroupName: !GetAtt ClusterStack.Outputs.ChatwootWorkerLogGroupName
        SecretNamePrefix: !GetAtt SecretsStack.Outputs.SecretNamePrefix
        ImageRepositoryUri: !GetAtt EcrStack.Outputs.ChatwootRepositoryUri
        ImageTag: !Ref ChatwootImageTag
        DesiredCount: !Ref ChatwootWorkerDesiredCount
        Cpu: !Ref ChatwootWorkerCpu
        Memory: !Ref ChatwootWorkerMemory
        PostgresEndpoint: !GetAtt DataStack.Outputs.PostgresEndpoint
        ValkeyEndpoint: !GetAtt DataStack.Outputs.ValkeyEndpoint
        ChatHost: !Ref ChatHost
        DomainName: !Ref DomainName
        AttachmentBucketName: !GetAtt DataStack.Outputs.ChatwootBucketName
        AttachmentBucketArn: !GetAtt DataStack.Outputs.ChatwootBucketArn
        MailerSenderEmail: !Ref ChatwootMailerSenderEmail

  # ---- admin-auth（ADR-26。VPC の中の Lambda 2 つ。ALB のターゲットグループもこのスタックが持ち、EdgeStack に渡す）
  # AlbProtectedHosts は EdgeStack の出力を使わずに親で組み立てる（edge がこのスタックを参照するため、使うと循環する。値は同じ）
  AdminAuthService:
    Type: AWS::Serverless::Application
    Properties:
      Location: stacks/services/admin-auth.yaml
      Parameters:
        EnvName: !Ref EnvName
        PrivateSubnetIds: !GetAtt NetworkStack.Outputs.PrivateSubnetIds
        SecurityGroupId: !GetAtt NetworkStack.Outputs.AdminAuthSecurityGroupId
        SecretNamePrefix: !GetAtt SecretsStack.Outputs.SecretNamePrefix
        PostgresEndpoint: !GetAtt DataStack.Outputs.PostgresEndpoint
        AuthHost: !Ref AuthHost
        DomainName: !Ref DomainName
        GoogleClientId: !Ref GoogleClientId
        AdminBootstrapEmails: !Ref AdminBootstrapEmails
        AlbClientId: !Ref AlbOidcClientId
        AlbProtectedHosts: !Join [',', [!Ref ChatHost, !Ref MktHost]]
        ReservedConcurrency: !Ref AdminAuthReservedConcurrency
        OpsReservedConcurrency: !Ref AdminAuthOpsReservedConcurrency
        ProvisionedConcurrency: !Ref AdminAuthProvisionedConcurrency

  # ---- consent-api（ADR-26。VPC の中の Lambda。ALB のターゲットグループもこのスタックが持ち、EdgeStack に渡す）
  ConsentApiService:
    Type: AWS::Serverless::Application
    Properties:
      Location: stacks/services/consent-api.yaml
      Parameters:
        EnvName: !Ref EnvName
        PrivateSubnetIds: !GetAtt NetworkStack.Outputs.PrivateSubnetIds
        SecurityGroupId: !GetAtt NetworkStack.Outputs.ConsentApiSecurityGroupId
        SecretNamePrefix: !GetAtt SecretsStack.Outputs.SecretNamePrefix
        ValkeyEndpoint: !GetAtt DataStack.Outputs.ValkeyEndpoint
        SiteUrl: !Sub 'https://${SiteHost}'
        CookieDomain: !Sub '.${DomainName}'
        ConsentPolicyVersion: !Ref ConsentPolicyVersion
        ReservedConcurrency: !Ref ConsentApiReservedConcurrency

  # ---- faq-bot（ADR-26。Lambda。VPC の外）
  FaqBotService:
    Type: AWS::Serverless::Application
    Properties:
      Location: stacks/services/faq-bot.yaml
      Parameters:
        EnvName: !Ref EnvName
        SecretNamePrefix: !GetAtt SecretsStack.Outputs.SecretNamePrefix
        ChatwootBaseUrl: !Sub 'https://${ChatHost}'
        ChatwootAccountId: !Ref FaqBotChatwootAccountId
        FaqUrl: !Sub 'https://${SiteHost}/faq.json'
        FaqMatchHigh: !Ref FaqMatchHigh
        FaqMatchLow: !Ref FaqMatchLow
        FaqMatchMargin: !Ref FaqMatchMargin
        ReservedConcurrency: !Ref FaqBotReservedConcurrency

  # ---- アラーム（T1-4）。すべて ops トピックへ直接発行する。
  AlarmsStack:
    Type: AWS::Serverless::Application
    Properties:
      Location: stacks/alarms.yaml
      Parameters:
        EnvName: !Ref EnvName
        OpsAlertTopicArn: !GetAtt ObservabilityStack.Outputs.OpsAlertTopicArn
        ClusterName: !GetAtt ClusterStack.Outputs.ClusterName
        AlbFullName: !GetAtt EdgeStack.Outputs.AlbFullName
        MauticWebTargetGroupFullName: !GetAtt EdgeStack.Outputs.MauticWebTargetGroupFullName
        ChatwootWebTargetGroupFullName: !GetAtt EdgeStack.Outputs.ChatwootWebTargetGroupFullName
        AdminAuthTargetGroupFullName: !GetAtt AdminAuthService.Outputs.TargetGroupFullName
        ConsentApiTargetGroupFullName: !GetAtt ConsentApiService.Outputs.TargetGroupFullName
        MysqlClusterIdentifier: !GetAtt DataStack.Outputs.MysqlClusterIdentifier
        MysqlInstanceIdentifier: !GetAtt DataStack.Outputs.MysqlInstanceIdentifier
        PostgresClusterIdentifier: !GetAtt DataStack.Outputs.PostgresClusterIdentifier
        PostgresInstanceIdentifier: !GetAtt DataStack.Outputs.PostgresInstanceIdentifier
        ValkeyReplicationGroupId: !GetAtt DataStack.Outputs.ValkeyReplicationGroupId
        WireguardInstanceId: !GetAtt WireguardStack.Outputs.InstanceId
        FaqBotFunctionName: !GetAtt FaqBotService.Outputs.FunctionName
        ConsentApiFunctionName: !GetAtt ConsentApiService.Outputs.FunctionName
        AdminAuthFunctionName: !GetAtt AdminAuthService.Outputs.FunctionName

Outputs:
  FaqBotFunctionUrl:
    Description: Chatwoot のエージェントボット「FAQ ボット」の outgoing_url（この値の末尾に webhook を付ける。cloud/README.md）
    Value: !GetAtt FaqBotService.Outputs.FunctionUrl

  # 監視アプリの設定（frontend/next-js の .env）に人が写す値。
  RunLogBucketName:
    Description: 監視アプリの RUNLOG_BUCKET
    Value: !GetAtt RunLogArchiveStack.Outputs.RunLogBucketName
  HeartbeatNamespace:
    Description: 監視アプリの HEARTBEAT_NAMESPACE
    Value: !GetAtt ObservabilityStack.Outputs.HeartbeatNamespace
  N8nHeartbeatNamespace:
    Description: オンプレの n8n の ops_settings.heartbeatNamespace（ハートビートの名前空間。ずれると IAM の条件で拒否される）
    Value: !GetAtt ObservabilityStack.Outputs.N8nHeartbeatNamespace
  N8nScheduleHeartbeatAlarmName:
    Description: n8n のスケジュール実行のハートビートのアラーム。開発機を止めるときは HeartbeatAlarmName と一緒にアクションを無効にする。
    Value: !GetAtt ObservabilityStack.Outputs.N8nScheduleHeartbeatAlarmName
  LeadAlertTopicArn:
    Value: !GetAtt ObservabilityStack.Outputs.LeadAlertTopicArn
  OpsAlertTopicArn:
    Value: !GetAtt ObservabilityStack.Outputs.OpsAlertTopicArn
  AlbDnsName:
    Value: !GetAtt EdgeStack.Outputs.AlbDnsName
  ControlPlanePolicyArn:
    Description: 監視アプリ用の管理ポリシー。写し用の IAM ユーザー（またはロール）に付ける（README）。
    Value: !GetAtt IamStack.Outputs.ControlPlanePolicyArn
  DeployPolicyArn:
    Description: 配信用の管理ポリシー。配信を実行する人間の主体に付ける（README）。
    Value: !GetAtt IamStack.Outputs.DeployPolicyArn

  # 運用者が README の手順で使う値（RunTask の指定など）。
  ClusterName:
    Value: !GetAtt ClusterStack.Outputs.ClusterName
  PrivateSubnetIds:
    Value: !GetAtt NetworkStack.Outputs.PrivateSubnetIds
  OpsTasksSecurityGroupId:
    Value: !GetAtt NetworkStack.Outputs.OpsTasksSecurityGroupId
  PostgresInitTaskDefinitionArn:
    Value: !GetAtt OpsTasksStack.Outputs.PostgresInitTaskDefinitionArn
  MysqlInitTaskDefinitionArn:
    Value: !GetAtt OpsTasksStack.Outputs.MysqlInitTaskDefinitionArn
  AstroBucketName:
    Description: 配信の s3 sync の宛先
    Value: !GetAtt DataStack.Outputs.AstroBucketName
  DistributionId:
    Description: 配信後のキャッシュ無効化の対象。global/template.yaml の DistributionArn にも使う。
    Value: !GetAtt CdnStack.Outputs.DistributionId
  DistributionArn:
    Value: !GetAtt CdnStack.Outputs.DistributionArn
  AlbProtectedHosts:
    Description: admin-auth の ALB_PROTECTED_HOSTS
    Value: !GetAtt EdgeStack.Outputs.AlbProtectedHosts
  ChatwootWebSecurityGroupId:
    Description: chatwoot の db:chatwoot_prepare を RunTask で実行するときのセキュリティグループ（DB と Valkey に届く）
    Value: !GetAtt NetworkStack.Outputs.ChatwootWebSecurityGroupId
  AdminAuthOpsFunctionName:
    Description: admin-auth の運用の Lambda（migrate・register-alb-client。cloud/README の 4.19）
    Value: !GetAtt AdminAuthService.Outputs.OpsFunctionName
  MauticWebSecurityGroupId:
    Description: Mautic のコマンドを RunTask で実行するときのセキュリティグループ（MySQL と EFS に届く）
    Value: !GetAtt NetworkStack.Outputs.MauticWebSecurityGroupId

  # オンプレとの WireGuard（README の 4.2）。
  WireguardPublicIp:
    Description: オンプレの WireGuard の Endpoint（<この値>:<WireguardPort>）に入れる Elastic IP
    Value: !GetAtt WireguardStack.Outputs.PublicIp
  WireguardServerPublicKeyParameterName:
    Description: EC2 の WireGuard の公開鍵を書く SSM パラメータの名前（オンプレの Peer の PublicKey の取り出し先）
    Value: !GetAtt WireguardStack.Outputs.ServerPublicKeyParameterName
  OnpremPublicKeyParameterName:
    Description: オンプレの WireGuard の公開鍵を入れる SSM パラメータの名前（EC2 が数分ごとに読む）
    Value: !GetAtt WireguardStack.Outputs.OnpremPublicKeyParameterName
  WireguardInstanceId:
    Description: SSM Session Manager で入る EC2 のインスタンス ID
    Value: !GetAtt WireguardStack.Outputs.InstanceId

  # オンプレの資格情報（IAM ユーザー。アクセスキーは作らない。README の 4.5）。
  OnpremStrapiMediaUserName:
    Description: オンプレの Strapi のメディア用 IAM ユーザー。アクセスキーは人が発行して、オンプレの秘匿ファイルにだけ置く。
    Value: !GetAtt IamStack.Outputs.OnpremStrapiMediaUserName
  OnpremN8nSnsUserName:
    Description: オンプレの n8n の SNS 発行用 IAM ユーザー。アクセスキーは人が発行して、オンプレの秘匿ファイルにだけ置く。
    Value: !GetAtt IamStack.Outputs.OnpremN8nSnsUserName
