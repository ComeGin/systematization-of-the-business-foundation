id: weekly-observe-lighthouse
description: "Lighthouse の計測結果を E-12（source: lighthouse）に正規化する。計測（weekly-lighthouse）の完了を待つ"
enabled: true
cron: "45 1 * * 1"
kind: agent
agent: seo-auditor
builtin: null
after:
  - weekly-lighthouse
prompt: |
  次の source だけを処理する: lighthouse

  取得の範囲（変えない）:
  - frontend/verdant-virgo/.lighthouse/manifest.json の、isRepresentativeRun が true の行（3 回計測の中央値）を URL ごとに 1 件
  - 指標は LH-seo・LH-performance・LH-a11y・LH-best-practices
  - 同じ target_ref の直前の E-12 と比べた前回比を本文に書く

  gsc・serp・site_audit は処理しない。
timeout_sec: 900
max_turns: 40
# 監視アプリに出す説明（2026-11-06。docs/superpowers/specs/2026-11-06-job-agent-info-design.md の 4 節）
overview: |
  計測（weekly-lighthouse）が当日に成功で終わるのを待って、Agent seo-auditor を起動する。.lighthouse/manifest.json の代表の回（3 回計測の中央値）を URL ごとに読み、LH-seo・LH-performance・LH-a11y・LH-best-practices を E-12（source: lighthouse）に正規化し、前回比を本文に書く。
stage: observe
io:
  reads:
    - "作業ツリーの frontend/verdant-virgo/.lighthouse/（manifest.json と結果）"
    - "前回の E-12（docs/audits/lighthouse/）"
  writes:
    - "E-12（docs/audits/lighthouse/。作業ツリー）"
  does_not_write:
    - "本番の製品"
    - "ほかの source（gsc・serp・site_audit）"
